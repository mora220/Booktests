</svg></span></div>", "s": [], "c": 4}]}, {"id": "L1-40", "n": 40, "t": "Ordering and Comparing", "concept": "Who is the tallest? Who arrived first? Who is the youngest? We compare lots of facts.", "fast": ["If you are asked for the tallest, biggest or first (or the shortest, smallest or last): solve by elimination.", "Elimination: cross out every name that a sentence tells you is beaten by someone else; the name left is the answer — no need to order everyone.", "If you are asked for the second or third: order the names with arrows (Salem → Fahd → Ali), then count."], "trap": null, "table": null, "new": false, "ex": {"q": "Salem is taller than Fahd, Fahd is taller than Ali, and Majed is shorter than Ali. Who is the shortest?", "o": ["Salem", "Fahd", "Ali", "Majed"], "a": 3, "f": "", "s": ["We need the shortest → cross out everyone who is taller than someone:", "Salem ✗ (taller than Fahd), Fahd ✗ (taller than Ali), Ali ✗ (taller than Majed) → Majed is left ✓.", "If asked who is second tallest, use arrows: Salem → Fahd → Ali → Majed → second is Fahd."], "c": 4}, "pr": [{"q": "Saad arrived after Khalid and before Nayef, and Badr arrived after Nayef. Who arrived first?", "o": ["Saad", "Khalid", "Nayef", "Badr"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "In a queue of 4 people, Ahmed is before Khalid, and Samir is after Khalid and before Ali. Who is third?", "o": ["Ahmed", "Khalid", "Samir", "Ali"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L1-41", "n": 41, "t": "Folding, Holes and Mirrors", "concept": "Paper is folded and then punched, or a shape is seen in a mirror.", "fast": ["Each fold doubles the holes: one fold → 2, two folds → 4.", "When opened, the shape is the same on both sides of the fold line.", "A mirror swaps left and right, but not top and bottom."], "trap": null, "table": null, "new": false, "ex": {"q": "A sheet of paper is folded in half and one hole is punched. How many holes are there when it is opened?", "o": ["1", "2", "3", "4"], "a": 1, "f": "", "s": ["The paper has two layers → the hole goes through both → 2 holes."], "c": 4}, "pr": [{"q": "A sheet is folded in half and then in half again, and punched once. How many holes when opened?", "o": ["2", "3", "4", "8"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "Which arrow looks the same in a mirror?", "o": ["<svg class=\"fig sm\" viewBox=\"0 0 50 50\" width=\"50\" height=\"50\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"2\" y=\"2\" width=\"46\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#cbd5e1\"/><g transform=\"rotate(90 25.0 25.0)\"><line x1=\"25.0\" y1=\"40.0\" x2=\"25.0\" y2=\"15.0\" stroke=\"#134e4a\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"25.0,7.0 17.0,19.0 33.0,19.0\" fill=\"#134e4a\"/></g></svg>", "<svg class=\"fig sm\" viewBox=\"0 0 50 50\" width=\"50\" height=\"50\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"2\" y=\"2\" width=\"46\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#cbd5e1\"/><g transform=\"rotate(270 25.0 25.0)\"><line x1=\"25.0\" y1=\"40.0\" x2=\"25.0\" y2=\"15.0\" stroke=\"#134e4a\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"25.0,7.0 17.0,19.0 33.0,19.0\" fill=\"#134e4a\"/></g></svg>", "<svg class=\"fig sm\" viewBox=\"0 0 50 50\" width=\"50\" height=\"50\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"2\" y=\"2\" width=\"46\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#cbd5e1\"/><g transform=\"rotate(0 25.0 25.0)\"><line x1=\"25.0\" y1=\"40.0\" x2=\"25.0\" y2=\"15.0\" stroke=\"#134e4a\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"25.0,7.0 17.0,19.0 33.0,19.0\" fill=\"#134e4a\"/></g></svg>", "<svg class=\"fig sm\" viewBox=\"0 0 50 50\" width=\"50\" height=\"50\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"2\" y=\"2\" width=\"46\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#cbd5e1\"/><g transform=\"rotate(45 25.0 25.0)\"><line x1=\"25.0\" y1=\"40.0\" x2=\"25.0\" y2=\"15.0\" stroke=\"#134e4a\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"25.0,7.0 17.0,19.0 33.0,19.0\" fill=\"#134e4a\"/></g></svg>"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L1-42", "n": 42, "t": "Step-by-Step Number Puzzles", "concept": "Linked facts about numbers of things or people; find the total or one of them.", "fast": ["Start with the fact that has a known number.", "Work out whatever is linked to it directly, and write each number next to its name.", "Add at the end, and check the conditions."], "trap": null, "table": null, "new": false, "ex": {"q": "A farm has cows, sheep and camels: 8 cows, twice as many sheep as cows, and 5 fewer camels than sheep. How many animals altogether?", "o": ["24", "28", "35", "32"], "a": 2, "f": "", "s": ["Cows 8 → sheep 16 → camels 11 → total 8 + 16 + 11 = 35."], "c": 4}, "pr": [{"q": "Amal has twice as many feathers as Abeer, and Ghada has half as many as Abeer. If Abeer has 8 feathers, how many do the three have together?", "o": ["28", "20", "24", "32"], "a": 0, "f": "", "s": [], "c": 4}, {"q": "Five friends each shook hands with every other friend once. How many handshakes were there?", "o": ["5", "10", "20", "25"], "a": 1, "f": "", "s": [], "c": 4}]}]}], "2": [{"key": "a", "title": "Verbal &amp; Linguistic Reasoning", "color": "#be123c", "sub": "Analogies • Classification • Sentence completion • Unrealistic premises • Reading", "ideas": [{"id": "L2-1", "n": 1, "t": "Verbal Analogies", "concept": "A pair of words has a relationship; you must find another pair with the same relationship, in the same order.", "fast": ["Make a short “bridge sentence” linking the two words: (A pen is the tool of a writer).", "Put each option into the same sentence; the one that fits exactly is the answer.", "Keep the direction: (bark : dog) is sound then owner, not the reverse.", "If two options fit, make the sentence more precise (a tool used to cut…, the young of…, the home of…)."], "trap": null, "table": [["Synonyms", "begin : start"], ["Opposites", "arrive : leave"], ["Part of whole", "page : book"], ["Tool & worker", "scalpel : surgeon"], ["Animal sound", "neigh : horse"], ["Young animal", "cub : lion"], ["Animal home", "den : lion"], ["Material & product", "iron : nail"], ["Stage & stage", "crescent : full moon"], ["Degree", "warm : hot"], ["Cause & effect", "thirst : wilting"], ["Small & big", "hut : palace"]], "new": false, "ex": {"q": "pen : writer &nbsp;:: &nbsp; scalpel : ......", "o": ["carpenter", "surgeon", "tailor", "painter"], "a": 1, "f": "", "s": ["Bridge: “a pen is the tool a writer works with” → “a scalpel is the tool a surgeon works with”."], "c": 4}, "pr": [{"q": "hut : palace &nbsp;:: &nbsp; stream : ......", "o": ["water", "fish", "river", "bank"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "The relationship <b>croak : frog</b> is like:", "o": ["cat : meow", "roar : lion", "sound : ear", "nest : bird"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "water : thirst &nbsp;:: &nbsp; food : ......", "o": ["full", "kitchen", "hunger", "plate"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L2-2", "n": 2, "t": "Classification and the Odd Word Out", "concept": "Four words: three share one link and one does not. Find the different word, or a word from the same group.", "fast": ["Look for the most precise link, not the most general: all animals? Then look for family, habitat or feature.", "Try: meaning (synonyms/opposites), category (fruit/vegetables), function, material.", "If two words seem odd, your link is not precise enough yet."], "trap": null, "table": null, "new": false, "ex": {"q": "Choose the odd word out:", "o": ["lion", "tiger", "leopard", "wolf"], "a": 3, "f": "", "s": ["Lion, tiger and leopard belong to the cat family; the wolf belongs to the dog family."], "c": 4}, "pr": [{"q": "Choose the odd word out:", "o": ["delay", "postpone", "hurry", "put off"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "Choose the odd word out:", "o": ["iron", "copper", "rubber", "aluminium"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L2-3", "n": 3, "t": "Sentence Completion", "concept": "A sentence with one or two blanks; choose the word(s) that make the meaning correct and consistent.", "fast": ["Read the whole sentence first and predict the word before looking at the options.", "Linking words are keys: “but, although” → contrast; “so, because” → cause and effect; “and” → agreement.", "With two blanks, start with the easier blank and eliminate any option that doesn’t fit it."], "trap": null, "table": null, "new": false, "ex": {"q": "Although the road was difficult, the runner stayed ...... until he reached the finish.", "o": ["hesitant", "sluggish", "steady", "helpless"], "a": 2, "f": "", "s": ["“Although” signals contrast with “difficult”, and “reached the finish” signals success → steady."], "c": 4}, "pr": [{"q": "Knowledge is a ...... that lights the way, and ignorance is a ...... that misleads.", "o": ["water – fire", "light – darkness", "sword – shield", "sea – mountain"], "a": 1, "f": "", "s": [], "c": 2}, {"q": "The camel can ...... thirst for a long time, so it is called the ...... of the desert.", "o": ["feel – king", "fight – lion", "endure – ship", "put out – star"], "a": 2, "f": "", "s": [], "c": 2}]}, {"id": "L2-4", "n": 4, "t": "Unrealistic Premises", "concept": "A sentence begins with an underlined premise that is not true in reality; you must find the logical result <i>inside the world of the question</i>.", "fast": ["Accept the premise as true and forget reality completely.", "Swap the words: whatever belonged to the first word now belongs to the second.", "The “realistic” option is usually the trap."], "trap": null, "table": null, "new": false, "ex": {"q": "If <u>pens were eaten</u> and apples were used for writing, then a student writes the lesson with ......", "o": ["a pen", "an apple", "a notebook", "ink"], "a": 1, "f": "", "s": ["In the world of the question, the writing tool is the apple → he writes with an apple (the pen is the realistic trap)."], "c": 4}, "pr": [{"q": "If <u>fish could fly</u> and birds could swim, then a sparrow lives in ......", "o": ["the air", "a nest", "the water", "a tree"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "If <u>snow were hot</u> and fire were cold, then in winter we keep warm with ......", "o": ["fire", "snow", "water", "wind"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L2-5", "n": 5, "t": "Reading Comprehension and Inference", "concept": "A short text followed by questions: word meaning, main idea, best title, inference or what a pronoun refers to.", "fast": ["Read the questions first so you know what to look for in the text.", "The answer comes from the text, not from your general knowledge.", "Beware of absolute options (all, always, never) when the text says (usually, some).", "The best title covers the whole text, not one detail."], "trap": null, "table": null, "new": false, "ex": {"q": "<div class=\"passage\">The palm tree is a blessed tree that tolerates heat and drought. People benefit from every part of it: they eat its fruit, make baskets and mats from its fronds, and in the past they built house roofs from its trunks.</div>The best title for the text is:", "o": ["Making baskets", "The palm: a generous tree", "Old houses", "Drought in the desert"], "a": 1, "f": "", "s": ["Options A and C are small details, and D is not the topic → “The palm: a generous tree” covers the whole text."], "c": 2}, "pr": [{"q": "<div class=\"passage\">Every autumn the stork migrates from Europe to Africa to escape the cold and to look for food, then returns in spring to build its nest, usually in the same place.</div>According to the text, why does the stork migrate?", "o": ["It loves travelling", "Cold and lack of food", "To build its nest", "The summer heat"], "a": 1, "f": "", "s": [], "c": 2}, {"q": "In the text above, the word “usually” means:", "o": ["always", "rarely", "in most cases", "never"], "a": 2, "f": "", "s": [], "c": 4}]}]}, {"key": "b", "title": "Mathematical &amp; Spatial Reasoning", "color": "#0f766e", "sub": "Word problems • Patterns • Geometry & measurement • Cube nets • Mirrors & folding", "ideas": [{"id": "L2-6", "n": 6, "t": "Fractions and the Remaining Part", "concept": "A question gives parts of a whole (a day, a salary, a story) and asks for what remains or the value of a part. The usual trap: the phrase “of the remainder”.", "fast": ["Choose a friendly number for the whole that every denominator divides (12, 24 or 60).", "Work out each part as a whole number, subtract, and turn the result back into a fraction at the end.", "If you see “of the remainder”, find the remainder first and then take the fraction of it."], "trap": "“A third of the remainder” is not “a third of the whole”.", "table": null, "new": false, "ex": {"q": "Sami spends <span class=\"fr\"><span>1</span><span>3</span></span> of his day at school, <span class=\"fr\"><span>1</span><span>4</span></span> sleeping and <span class=\"fr\"><span>1</span><span>6</span></span> playing. What fraction of the day is left?", "o": ["<span class=\"fr\"><span>1</span><span>4</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>", "<span class=\"fr\"><span>5</span><span>12</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>"], "a": 0, "f": "", "s": ["Take the day = 24 hours (divisible by 3, 4 and 6).", "School 8 h, sleep 6 h, play 4 h → total 18 h.", "Left: 6 h = <span class=\"fr\"><span>6</span><span>24</span></span> = <span class=\"fr\"><span>1</span><span>4</span></span>."], "c": 4}, "pr": [{"q": "Khalid read <span class=\"fr\"><span>1</span><span>2</span></span> of a story on the first day, then <span class=\"fr\"><span>1</span><span>3</span></span> of the remainder on the second day. What fraction of the story is left?", "o": ["<span class=\"fr\"><span>1</span><span>6</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span>2</span><span>3</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>"], "a": 3, "f": "", "s": [], "c": 4}, {"q": "Reem had 600 riyals. She spent <span class=\"fr\"><span>1</span><span>3</span></span> of it, then <span class=\"fr\"><span>1</span><span>4</span></span> of the remainder. How many riyals are left?", "o": ["150", "250", "300", "350"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L2-7", "n": 7, "t": "Direct and Inverse Proportion", "concept": "Two linked quantities: when one increases, the other increases (direct: cows and milk) or decreases (inverse: workers and days).", "fast": ["Direct: find what “one unit” produces, then multiply.", "Inverse: the product stays constant (workers × days = total work).", "With several variables: output of one unit = output ÷ (number × time)."], "trap": "Ask yourself: does increasing the number reduce the time, or increase the output?", "table": null, "new": false, "ex": {"q": "3 cows produce 6 litres of milk in 2 days. How many litres do 5 cows produce in 4 days?", "o": ["10", "15", "20", "24"], "a": 2, "f": "", "s": ["One cow per day = 6 ÷ (3 × 2) = 1 litre.", "5 cows × 4 days × 1 litre = 20 litres."], "c": 4}, "pr": [{"q": "6 workers finish a job in 10 days. How many days do 15 workers need for the same job?", "o": ["25", "4", "5", "6"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "One litre of concentrate makes 5 litres of juice, and each litre of juice serves 4 people. How many litres of concentrate are needed for 40 people?", "o": ["1", "2", "4", "10"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L2-8", "n": 8, "t": "Heads and Legs", "concept": "Two different kinds (chickens and rabbits, bicycles and tricycles) with a known total number and a known total of legs or wheels.", "fast": ["Assume everything is the kind with fewer legs.", "Extra legs = real legs − assumed legs.", "Number of the other kind = extra ÷ difference in legs between the two kinds."], "trap": null, "table": null, "new": false, "ex": {"q": "A barn has chickens and rabbits: 20 heads and 56 legs. How many rabbits are there?", "o": ["6", "8", "12", "14"], "a": 1, "f": "", "s": ["If all were chickens: 20 × 2 = 40 legs.", "Extra = 56 − 40 = 16; difference per animal = 4 − 2 = 2.", "Rabbits = 16 ÷ 2 = 8 (check: 8 × 4 + 12 × 2 = 56 ✓)."], "c": 4}, "pr": [{"q": "Ahmed counted the legs and eyes of a group of goats and got 48 in total. How many goats are there?", "o": ["6", "12", "8", "16"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "A rack holds 12 bicycles and tricycles with 29 wheels in total. How many tricycles?", "o": ["4", "5", "7", "9"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L2-9", "n": 9, "t": "Working Backwards and Testing the Options", "concept": "When a question says “I thought of a number…” or the equation is hard to set up, remember: the answer is among the options!", "fast": ["Try the middle option first; if the result is too big, try a smaller one, and vice versa.", "For “I thought of a number, then…”, start from the end and reverse the operations: + ↔ −, × ↔ ÷.", "Eliminate impossible options first (fractions of people, a part bigger than the whole)."], "trap": null, "table": null, "new": false, "ex": {"q": "A number plus half of itself, plus 5, equals 35. What is the number?", "o": ["15", "20", "24", "30"], "a": 1, "f": "", "s": ["Try B: 20 + 10 + 5 = 35 ✓ — done in seconds.", "Backwards: 35 − 5 = 30, and a number plus its half = 30 → the number is 20."], "c": 4}, "pr": [{"q": "A shepherd said: “If I had as many sheep again plus half as many, and one more sheep, I would have 51.” How many sheep does he have?", "o": ["20", "25", "30", "40"], "a": 0, "f": "", "s": [], "c": 4}, {"q": "A two-digit number has digits that add up to 9. Reversing its digits increases it by 27. What is the number?", "o": ["45", "27", "36", "18"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L2-10", "n": 10, "t": "Percentages", "concept": "Discounts, increases, or spending percentages of a salary and finding the whole from what is left.", "fast": ["Remaining = 100% − the total spent.", "Find 10% or 1% first, then multiply to reach the whole.", "25% off = a quarter of the price, 50% = half, 20% = a fifth."], "trap": null, "table": null, "new": false, "ex": {"q": "Salem paid 25% of his salary for rent and 35% for expenses, leaving 2400 riyals. What is his salary?", "o": ["4000", "5000", "6000", "8000"], "a": 2, "f": "", "s": ["Spent = 60% → remaining 40% = 2400.", "10% = 2400 ÷ 4 = 600 → salary = 600 × 10 = 6000 riyals."], "c": 4}, "pr": [{"q": "A shirt costs 80 riyals with a 25% discount. What is the price after the discount?", "o": ["20", "55", "75", "60"], "a": 3, "f": "", "s": [], "c": 4}, {"q": "In a class of 30 students, 90% passed. How many students did not pass?", "o": ["3", "6", "9", "27"], "a": 0, "f": "", "s": [], "c": 4}]}, {"id": "L2-11", "n": 11, "t": "Age Problems", "concept": "Everyone’s age increases by the same amount, so the difference between two ages never changes.", "fast": ["Find the difference between the two ages first (it is constant).", "If the older becomes “three times” the younger, the difference = twice the younger’s age.", "Or test the options: add the years to both ages and check."], "trap": null, "table": null, "new": false, "ex": {"q": "A father is 40 and his son is 10. In how many years will the father be three times as old as his son?", "o": ["5", "10", "15", "20"], "a": 0, "f": "", "s": ["Difference = 30 = twice the son’s age at that time → son = 15.", "15 − 10 = 5 years (check: 45 = 3 × 15 ✓)."], "c": 4}, "pr": [{"q": "Sara’s age is one third of her mother’s, and her sister is 4 years older than Sara. If the mother is 33, how old is the sister?", "o": ["11", "14", "7", "15"], "a": 3, "f": "", "s": [], "c": 4}, {"q": "Two brothers’ ages add up to 24 and differ by 4. How old is the older brother?", "o": ["10", "12", "14", "16"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L2-12", "n": 12, "t": "Doubling and Powers", "concept": "Something doubles every day (algae, flowers, bacteria) and you are asked about an earlier day, or you compare powers.", "fast": ["If it doubles every day: half-full is one day before full, a quarter is two days before.", "Half of 2<sup>n</sup> = 2<sup>n−1</sup>, and double 2<sup>n</sup> = 2<sup>n+1</sup>.", "Don’t divide the number of days by 2 — that is the trap!"], "trap": null, "table": null, "new": false, "ex": {"q": "Algae double in area every day and cover a whole lake in 20 days. On which day do they cover half the lake?", "o": ["10", "18", "19", "20"], "a": 2, "f": "", "s": ["On day 20 it is full, so the day before it was half → day 19."], "c": 4}, "pr": [{"q": "A flower bed doubles its flowers every day and is full after 12 days. On which day was it a quarter full?", "o": ["3", "6", "10", "11"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "Double 2<sup>8</sup> equals:", "o": ["2<sup>16</sup>", "2<sup>9</sup>", "4<sup>8</sup>", "4<sup>9</sup>"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L2-13", "n": 13, "t": "Growing Patterns (Tables and Matchsticks)", "concept": "A shape grows regularly (tables in a row, squares made of matchsticks) and you are asked about shape number 10 or 15.", "fast": ["Write the count for the first 3 shapes: 1 → ?, 2 → ?, 3 → ?.", "The constant increase is the multiplier of n; then add the rest: (increase × n) + constant.", "Check the rule on the first shape before using it."], "trap": null, "table": null, "new": false, "ex": {"q": "Square tables are placed in one row as shown. How many people can sit around 15 tables?", "o": ["30", "32", "45", "60"], "a": 1, "f": "<svg class=\"fig\" viewBox=\"0 0 198 104\" width=\"198\" height=\"104\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"30\" y=\"30\" width=\"46\" height=\"46\" fill=\"#b45309\" stroke=\"#78350f\" stroke-width=\"2\"/><circle cx=\"53.0\" cy=\"16\" r=\"8\" fill=\"#0f766e\"/><circle cx=\"53.0\" cy=\"90\" r=\"8\" fill=\"#0f766e\"/><rect x=\"76\" y=\"30\" width=\"46\" height=\"46\" fill=\"#b45309\" stroke=\"#78350f\" stroke-width=\"2\"/><circle cx=\"99.0\" cy=\"16\" r=\"8\" fill=\"#0f766e\"/><circle cx=\"99.0\" cy=\"90\" r=\"8\" fill=\"#0f766e\"/><rect x=\"122\" y=\"30\" width=\"46\" height=\"46\" fill=\"#b45309\" stroke=\"#78350f\" stroke-width=\"2\"/><circle cx=\"145.0\" cy=\"16\" r=\"8\" fill=\"#0f766e\"/><circle cx=\"145.0\" cy=\"90\" r=\"8\" fill=\"#0f766e\"/><circle cx=\"16\" cy=\"53.0\" r=\"8\" fill=\"#0f766e\"/><circle cx=\"182\" cy=\"53.0\" r=\"8\" fill=\"#0f766e\"/></svg>", "s": ["1 table → 4, 2 tables → 6, 3 tables → 8: +2 each table.", "Rule: 2n + 2 → 2 × 15 + 2 = 32."], "c": 4}, "pr": [{"q": "One square needs 4 matchsticks, two squares in a row need 7 and three need 10 (see the figure). How many matchsticks for 10 squares?", "o": ["30", "31", "33", "40"], "a": 1, "f": "<svg class=\"fig\" viewBox=\"0 0 122 54\" width=\"122\" height=\"54\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"44\" stroke=\"#b45309\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"44\" y1=\"10\" x2=\"44\" y2=\"44\" stroke=\"#b45309\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"78\" y1=\"10\" x2=\"78\" y2=\"44\" stroke=\"#b45309\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"112\" y1=\"10\" x2=\"112\" y2=\"44\" stroke=\"#b45309\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"13\" y1=\"10\" x2=\"41\" y2=\"10\" stroke=\"#b45309\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"13\" y1=\"44\" x2=\"41\" y2=\"44\" stroke=\"#b45309\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"47\" y1=\"10\" x2=\"75\" y2=\"10\" stroke=\"#b45309\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"47\" y1=\"44\" x2=\"75\" y2=\"44\" stroke=\"#b45309\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"81\" y1=\"10\" x2=\"109\" y2=\"10\" stroke=\"#b45309\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"81\" y1=\"44\" x2=\"109\" y2=\"44\" stroke=\"#b45309\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg>", "s": [], "c": 4}, {"q": "A triangle uses 3 matchsticks, two triangles in a row use 5, and three use 7. How many matchsticks for 20 triangles?", "o": ["40", "60", "42", "41"], "a": 3, "f": "", "s": [], "c": 4}]}, {"id": "L2-14", "n": 14, "t": "Perimeter, Area and Volume", "concept": "Divided shapes, shaded parts, or partly filled containers.", "fast": ["Draw the shape and write the lengths on it; identical squares share the same side.", "Shaded = whole area − unshaded area.", "Cube volume = s × s × s; water volume = length × width × water height only."], "trap": null, "table": null, "new": false, "ex": {"q": "A rectangle with perimeter 48 cm is divided into 3 identical squares in a row. What is its area?", "o": ["36 cm²", "72 cm²", "108 cm²", "144 cm²"], "a": 2, "f": "", "s": ["The rectangle’s perimeter is made of 8 square sides (3 top + 3 bottom + 2 ends).", "Side = 48 ÷ 8 = 6 cm → area = 3 × 6 × 6 = 108 cm²."], "c": 4}, "pr": [{"q": "A cube-shaped container with 10 cm edges is half filled with water. What is the volume of water?", "o": ["50 cm³", "250 cm³", "500 cm³", "1000 cm³"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "What is the area of the shaded part in the figure?", "o": ["16 cm²", "36 cm²", "84 cm²", "64 cm²"], "a": 3, "f": "<svg class=\"fig\" viewBox=\"0 0 130 138\" width=\"130\" height=\"138\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"10\" y=\"10\" width=\"110\" height=\"110\" fill=\"#0f766e\" opacity=\".85\"/><rect x=\"43\" y=\"43\" width=\"44\" height=\"44\" fill=\"#fff\"/><text x=\"65\" y=\"128\" font-size=\"11\" fill=\"#134e4a\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">10 cm</text><text x=\"65\" y=\"65\" font-size=\"10\" fill=\"#134e4a\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">6 cm</text></svg>", "s": [], "c": 4}]}, {"id": "L2-15", "n": 15, "t": "Speed, Distance and Time", "concept": "Distance = speed × time. It appears as a journey in stages or two moving objects.", "fast": ["Draw a straight line and divide it by hours.", "Two objects moving towards each other: closing speed = sum of the speeds.", "Same direction: closing speed = difference of the speeds."], "trap": null, "table": null, "new": false, "ex": {"q": "A car travels at 80 km/h. After 3 hours it still has 60 km to go. What is the total distance?", "o": ["240 km", "280 km", "300 km", "320 km"], "a": 2, "f": "", "s": ["Covered = 80 × 3 = 240 km; total = 240 + 60 = 300 km."], "c": 4}, "pr": [{"q": "A runner covered 1200 m in 4 minutes. How many metres per minute?", "o": ["200", "300", "400", "4800"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "Two trains 300 km apart move towards each other at 70 km/h and 80 km/h. After how many hours do they meet?", "o": ["1", "3", "2", "4"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L2-16", "n": 16, "t": "Taps and Working Together", "concept": "Two taps (or two people) work together, sometimes with a drain emptying the tank. You need the time to finish together.", "fast": ["Take the tank capacity = a common multiple of the times (e.g. 3 and 6 → 6 litres).", "Work out how much each tap fills per hour, add them (and subtract the drain).", "Time = capacity ÷ amount per hour. Remember: together is faster than the fastest one alone."], "trap": null, "table": null, "new": false, "ex": {"q": "One tap fills a tank in 3 hours and another in 6 hours. How many hours do they take together?", "o": ["1", "2", "3", "4.5"], "a": 1, "f": "", "s": ["Capacity 6 L: first 2 L/h, second 1 L/h → together 3 L/h.", "Time = 6 ÷ 3 = 2 hours (3 and 4.5 are ruled out — not less than 3)."], "c": 4}, "pr": [{"q": "A tap fills a tank in 4 hours and a drain empties it in 6 hours. If both are open, how many hours until the tank is full?", "o": ["2", "5", "10", "12"], "a": 3, "f": "", "s": [], "c": 4}, {"q": "Ahmed paints a room in 6 hours and Khalid in 12 hours. How many hours do they need together?", "o": ["3", "4", "6", "9"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L2-17", "n": 17, "t": "Averages and Consecutive Numbers", "concept": "The sum of consecutive numbers or an average mark, and you need one particular number.", "fast": ["For an odd count of consecutive numbers: the middle number = sum ÷ count.", "Then step left and right by 1 (or by 2 for even/odd numbers).", "New average = (old total + new value) ÷ new count."], "trap": null, "table": null, "new": false, "ex": {"q": "Five consecutive whole numbers add up to 75. What is the largest?", "o": ["15", "16", "17", "19"], "a": 2, "f": "", "s": ["Middle = 75 ÷ 5 = 15 → the numbers are 13, 14, 15, 16, 17 → largest 17."], "c": 4}, "pr": [{"q": "The average mark of 4 students is 15. A student with a mark of 20 joins. What is the new average?", "o": ["15", "16", "17", "17.5"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "Three consecutive even numbers add up to 48. What is the smallest?", "o": ["14", "15", "16", "18"], "a": 0, "f": "", "s": [], "c": 4}]}, {"id": "L2-18", "n": 18, "t": "Organised Counting (Squares, Triangles, Handshakes)", "concept": "How many squares or triangles are in the figure? How many handshakes in a group? Random counting wastes time and misses shapes.", "fast": ["Count by size: small ones first, then those made of two parts, then the largest.", "An n × n grid has 1² + 2² + … + n² squares.", "Triangle with lines from the top vertex to the base: count = 1 + 2 + … + number of parts.", "Handshakes among n people = n × (n − 1) ÷ 2."], "trap": null, "table": null, "new": false, "ex": {"q": "How many squares are in the figure?", "o": ["9", "10", "13", "14"], "a": 3, "f": "<svg class=\"fig\" viewBox=\"0 0 122 122\" width=\"122\" height=\"122\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"112\" stroke=\"#0f766e\" stroke-width=\"2.5\"/><line x1=\"10\" y1=\"10\" x2=\"112\" y2=\"10\" stroke=\"#0f766e\" stroke-width=\"2.5\"/><line x1=\"44\" y1=\"10\" x2=\"44\" y2=\"112\" stroke=\"#0f766e\" stroke-width=\"2.5\"/><line x1=\"10\" y1=\"44\" x2=\"112\" y2=\"44\" strok ars turn in opposite directions.", "In a chain: odd-numbered gears (1, 3, 5) turn like the first, even ones the opposite way.", "A straight belt keeps the direction; a crossed belt (×) reverses it.", "The smaller gear is faster: turns × teeth is the same for both gears."], "trap": null, "table": null, "new": false, "ex": {"q": "If gear 1 turns clockwise, how does gear 4 turn?", "o": ["Clockwise", "Anticlockwise", "It does not turn", "Back and forth"], "a": 1, "f": "<svg class=\"fig\" viewBox=\"0 0 220 84\" width=\"352\" height=\"134\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"206.0,46.0 211.9,48.6 210.9,53.8 204.5,54.1 201.8,58.9 205.0,64.5 201.2,68.1 195.8,64.6 190.8,66.9 190.1,73.3 184.9,74.0 182.6,68.0 177.2,66.9 172.9,71.7 168.3,69.2 170.0,63.0 166.2,58.9 159.9,60.3 157.7,55.5 162.7,51.5 162.0,46.0 156.1,43.4 157.1,38.2 163.5,37.9 166.2,33.1 163.0,27.5 166.8,23.9 172.2,27.4 177.2,25.1 177.9,18.7 183.1,18.0 185.4,24.0 190.8,25.1 195.1,20.3 199.7,22.8 198.0,29.0 201.8,33.1 208.1,31.7 210.3,36.5 205.3,40.5\" fill=\"#64748b\" stroke=\"#334155\" stroke-width=\"1.2\"/><circle cx=\"184\" cy=\"46\" r=\"6.6\" fill=\"#fff\" stroke=\"#334155\"/><text x=\"184\" y=\"46\" font-size=\"11\" fill=\"#134e4a\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">1</text><polygon points=\"156.0,46.0 161.9,48.6 160.9,53.8 154.5,54.1 151.8,58.9 155.0,64.5 151.2,68.1 145.8,64.6 140.8,66.9 140.1,73.3 134.9,74.0 132.6,68.0 127.2,66.9 122.9,71.7 118.3,69.2 120.0,63.0 116.2,58.9 109.9,60.3 107.7,55.5 112.7,51.5 112.0,46.0 106.1,43.4 107.1,38.2 113.5,37.9 116.2,33.1 113.0,27.5 116.8,23.9 122.2,27.4 127.2,25.1 127.9,18.7 133.1,18.0 135.4,24.0 140.8,25.1 145.1,20.3 149.7,22.8 148.0,29.0 151.8,33.1 158.1,31.7 160.3,36.5 155.3,40.5\" fill=\"#64748b\" stroke=\"#334155\" stroke-width=\"1.2\"/><circle cx=\"134\" cy=\"46\" r=\"6.6\" fill=\"#fff\" stroke=\"#334155\"/><text x=\"134\" y=\"46\" font-size=\"11\" fill=\"#134e4a\" font the small one make?", "o": ["<span class=\"fr\"><span>1</span><span>2</span></span>", "1", "2", "4"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "Two pulleys are joined by a crossed belt as shown. If pulley 1 turns clockwise, pulley 2:", "o": ["turns clockwise", "turns anticlockwise", "does not turn", "turns faster the same way"], "a": 1, "f": "<svg class=\"fig\" viewBox=\"0 0 220 96\" width=\"220\" height=\"96\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"45\" cy=\"45\" r=\"28\" fill=\"#e2e8f0\" stroke=\"#334155\" stroke-width=\"2\"/><circle cx=\"175\" cy=\"45\" r=\"28\" fill=\"#e2e8f0\" stroke=\"#334155\" stroke-width=\"2\"/><line x1=\"45\" y1=\"17\" x2=\"175\" y2=\"73\" stroke=\"#b45309\" stroke-width=\"3\"/><line x1=\"45\" y1=\"73\" x2=\"175\" y2=\"17\" stroke=\"#b45309\" stroke-width=\"3\"/><text x=\"175\" y=\"45\" font-size=\"14\" fill=\"#1f2937\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">1</text><text x=\"45\" y=\"45\" font-size=\"14\" fill=\"#1f2937\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">2</text><text x=\"175\" y=\"88\" font-size=\"14\" fill=\"#d97706\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">↻</text></svg>", "s": [], "c": 2}]}, {"id": "L2-24", "n": 24, "t": "Levers and Forces", "concept": "A door handle, a spanner, a ramp, a pulley… which position needs the least effort?", "fast": ["The farther the force is from the pivot, the less effort is needed.", "A longer (less steep) ramp is easier, but the distance is longer.", "A movable pulley roughly halves the effort; a fixed pulley only changes the direction."], "trap": null, "table": null, "new": false, "ex": {"q": "Where should you push a door to open it with the least effort?", "o": ["Near the hinges", "In the middle of the door", "At the point farthest from the hinges", "Effort is the same everywhere"], "a": 2, "f": "", "s": ["The hinges are the pivot; the farther away you push, the longer the lever arm and the smaller the effort."], "c": 2}, "pr": [{"q": "To lift a 100 N load with one movable pulley, you need a force of about:", "o": ["25 N", "50 N", "100 N", "200 N"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "To push a box up to a fixed height with the least effort, choose a ramp that is:", "o": ["short and steep", "long and gentle", "vertical", "it makes no difference"], "a": 1, "f": "", "s": [], "c": 2}]}, {"id": "L2-25", "n": 25, "t": "Electricity and Magnetism", "concept": "Which materials conduct electricity? What happens to charges? What does a magnet attract?", "fast": ["Conductors: metals (copper, iron, aluminium), graphite and salt water.", "Insulators: plastic, rubber, dry wood, glass, cotton.", "Like charges repel, unlike charges attract.", "A magnet attracts only iron, nickel and cobalt (not copper or aluminium)."], "trap": null, "table": null, "new": false, "ex": {"q": "Which material makes the bulb light up when placed between the ends of the circuit?", "o": ["Plastic ruler", "Eraser", "Iron nail", "Wooden stick"], "a": 2, "f": "", "s": ["Iron is a metal conductor; the others are insulators."], "c": 4}, "pr": [{"q": "Two balloons are rubbed with wool and brought close together. What happens?", "o": ["They attract", "They repel", "They burst", "Nothing"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "Which object is attracted by a magnet?", "o": ["Aluminium spoon", "Copper coin", "Iron paper clip", "Paper"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L2-26", "n": 26, "t": "Air, Water and Motion", "concept": "Air pressure, floating, and falling objects — everyday situations where you predict the result.", "fast": ["Fast-moving air has lower pressure, so objects are pushed towards it (the two papers move closer).", "Without air resistance, objects fall together whatever their mass.", "An object floats if it is less dense than the liquid; salt water is denser than fresh water.", "Imagine the situation or an experiment you have seen — don’t rely on “heavier is faster”."], "trap": null, "table": null, "new": false, "ex": {"q": "Two hanging sheets of paper face each other and air is blown quickly between them. What happens?", "o": ["They move apart", "They move closer", "They stay still", "Only one moves"], "a": 1, "f": "<svg class=\"fig\" viewBox=\"0 0 170 108\" width=\"170\" height=\"108\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" markerWidth=\"6\" markerHeight=\"6\" refX=\"3\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#2563eb\"/></marker></defs><line x1=\"50\" y1=\"5\" x2=\"50\" y2=\"20\" stroke=\"#be123c\" stroke-width=\"2\"/><line x1=\"35\" y1=\"5\" x2=\"65\" y2=\"5\" stroke=\"#be123c\" stroke-width=\"3\"/><rect x=\"32\" y=\"20\" width=\"36\" height=\"70\" fill=\"#fff\" stroke=\"#be123c\" stroke-width=\"2\"/><line x1=\"120\" y1=\"5\" x2=\"120\" y2=\"20\" stroke=\"#be123c\" stroke-width=\"2\"/><line x1=\"105\" y1=\"5\" x2=\"135\" y2=\"5\" stroke=\"#be123c\" stroke-width=\"3\"/><rect x=\"102\" y=\"20\" width=\"36\" height=\"70\" fill=\"#fff\" stroke=\"#be123c\" stroke-width=\"2\"/><line x1=\"98\" y1=\"40\" x2=\"80\" y2=\"50\" stroke=\"#2563eb\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"/><line x1=\"98\" y1=\"55\" x2=\"80\" y2=\"65\" stroke=\"#2563eb\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"/><line x1=\"98\" y1=\"70\" x2=\"80\" y2=\"80\" stroke=\"#2563eb\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"/><text x=\"85\" y=\"100\" font-size=\"10\" fill=\"#2563eb\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">fast air</text></svg>", "s": ["The fast air between them has low pressure, so the outside air (higher pressure) pushes them together."], "c": 2}, "pr": [{"q": "An iron ball and a wooden ball of the same size are dropped together from the same height in a vacuum (no air). Which lands first?", "o": ["The iron ball", "The wooden ball", "They land together", "Neither falls"], "a": 2, "f": "", "s": [], "c": 2}, {"q": "A fresh egg floats in:", "o": ["fresh water", "very salty water", "oil", "air"], "a": 1, "f": "", "s": [], "c": 4}]}]}, {"key": "d", "title": "Mental Flexibility", "color": "#7c3aed", "sub": "Number & shape patterns • Odd one out • Ordering • Lock codes • Deduction", "ideas": [{"id": "L2-27", "n": 27, "t": "Number Sequences", "concept": "A list of numbers following a rule; find the next or missing number.", "fast": ["Write the differences above the list; if they are not regular, write the differences of the differences.", "If the numbers grow fast, try multiplying (× 2, × 3).", "If they go up and down, there are probably two sequences mixed: separate odd and even positions.", "Know the famous ones: squares 1, 4, 9, 16… and primes 2, 3, 5, 7, 11…"], "trap": null, "table": null, "new": false, "ex": {"q": "What is the next number? <span class=\"ns\"><b>1</b><b>2</b><b>5</b><b>10</b><b>17</b><b>?</b></span>", "o": ["24", "25", "26", "28"], "a": 2, "f": "", "s": ["Differences: 1, 3, 5, 7 (odd numbers) → next difference 9.", "17 + 9 = 26."], "c": 4}, "pr": [{"q": "What is the next number? <span class=\"ns\"><b>3</b><b>6</b><b>12</b><b>24</b><b>?</b></span>", "o": ["36", "42", "48", "50"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "What is the next number? <span class=\"ns\"><b>2</b><b>10</b><b>4</b><b>20</b><b>6</b><b>30</b><b>?</b></span>", "o": ["40", "8", "36", "10"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "What is the next number? <span class=\"ns\"><b>1</b><b>4</b><b>9</b><b>16</b><b>?</b></span>", "o": ["20", "23", "24", "25"], "a": 3, "f": "", "s": [], "c": 4}]}, {"id": "L2-28", "n": 28, "t": "Number Figures (Triangles, Circles, Tables)", "concept": "Numbers inside similar shapes are linked by a fixed operation; find the missing number in the last shape.", "fast": ["Start with the first complete shape and try: addition, then multiplication, then mixe 33.0,19.0\" fill=\"#134e4a\"/></g></svg>"], "a": 1, "f": "<div class=\"seq\"><span><svg class=\"fig sm\" viewBox=\"0 0 50 50\" width=\"50\" height=\"50\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"2\" y=\"2\" width=\"46\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#cbd5e1\"/><g transform=\"rotate(0 25.0 25.0)\"><line x1=\"25.0\" y1=\"40.0\" x2=\"25.0\" y2=\"15.0\" stroke=\"#134e4a\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"25.0,7.0 17.0,19.0 33.0,19.0\" fill=\"#134e4a\"/></g></svg></span><span><svg class=\"fig sm\" viewBox=\"0 0 50 50\" width=\"50\" height=\"50\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"2\" y=\"2\" width=\"46\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#cbd5e1\"/><g transform=\"rotate(45 25.0 25.0)\"><line x1=\"25.0\" y1=\"40.0\" x2=\"25.0\" y2=\"15.0\" stroke=\"#134e4a\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"25.0,7.0 17.0,19.0 33.0,19.0\" fill=\"#134e4a\"/></g></svg></span><span><svg class=\"fig sm\" viewBox=\"0 0 50 50\" width=\"50\" height=\"50\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"2\" y=\"2\" width=\"46\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#cbd5e1\"/><g transform=\"rotate(90 25.0 25.0)\"><line x1=\"25.0\" y1=\"40.0\" x2=\"25.0\" y2=\"15.0\" stroke=\"#134e4a\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"25.0,7.0 17.0,19.0 33.0,19.0\" fill=\"#134e4a\"/></g></svg></span><span><svg class=\"fig sm\" viewBox=\"0 0 50 50\" width=\"50\" height=\"50\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"2\" y=\"2\" width=\"46\" height=\"46\" fill=\"#fff\" stroke=\"#d97706\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/><text x=\"25.0\" y=\"25.0\" font-size=\"24\" fill=\"#d97706\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">?</text></svg></span></div>", "s": [], "c": 4}]}, {"id": "L2-32", "n": 32, "t": "Ordering and Comparison", "concept": "People or things are compared (taller, heavier, arrived before…) and you need the first, the last, the second or the full order.", "fast": ["Asked for the biggest/tallest/first (or smallest/shortest/last)? Solve by elimination: cross out every name a sentence says is beaten by someone; the one left is the answer.", "Asked for the second, the third or the full order? Draw arrows and place each name, starting with the absolute fact (first, last, far right).", "Turn every sentence into the same symbol: (A is taller than B) → A > B."], "trap": null, "table": null, "new": false, "ex": {"q": "Saad is taller than Fahd, Fahd is taller than Majed, and Ali is taller than Saad. Who is the shortest?", "o": ["Ali", "Saad", "Fahd", "Majed"], "a": 3, "f": "", "s": ["We need the shortest → eliminate: Saad ✗ (taller than Fahd), Fahd ✗ (taller than Majed), Ali ✗ (taller than Saad).", "Majed is left ✓ — no need to order everyone.", "If asked who is second tallest, draw arrows: Ali → Saad → Fahd → Majed → second is Saad."], "c": 4}, "pr": [{"q": "Omar arrived before Ziad and after Nawaf, and Hani arrived last. Who arrived first?", "o": ["Omar", "Ziad", "Nawaf", "Hani"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "Four books are on a shelf: Science is directly to the right of Maths, Arabic is at the far left, and English is between Arabic and Maths. Which book is at the far right?", "o": ["Arabic", "Science", "Maths", "English"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L2-33", "n": 33, "t": "Lock Codes", "concept": "A lock code of several digits, with clues such as “one digit correct and in place”, “correct but in the wrong place” or “nothing correct”.", "fast": ["Start with the clue “nothing is correct” and cross out its digits from every clue.", "Compare two clues that share a digit: its position tells you whether it is in place.", "Fastest: test each option against the clues; the first contradiction eliminates it."], "trap": null, "table": null, "new": false, "ex": {"q": "A lock has a 3-digit code:<ul class=\"clues\"><li><span class=\"code\"><b>6</b><b>8</b><b>2</b></span> one digit is correct and in place.</li><li><span class=\"code\"><b>6</b><b>1</b><b>4</b></span> one digit is correct but in the wrong place.</li><li><span class=\"code\"><b>2</b><b>0</b><b>6</b></span> two digits are correct but in the wrong places.</li><li><span class=\"code\"><b>7</b><b>3</b><b>8</b></span> nothing is correct.</li><li><span class=\"code\"><b>7</b><b>8</b><b>0</b></span> one digit is correct but in the wrong place.</li></ul>What is the code?", "o": ["<span class=\"code\"><b>2</b><b>4</b><b>0</b></span>", "<span class=\"code\"><b>0</b><b>4</b><b>2</b></span>", "<span class=\"code\"><b>4</b><b>0</b><b>2</b></span>", "<span class=\"code\"><b>0</b><b>2</b><b>4</b></span>"], "a": 1, "f": "", "s": ["Test the options against the clues instead of the long method:", "(240) ✗: the 0 is in the last place, but clue (780) says it is in the wrong place.", "(024) ✗: then clue (682) would have no digit correct and in place.", "(402) ✗: the 0 in the middle is in place as in (206), but that clue says “wrong places”.", "(042) ✓ satisfies all five clues."], "c": 4}, "pr": [{"q": "A 2-digit code:<ul class=\"clues\"><li><span class=\"code\"><b>5</b><b>2</b></span> one digit correct and in place.</li><li><span class=\"code\"><b>9</b><b>1</b></span> one digit correct but in the wrong place.</li><li><span class=\"code\"><b>2</b><b>8</b></span> nothing is correct.</li></ul>What is the code?", "o": ["<span class=\"code\"><b>9</b><b>5</b></span>", "<span class=\"code\"><b>5</b><b>1</b></span>", "<span class=\"code\"><b>2</b><b>9</b></span>", "<span class=\"code\"><b>5</b><b>9</b></span>"], "a": 3, "f": "", "s": [], "c": 4}]}, {"id": "L2-34", "n": 34, "t": "Logical Deduction (“All” and “Some”)", "concept": "Two premises or a situation; you need the conclusion that <i>must</i> be true, not one that only <i>might</i> be true.", "fast": ["Draw circles: “all A are B” → circle A inside circle B.", "“Some” means partial overlap; don’t turn it into “all”.", "The correct conclusion needs no outside information; if it does, choose “cannot be decided”."], "trap": "“All top students read” does not mean “everyone who reads is a top student”.", "table": null, "new": false, "ex": {"q": "All top students read every day, and Ahmed reads every day. We conclude that:", "o": ["Ahmed is a top student.", "Ahmed is not a top student.", "We cannot decide whether Ahmed is a top student.", "Everyone who reads is a top student."], "a": 2, "f": "", "s": ["The “top students” circle is inside the “readers” circle; Ahmed is only known to be in the big circle — he may or may not be in the small one → cannot decide."], "c": 2}, "pr": [{"q": "Some birds cannot fly, and the ostrich is a bird. We conclude that:", "o": ["The ostrich certainly cannot fly.", "All birds can fly.", "The premises do not tell us whether the ostrich flies.", "The ostrich is not a bird."], "a": 2, "f": "", "s": [], "c": 2}, {"q": "A father closed all the windows before travelling. On return he found one window open with no sign of breaking. The strongest logical explanation:", "o": ["Windows open by themselves.", "The father forgot to close one window.", "The house has no windows.", "The father did not travel."], "a": 1, "f": "", "s": [], "c": 2}]}]}], "3": [{"key": "a", "title": "Verbal &amp; Linguistic Reasoning", "color": "#be123c", "sub": "Analogies • Box & chain analogies • Hypothetical premises • Classification • Meaning from context • Sayings & texts • Life situations", "ideas": [{"id": "L3-1", "n": 1, "t": "Verbal Analogies (Pairs)", "concept": "A pair of words with a relationship; find a pair with the same relationship in the same order. Level 3 uses precise relationships: transformation, outer covering, action and body part.", "fast": ["Make a precise bridge sentence: (Bark is the outer covering of a tree).", "Put each option in the same sentence; reject any option that only works in reverse.", "If two options fit, make the sentence more precise: (a <i>natural</i> outer covering that protects…)."], "trap": null, "table": [["Synonyms", "sword : blade"], ["Opposites", "deny : admit"], ["Transformation", "dough : bread"], ["Outer covering", "bark : tree"], ["Tool & job", "sickle : farmer"], ["Place & activity", "gym : exercise"], ["Action & body part", "kick : foot"], ["Small & big", "stream : river"], ["Degree", "annoyed : furious"], ["Cause & effect", "neglect : failure"], ["Home", "den : lion"], ["Part of whole", "balcony : building"]], "new": false, "ex": {"q": "courageous : brave", "o": ["pen : notebook", "huge : enormous", "river : sea", "moon : sun"], "a": 1, "f": "", "s": ["Relationship = synonyms: courageous means brave, and huge means enormous."], "c": 4}, "pr": [{"q": "peel : orange", "o": ["page : book", "juice : lemon", "root : plant", "skin : human"], "a": 3, "f": "", "s": [], "c": 4}, {"q": "deny : admit", "o": ["leave : depart", "reject : accept", "understand : grasp", "silent : quiet"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "dough : bread", "o": ["water : ice", "bread : oven", "flour : wheat", "tree : paper"], "a": 0, "f": "", "s": [], "c": 4}]}, {"id": "L3-2", "n": 2, "t": "Box Analogies and Word Chains", "concept": "Two chains of three words; find the missing word. The link may be in the meaning, or in the order of the letters themselves.", "fast": ["Read the first chain and write its link in two words: (animal – home – product).", "Apply the same link to the second chain, in the same order.", "If there is no link in meaning, number the letters (1 2 3) and track how they are rearranged."], "trap": null, "table": null, "new": false, "ex": {"q": "bee – hive – honey &nbsp;, &nbsp; cow – ...?... – milk", "o": ["pasture", "barn", "calf", "cheese"], "a": 1, "f": "", "s": ["Link: animal – where it lives – what it produces → a cow lives in a barn and produces milk.", "“Pasture” is where it eats, and “cheese” is made from milk, not produced directly."], "c": 4}, "pr": [{"q": "listen – silent – enlist &nbsp;, &nbsp; heart – earth – ...?...", "o": ["heat", "hater", "three", "tree"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "library : reading &nbsp;:: &nbsp; stadium : ......", "o": ["crowd", "ball", "playing sport", "coach"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L3-3", "n": 3, "t": "Analogies with a Hypothetical Premise", "concept": "The question mixes an unrealistic premise with an analogy: “If blood were called ink, and water : river, then ink : …”. The underlined word keeps its real meaning but gets a new name.", "fast": ["Write the real meaning above the new word: (ink = blood).", "Find the relationship in the given pair: (water flows in a river).", "Apply it to the real meaning: (blood flows in a vein) → answer: vein."], "trap": "The option linked to the new word in reality (ink → pen) is always the trap.", "table": null, "new": true, "ex": {"q": "If <u>milk were called fuel</u>, and honey : bee, then fuel : ......", "o": ["car", "cow", "petrol station", "oil"], "a": 1, "f": "", "s": ["Fuel here = milk. Relationship: honey is produced by a bee (product : producer).", "Milk is produced by a cow → fuel : cow. “Car” and “oil” are reality traps."], "c": 4}, "pr": [{"q": "If <u>a teacher were called a doctor</u>, and farmer : field, then doctor : ......", "o": ["hospital", "school", "patient", "medicine"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "If <u>the sun were called a lamp</u>, and moon : night, then lamp : ......", "o": ["room", "electricity", "day", "light"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L3-4", "n": 4, "t": "Unrealistic Premises", "concept": "A sentence begins with an underlined premise that contradicts reality; find the logical result inside the world of the question.", "fast": ["Accept the premise completely and forget reality.", "Whatever belonged to the first word in reality now belongs to the second.", "The “realistic” option is the trap in most questions."], "trap": null, "table": null, "new": false, "ex": {"q": "If <u>clouds were stones</u> and mountains were cotton, then rain falls from ......", "o": ["the clouds", "the stones", "the cotton", "the mountains"], "a": 1, "f": "", "s": ["In the question’s world, clouds are called “stones”, so rain falls from the stones. “Clouds” is the realistic trap."], "c": 4}, "pr": [{"q": "If <u>books were drunk</u> and juice were read, then a library is full of ......", "o": ["books", "cups", "readers", "juice"], "a": 3, "f": "", "s": [], "c": 4}, {"q": "If <u>fish lived in the desert</u> and camels in the sea, then “the ship of the desert” is the ......", "o": ["camel", "fish", "sand", "boat"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L3-5", "n": 5, "t": "Classification (Odd One Out and Same Group)", "concept": "Two types: four words with one odd one out, or a word at the top and you must choose what belongs to its group.", "fast": ["Look for the most precise link: (parts of a tree) is better than (natural things).", "Try: category, function, material, time, place.", "If two words seem odd, your link is not precise enough."], "trap": null, "table": null, "new": false, "ex": {"q": "Choose the odd word out:", "o": ["trunk", "branch", "field", "leaf"], "a": 2, "f": "", "s": ["Trunk, branch and leaf are parts of a tree; a field is a place."], "c": 4}, "pr": [{"q": "<b>ruby</b> — choose the word from the same group:", "o": ["emerald", "gold", "silver", "copper"], "a": 0, "f": "", "s": [], "c": 4}, {"q": "Choose the odd word out:", "o": ["Nile", "Amazon", "Danube", "Red"], "a": 3, "f": "", "s": [], "c": 4}]}, {"id": "L3-6", "n": 6, "t": "Sentence Completion and Meaning from Context", "concept": "Sentences with one or two blanks, and in recent compilations: an invented word that must be understood from its context.", "fast": ["Invented word: find the sentence that explains it (that is, because, which means, such as) — the answer is written there.", "Linking words: “but, although” = contrast; “so, because” = cause and effect.", "Two blanks: start with the easier one and eliminate, then check the rest."], "trap": null, "table": null, "new": true, "ex": {"q": "Future employees will need “tralsing”, because work needs people who can build successful relationships with colleagues and customers. “Tralsing” means:", "o": ["innovation", "memorising", "communication", "speed"], "a": 2, "f": "", "s": ["The sentence after “because” explains the word: building relationships with others → communication."], "c": 4}, "pr": [{"q": "Patience is the ...... to relief, and haste ...... regret.", "o": ["key – brings", "door – prevents", "enemy – delays", "end – removes"], "a": 0, "f": "", "s": [], "c": 2}, {"q": "The “zamber” centre treats long-term illnesses and researches their medicines, so “zamber” means:", "o": ["literary studies", "long-term illnesses", "medicines only", "hospitals"], "a": 1, "f": "", "s": [], "c": 2}]}, {"id": "L3-7", "n": 7, "t": "Sayings and Reading Comprehension", "concept": "A short text or a saying, with questions about its meaning, its title, or what it does NOT show.", "fast": ["For “does NOT show / cannot be concluded”: the answer adds information that is not there, or over-generalises.", "For sayings: restate them in your own simple words, then match the options.", "Beware of absolute options (all, always, all day) when the text is specific."], "trap": null, "table": null, "new": false, "ex": {"q": "<div class=\"passage\">Some cities charge a fee on cars entering the city centre at peak times, in order to reduce traffic and air pollution.</div>Which of the following is NOT shown by the text?", "o": ["City centres are crowded at peak times.", "The fee is a way to reduce traffic.", "Cars contribute to air pollution.", "The fee is charged on all cars all day."], "a": 3, "f": "", "s": ["The text says “at peak times”, so “all day” is a generalisation the text does not support."], "c": 2}, "pr": [{"q": "“A person is measured by what he does, not by who his grandfather was.” This means:", "o": ["Boasting about ancestors is a duty.", "People are judged by their own work, not their family name.", "Young people matter more than old people.", "Talking is more important than working."], "a": 1, "f": "", "s": [], "c": 2}, {"q": "<div class=\"passage\">Plants need light to make their food, which is why the leaves of house plants turn towards the windows.</div>We conclude that:", "o": ["Plant leaves turn towards the light source.", "Plants move from place to place.", "Plants do not need water.", "Windows make food for plants."], "a": 0, "f": "", "s": [], "c": 2}]}, {"id": "L3-8", "n": 8, "t": "Life Situations and the Best Response", "concept": "An everyday or school situation; choose the most suitable action or the most logical explanation.", "fast": ["Choose the positive, balanced action: it solves the problem and keeps respect.", "Eliminate: passive (ignoring it), aggressive (confronting in public) and exaggerated options.", "For “the most logical reason”: choose the simplest explanation linked to the situation, not a generalisation."], "trap": null, "table": null, "new": true, "ex": {"q": "You notice that a classmate in your project group is not taking part. What is the best action?", "o": ["Report him to the teacher immediately.", "Do his work for him.", "Talk to him calmly and offer him a task that suits him.", "Ignore it."], "a": 2, "f": "", "s": ["Option C solves the problem and keeps the relationship; the others are passive or hasty."], "c": 2}, "pr": [{"q": "A student wants to raise his maths mark one month before the test. The best plan is:", "o": ["Solve everything the night before.", "Copy a friend’s solutions.", "Only read the book.", "Make a short daily review plan and solve exercises."], "a": 3, "f": "", "s": [], "c": 2}, {"q": "The internet stopped on every device in the house at the same time. The most likely reason:", "o": ["All the devices broke together.", "A problem with the router or the service.", "The phone battery ran out.", "The devices are old."], "a": 1, "f": "", "s": [], "c": 2}]}]}, {"key": "b", "title": "Mathematical &amp; Spatial Reasoning", "color": "#4338ca", "sub": "Equations & sequences • Percentages • Speed • Geometry & measurement • Statistics • Cubes, folding & cutting", "ideas": [{"id": "L3-9", "n": 9, "t": "Symmetric Equations (Add, Don’t Solve)", "concept": "Two or more equations, and you are asked for the sum or average of the variables — not each value.", "fast": ["Add all the equations directly; the sum usually appears multiplied by a constant.", "Divide by that constant to get what is asked.", "Average = sum ÷ number of variables."], "trap": null, "table": null, "new": false, "ex": {"q": "If 2a + 3b = 19 and 3a + 2b = 16, what is a + b?", "o": ["5", "6", "7", "35"], "a": 2, "f": "", "s": ["Adding: 5a + 5b = 35 → a + b = 7 (without finding a and b)."], "c": 4}, "pr": [{"q": "If x + y = 5, y + z = 7 and x + z = 8, what is x + y + z?", "o": ["20", "12", "10", "8"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "If 3x + y = 14 and x + 3y = 10, what is the average of x and y?", "o": ["2", "3", "6", "12"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L3-10", "n": 10, "t": "Arithmetic Sequences and the nth Term", "concept": "Numbers increasing by a constant step; you need a far term (the 99th), the number of terms, or their sum.", "fast": ["nth term = first term + (n − 1) × difference.", "Number of terms = (last − first) ÷ difference + 1.", "Sum = number of terms × (first + last) ÷ 2."], "trap": null, "table": null, "new": false, "ex": {"q": "What is the 100th term of <span class=\"ns\"><b>7</b><b>11</b><b>15</b><b>19</b><b>…</b></span>?", "o": ["400", "403", "407", "411"], "a": 1, "f": "", "s": ["Term = 7 + 99 × 4 = 7 + 396 = 403."], "c": 4}, "pr": [{"q": "How many numbers are in <span class=\"ns\"><b>5</b><b>8</b><b>11</b><b>…</b><b>98</b></span>?", "o": ["33", "32", "31", "30"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "What is the sum of the whole numbers from 1 to 50?", "o": ["1225", "1250", "1275", "2550"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L3-11", "n": 11, "t": "Successive Percentages", "concept": "A discount followed by a discount, or an increase followed by a discount. The method: apply the two changes one after the other to the amount — never add the percentages.", "fast": ["Apply the first discount to the price, then apply the second discount to the new price (not to the original one).", "If no amount is given, assume the price is 100 riyals and try it: 100 → 10% off = 90 → 20% off 90 (18) = 72 → total discount 28%.", "Increases work the same way: 100 → 20% up = 120 → 20% off 120 (24) = 96, which is below the original."], "trap": "Do not add the percentages: 10% then 20% off is not 30%, because the second discount is taken from a smaller amount.", "table": null, "new": false, "ex": {"q": "An item costs 200 riyals. Its price rises by 25%, then falls by 20%. What is the price now?", "o": ["190", "195", "200", "210"], "a": 2, "f": "", "s": ["Increase: 25% of 200 = 50 → 200 + 50 = 250 riyals.", "Discount on the new price: 20% of 250 = 50 → 250 − 50 = 200 riyals."], "c": 4}, "pr": [{"q": "A 50% discount followed by an extra 20% discount equals a single discount of:", "o": ["60%", "70%", "65%", "55%"], "a": 0, "f": "", "s": [], "c": 4}, {"q": "A village has 5000 people and grows by 10% every year. What is its population after two years?", "o": ["6000", "6050", "6100", "5500"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L3-12", "n": 12, "t": "Compound Proportion (Workers × Time × Output)", "concept": "More than two variables together: workers, days and pieces, or machines, hours and boxes.", "fast": ["Find the output of one unit: output ÷ (number × time).", "Required number = new output ÷ (unit output × new time).", "Sense-check: less time → more workers."], "trap": null, "table": null, "new": false, "ex": {"q": "6 machines produce 180 boxes in 4 hours. How many machines are needed to produce 450 boxes in 5 hours?", "o": ["8", "10", "12", "15"], "a": 2, "f": "", "s": ["One machine per hour = 180 ÷ (6 × 4) = 7.5 boxes.", "Number = 450 ÷ (7.5 × 5) = 450 ÷ 37.5 = 12 machines."], "c": 4}, "pr": [{"q": "A printer prints 90 pages in 6 minutes. How many printers are needed to print 300 pages in 4 minutes?", "o": ["4", "5", "6", "8"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "5 cats catch 5 mice in 5 minutes. How many cats are needed to catch 100 mice in 100 minutes?", "o": ["5", "20", "100", "25"], "a": 0, "f": "", "s": [], "c": 4}]}, {"id": "L3-13", "n": 13, "t": "Working Backwards", "concept": "A chain of operations on an unknown number (spending, adding, climbing) where you are given the final result.", "fast": ["Start from the final result and reverse each step: half → × 2; subtract → add.", "For “add its half and its quarter”: the number × (1 + ½ + ¼).", "For daily climbing: on the last day there is no slipping back."], "trap": null, "table": null, "new": false, "ex": {"q": "A man spent half his salary, then 600 riyals, then half of what was left, and had 900 riyals left. What is his salary?", "o": ["3600", "4200", "4800", "5400"], "a": 2, "f": "", "s": ["900 × 2 = 1800 → + 600 = 2400 → × 2 = 4800 riyals."], "c": 4}, "pr": [{"q": "What number becomes 900 when its third and its sixth are added to it?", "o": ["450", "540", "600", "720"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "A frog is in a 20 m well. It climbs 4 m by day and slips 2 m at night. On which day does it get out?", "o": ["8", "9", "10", "18"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L3-14", "n": 14, "t": "Smart Calculation (Cancelling and Grouping)", "concept": "Long expressions that look hard but collapse with one idea.", "fast": ["Products of consecutive brackets: write the first two and the last one, and watch the cancelling.", "Factor out the common factor: 999 × 25 + 25 = 25 × 1000.", "Difference of two squares: a² − b² = (a − b)(a + b)."], "trap": null, "table": null, "new": false, "ex": {"q": "What is (1 − <span class=\"fr\"><span>1</span><span>2</span></span>)(1 − <span class=\"fr\"><span>1</span><span>3</span></span>)(1 − <span class=\"fr\"><span>1</span><span>4</span></span>) … (1 − <span class=\"fr\"><span>1</span><span>50</span></span>)?", "o": ["<span class=\"fr\"><span>1</span><span>49</span></span>", "<span class=\"fr\"><span>1</span><span>50</span></span>", "<span class=\"fr\"><span>49</span><span>50</span></span>", "<span class=\"fr\"><span>1</span><span>100</span></span>"], "a": 1, "f": "", "s": ["= <span class=\"fr\"><span>1</span><span>2</span></span> × <span class=\"fr\"><span>2</span><span>3</span></span> × <span class=\"fr\"><span>3</span><span>4</span></span> × … × <span class=\"fr\"><span>49</span><span>50</span></span> → each numerator cancels the previous denominator, leaving <span class=\"fr\"><span>1</span><span>50</span></span>."], "c": 4}, "pr": [{"q": "What is 999 × 25 + 25?", "o": ["25025", "24975", "25000", "24999"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "What is 50<sup>2</sup> − 49<sup>2</sup>?", "o": ["1", "99", "100", "2401"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L3-15", "n": 15, "t": "Powers and Their Laws", "concept": "Exponential equations where you need another expression, not the value of x.", "fast": ["a<sup>x+n</sup> = a<sup>x</sup> × a<sup>n</sup>, and a<sup>x−n</sup> = a<sup>x</sup> ÷ a<sup>n</sup>.", "9<sup>x</sup> = (3²)<sup>x</sup> = (3<sup>x</sup>)<sup>2</sup>: change to the given base.", "Don’t look for x; express what is asked in terms of a<sup>x</sup>."], "trap": null, "table": null, "new": false, "ex": {"q": "If 2<sup>x+3</sup> = 48, what is 2<sup>x</sup>?", "o": ["3", "6", "8", "16"], "a": 1, "f": "", "s": ["2<sup>x</sup> × 8 = 48 → 2<sup>x</sup> = 6."], "c": 4}, "pr": [{"q": "If 3<sup>x</sup> = 5, what is 9<sup>x</sup>?", "o": ["10", "15", "25", "125"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "If 5<sup>x−1</sup> = 4, what is 5<sup>x+1</sup>?", "o": ["100", "20", "40", "125"], "a": 0, "f": "", "s": [], "c": 4}]}, {"id": "L3-16", "n": 16, "t": "Calendars, Clocks and Time Zones", "concept": "The day after many days, a clock that runs slow, or the time difference between two cities.", "fast": ["Days of the week: divide by 7 and keep only the remainder.", "A slow clock: total delay = delay per hour × number of hours.", "A city that is “ahead” → add the difference; “behind” → subtract it."], "trap": null, "table": null, "new": false, "ex": {"q": "If today is Thursday, what day will it be after 500 days?", "o": ["Saturday", "Sunday", "Monday", "Wednesday"], "a": 1, "f": "", "s": ["500 = 7 × 71 + 3 → 3 days after Thursday → Sunday."], "c": 4}, "pr": [{"q": "A clock loses 15 minutes every hour. It was set to 8:00 a.m. What does it show after 4 real hours?", "o": ["11:00", "11:15", "12:00", "11:45"], "a": 0, "f": "", "s": [], "c": 4}, {"q": "A city is 3 hours ahead of Makkah. If it is 10:00 a.m. in Makkah, the time in that city is:", "o": ["7:00 a.m.", "1:00 p.m.", "12:00 noon", "3:00 p.m."], "a": 1, "f": "", "s": [], "c": 2}]}, {"id": "L3-17", "n": 17, "t": "Relative Speed and Trains", "concept": "A train crossing a bridge or passing a person, or two objects approaching. The hardest speed ideas at Level 3.", "fast": ["Crossing a bridge or tunnel: distance = train length + bridge length.", "Passing a person or a pole: distance = train length only.", "Opposite directions: add the speeds; same direction: subtract them. Make the units match first."], "trap": null, "table": null, "new": false, "ex": {"q": "A 200 m train moves at 20 m/s. How many seconds does it take to cross a 300 m bridge?", "o": ["10", "15", "25", "30"], "a": 2, "f": "", "s": ["Distance = 200 + 300 = 500 m → time = 500 ÷ 20 = 25 seconds."], "c": 4}, "pr": [{"q": "A man sits in a train moving at 15 m/s. A goods train passes him in the opposite direction at 25 m/s in 6 seconds. How long is the goods train?", "o": ["60 m", "150 m", "240 m", "400 m"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "Two cars move in the same direction at 90 and 60 km/h, 15 km apart. After how many minutes does the faster car catch up?", "o": ["30", "15", "10", "60"], "a": 0, "f": "", "s": [], "c": 4}]}, {"id": "L3-18", "n": 18, "t": "Circles and Shaded Areas", "concept": "Shaded parts between circles, squares and triangles, usually answered in terms of π.", "fast": ["Circle area = πr², circumference = 2πr.", "Shaded = big shape − white shape (don’t calculate the shaded part directly).", "Quarter circle − right triangle = the segment between the arc and the chord."], "trap": null, "table": null, "new": false, "ex": {"q": "A square of side 8 cm contains 4 identical touching circles as shown. What is the shaded area?", "o": ["64 − 16π", "64 − 4π", "16π", "64 − 8π"], "a": 0, "f": "<svg class=\"fig\" viewBox=\"0 0 136 150\" width=\"136\" height=\"150\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"8\" y=\"8\" width=\"120\" height=\"120\" fill=\"#a5b4fc\" stroke=\"#312e81\" stroke-width=\"2\"/><circle cx=\"38.0\" cy=\"38.0\" r=\"30.0\" fill=\"#fff\" stroke=\"#312e81\" stroke-width=\"1.6\"/><circle cx=\"38.0\" cy=\"38.0\" r=\"1.8\" fill=\"#312e81\"/><circle cx=\"38.0\" cy=\"98.0\" r=\"30.0\" fill=\"#fff\" stroke=\"#312e81\" stroke-width=\"1.6\"/><circle cx=\"38.0\" cy=\"98.0\" r=\"1.8\" fill=\"#312e81\"/><circle cx=\"98.0\" cy=\"38.0\" r=\"30.0\" fill=\"#fff\" stroke=\"#312e81\" stroke-width=\"1.6\"/><circle cx=\"98.0\" cy=\"38.0\" r=\"1.8\" fill=\"#312e81\"/><circle cx=\"98.0\" cy=\"98.0\" r=\"30.0\" fill=\"#fff\" stroke=\"#312e81\" stroke-width=\"1.6\"/><circle cx=\"98.0\" cy=\"98.0\" r=\"1.8\" fill=\"#312e81\"/><text x=\"68.0\" y=\"140\" font-size=\"11\" fill=\"#312e81\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">8 cm</text></svg>", "s": ["Each radius = 2 cm → area of four circles = 4 × π × 4 = 16π.", "Shaded = 64 − 16π cm²."], "c": 4}, "pr": [{"q": "The figure shows a quarter circle of radius 6 cm. What is the shaded area between the arc and the chord?", "o": ["36π − 18", "9π − 18", "9π", "18 − 9π"], "a": 1, "f": "<svg class=\"fig\" viewBox=\"0 0 130 144\" width=\"130\" height=\"144\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M10,10 A110,110 0 0 1 120,120 Z\" fill=\"#a5b4fc\"/><path d=\"M10,10 L10,120 L120,120\" fill=\"none\" stroke=\"#312e81\" stroke-width=\"2\"/><path d=\"M10,10 A110,110 0 0 1 120,120\" fill=\"none\" stroke=\"#312e81\" stroke-width=\"2\"/><line x1=\"10\" y1=\"10\" x2=\"120\" y2=\"120\" stroke=\"#312e81\" stroke-width=\"2\"/><rect x=\"10\" y=\"110\" width=\"10\" height=\"10\" fill=\"none\" stroke=\"#312e81\"/><text x=\"65.0\" y=\"132\" font-size=\"11\" fill=\"#312e81\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">6 cm</text></svg>", "s": [], "c": 4}, {"q": "Two circles have the same centre and radii 5 cm and 3 cm. What is the area of the ring between them?", "o": ["4π", "8π", "16π", "34π"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L3-19", "n": 19, "t": "Angles and Polygons", "concept": "Triangle angles, exterior angles, parallel lines and a transversal, and polygon angles.", "fast": ["Triangle angles add to 180°, and an exterior angle = the sum of the two opposite interior angles.", "Sum of interior angles of a polygon = (n − 2) × 180°.", "With parallel lines: alternate angles are equal, co-interior angles add to 180°."], "trap": null, "table": null, "new": false, "ex": {"q": "A triangle has angles 50° and 70°. What is the exterior angle at the third vertex?", "o": ["60°", "110°", "120°", "130°"], "a": 2, "f": "", "s": ["Exterior = 50 + 70 = 120° directly (no need for the third angle)."], "c": 4}, "pr": [{"q": "What is the sum of the interior angles of a hexagon?", "o": ["540°", "720°", "900°", "1080°"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "What is each interior angle of a regular octagon?", "o": ["150°", "140°", "135°", "120°"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L3-20", "n": 20, "t": "Pythagoras and Distances", "concept": "Shortest distance, a missing side of a right triangle, or the perimeter of a right-triangle garden.", "fast": ["hypotenuse² = side² + side².", "Memorise the triples: (3, 4, 5) and its multiples (6, 8, 10), (9, 12, 15), and (5, 12, 13).", "Moving east then north = the two short sides; the shortest way back is the hypotenuse."], "trap": null, "table": null, "new": false, "ex": {"q": "Salem walked 6 m east then 8 m north. What is the shortest distance back to the start?", "o": ["10 m", "12 m", "14 m", "7 m"], "a": 0, "f": "", "s": ["Triple (6, 8, 10) → 10 m directly."], "c": 4}, "pr": [{"q": "A right-triangle garden has short sides 9 m and 12 m. Ahmed ran around it twice. How far did he run?", "o": ["42", "54", "84", "72"], "a": 3, "f": "", "s": [], "c": 4}, {"q": "A 13 m ladder leans on a wall with its foot 5 m from the wall. How high does it reach?", "o": ["8 m", "10 m", "12 m", "18 m"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L3-21", "n": 21, "t": "Painted Cubes and Solids", "concept": "A cube painted on the outside is cut into small cubes, or you count how many cubes fit in a box.", "fast": ["Cube cut n × n × n: three painted faces = 8 (always the corners).", "Two faces = 12 × (n − 2); one face = 6 × (n − 2)²; no paint = (n − 2)³.", "Cubes in a box = (length ÷ edge) × (width ÷ edge) × (height ÷ edge)."], "trap": null, "table": null, "new": false, "ex": {"q": "A painted cube is cut into 64 equal small cubes as shown. How many small cubes have exactly two painted faces?", "o": ["8", "16", "24", "32"], "a": 2, "f": "<svg class=\"fig\" viewBox=\"0 0 162 186\" width=\"162\" height=\"186\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"81.2,5.0 157.4,49.0 81.2,93.0 5.0,49.0\" fill=\"#c7d2fe\" stroke=\"#1e1b4b\" stroke-width=\"1.6\"/><polygon points=\"157.4,49.0 81.2,93.0 81.2,181.0 157.4,137.0\" fill=\"#818cf8\" stroke=\"#1e1b4b\" stroke-width=\"1.6\"/><polygon points=\"5.0,49.0 81.2,93.0 81.2,181.0 5.0,137.0\" fill=\"#6366f1\" stroke=\"#1e1b4b\" stroke-
