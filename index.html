=\"2\"/><rect x=\"58\" y=\"40\" width=\"18\" height=\"18\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"2\"/></svg>"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "When the net is folded into a cube, what is the sum of the number opposite 1 and the number opposite 5?", "o": ["7", "8", "9", "10"], "a": 2, "f": "<svg class=\"fig\" viewBox=\"0 0 168 128\" width=\"168\" height=\"128\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"44\" y=\"4\" width=\"40\" height=\"40\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"2\"/><text x=\"64.0\" y=\"24.0\" font-size=\"17\" fill=\"#134e4a\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">5</text><rect x=\"4\" y=\"44\" width=\"40\" height=\"40\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"2\"/><text x=\"24.0\" y=\"64.0\" font-size=\"17\" fill=\"#134e4a\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">1</text><rect x=\"44\" y=\"44\" width=\"40\" height=\"40\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"2\"/><text x=\"64.0\" y=\"64.0\" font-size=\"17\" fill=\"#134e4a\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">2</text><rect x=\"84\" y=\"44\" width=\"40\" height=\"40\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"2\"/><text x=\"104.0\" y=\"64.0\" font-size=\"17\" fill=\"#134e4a\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">3</text><rect x=\"124\" y=\"44\" width=\"40\" height=\"40\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"2\"/><text x=\"144.0\" y=\"64.0\" font-size=\"17\" fill=\"#134e4a\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">4</text><rect x=\"84\" y=\"84\" width=\"40\" height=\"40\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"2\"/><text x=\"104.0\" y=\"104.0\" font-size=\"17\" fill=\"#134e4a\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">6</text></svg>", "s": [], "c": 4}]}, {"id": "L3-26", "n": 26, "t": "Folding, Cutting and Mirrors", "concept": "A sheet is folded several times and then cut or punched; you need its shape when opened. Very common in recent compilations.", "fast": ["Each fold doubles the holes or cuts: one fold → 2, two folds → 4, three → 8.", "Unfold in reverse order, reflecting the cut across the fold line each time.", "A cut at the corner that lies at the centre of the original sheet → one hole in the middle.", "Clock in a mirror: real time = 11:60 − the time shown."], "trap": null, "table": null, "new": true, "ex": {"q": "A square sheet is folded in half twice, then the corner at the centre of the original sheet is cut off. What appears when it is opened?", "o": ["4 holes at the corners", "One hole in the middle", "Two holes on the edge", "No hole"], "a": 1, "f": "", "s": ["All four layers meet at the folded corner at the centre, so the cut opens as one symmetric hole in the middle."], "c": 2}, "pr": [{"q": "A sheet is folded 3 times (in half each time) and then punched once away from the edges. How many holes appear when it is opened?", "o": ["3", "6", "8", "9"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "A clock in a mirror shows 3:40. What is the real time?", "o": ["8:20", "9:20", "8:40", "3:20"], "a": 0, "f": "", "s": [], "c": 4}]}]}, {"key": "c", "title": "Scientific &amp; Mechanical Reasoning", "color": "#b45309", "sub": "Gears & belts • Levers • Momentum & inertia • Free fall • Energy • Electricity • Pressure • Light & sound • Chemistry & biology", "ideas": [{"id": "L3-27", "n": 27, "t": "Compound Gears", "concept": "Gear trains with different numbers of teeth, and gears on one shaft; you need the number and direction of turns.", "fast": ["Two meshing gears: (turns × teeth) is equal, and the directions are opposite.", "Two gears on the same shaft: same turns and same direction.", "In a chain: odd gears turn like the first, even gears the opposite way.", "All gears back to the start → lowest common multiple of the teeth."], "trap": null, "table": null, "new": false, "ex": {"q": "Gear A (40 teeth) turns gear B (10 teeth). B is on the same shaft as gear C (30 teeth), and C turns gear D (15 teeth). If A makes one turn, how many turns does D make?", "o": ["2", "4", "8", "16"], "a": 2, "f": "", "s": ["B = 40 ÷ 10 = 4 turns → C on the same shaft = 4 turns → D = 4 × 30 ÷ 15 = 8 turns."], "c": 4}, "pr": [{"q": "A 45-tooth gear turns a 20-tooth gear. If the first makes one full turn, how many turns does the second make?", "o": ["1.5", "2", "2.25", "2.5"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "Three meshing gears have 4, 6 and 10 teeth. How many turns must the smallest make for all gears to return to their starting position?", "o": ["10", "15", "30", "60"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L3-28", "n": 28, "t": "Pulleys and Belts", "concept": "Two pulleys with a straight or crossed belt and different diameters, or bicycle gears.", "fast": ["Straight belt: same direction; crossed belt (×): opposite direction.", "turns × diameter is equal for both pulleys: the smaller pulley is faster.", "Bicycle: a smaller rear sprocket → faster wheel; a larger rear sprocket → more force (for climbing)."], "trap": null, "table": null, "new": false, "ex": {"q": "A 30 cm pulley is joined by a straight belt to a 10 cm pulley. If the large one turns twice clockwise, the small one turns:", "o": ["6 times clockwise", "6 times anticlockwise", "twice clockwise", "two-thirds of a turn clockwise"], "a": 0, "f": "", "s": ["Turns = 2 × 30 ÷ 10 = 6, and the belt is straight → same direction."], "c": 2}, "pr": [{"q": "A 20 cm pulley turns a 5 cm pulley with a crossed belt (×). If the large one turns once clockwise, the small one turns:", "o": ["4 times clockwise", "4 times anticlockwise", "a quarter turn anticlockwise", "once clockwise"], "a": 1, "f": "", "s": [], "c": 2}, {"q": "To make the rear wheel of a bicycle as fast as possible, choose the rear sprocket that is:", "o": ["the largest", "the smallest", "medium", "it makes no difference"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L3-29", "n": 29, "t": "Levers and Hanging Balances", "concept": "The three classes of lever, and multi-level hanging balances.", "fast": ["Class 1: pivot in the middle (scissors, a seesaw).", "Class 2: load in the middle (wheelbarrow, nutcracker). Class 3: effort in the middle (tweezers, the forearm).", "Balance: weight × distance is equal on both sides; in hanging balances work from the bottom up."], "trap": null, "table": null, "new": false, "ex": {"q": "Which of these is a class 3 lever?", "o": ["scissors", "wheelbarrow", "tweezers", "nutcracker"], "a": 2, "f": "", "s": ["In tweezers the effort (fingers) is between the pivot and the load → class 3."], "c": 4}, "pr": [{"q": "A balanced hanging bar has a 2 m left arm carrying 30 N and a 3 m right arm. What weight is on the right arm?", "o": ["15", "20", "30", "45"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "A balanced lever has two equal weights at equal distances. If the right weight is moved to twice its distance, what must happen to the left weight (same distance) to rebalance?", "o": ["It doubles", "It halves", "It stays the same", "It increases by 1"], "a": 0, "f": "", "s": [], "c": 4}]}, {"id": "L3-30", "n": 30, "t": "Inertia and Momentum", "concept": "Carts with different masses and speeds, liquid in a braking tanker, and collisions.", "fast": ["Momentum = mass × velocity; the larger the momentum, the harder to stop.", "Inertia: objects keep their state; when braking, liquid surges forward.", "When turning, water moves to the outside (opposite to the direction of the turn).", "In a collision the two forces are equal, and acceleration is inversely proportional to mass."], "trap": null, "table": null, "new": false, "ex": {"q": "Two vehicles collide, each exerting the same force on the other. The first has three times the mass of the second. What is the ratio of the second’s acceleration to the first’s?", "o": ["1 : 3", "3 : 1", "1 : 1", "9 : 1"], "a": 1, "f": "", "s": ["Same force and acceleration = force ÷ mass → the lighter one accelerates three times as much → 3 : 1."], "c": 4}, "pr": [{"q": "A partly filled tanker brakes suddenly. The liquid surges towards:", "o": ["the back of the tank", "the front of the tank", "the bottom of the tank", "it does not move"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "Which cart has the greatest momentum?", "o": ["4 kg at 1 m/s", "3 kg at 1.5 m/s", "2 kg at 3 m/s", "1 kg at 4 m/s"], "a": 2, "f": "", "s": [], "c": 2}]}, {"id": "L3-31", "n": 31, "t": "Free Fall and Projectiles", "concept": "Balls dropped or thrown horizontally, and speed after a given time.", "fast": ["Ignoring air: all objects fall with the same acceleration whatever their mass.", "A ball thrown horizontally and one dropped from the same height land together; horizontal motion does not change the fall time.", "Speed = g × t (g ≈ 10 m/s²), and the path of a horizontal projectile is curved."], "trap": null, "table": null, "new": false, "ex": {"q": "Two balls at the same height: one is dropped and the other is thrown horizontally at the same moment (ignore air). Which lands first?", "o": ["The first", "The second", "They land together", "Cannot be decided"], "a": 2, "f": "", "s": ["Fall time depends only on height; horizontal speed does not change it."], "c": 4}, "pr": [{"q": "A ball falls from rest (g = 10 m/s²). What is its speed after 3 seconds?", "o": ["10 m/s", "20 m/s", "30 m/s", "45 m/s"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "A ball is thrown horizontally near a planet’s surface. What is its path?", "o": ["A horizontal straight line", "A curve towards the surface", "Straight down", "A circle around the planet"], "a": 1, "f": "", "s": [], "c": 2}]}, {"id": "L3-32", "n": 32, "t": "Work, Energy and Energy Changes", "concept": "Ramps, kinetic energy, or the energy changes in a device.", "fast": ["Work = force × distance; a ramp reduces the force but increases the distance, and the work stays the same (ignoring friction).", "Kinetic energy = ½mv²: doubling the speed → four times the energy.", "Trace the change: where does the energy start, and what does it become?"], "trap": null, "table": null, "new": false, "ex": {"q": "If a car’s speed doubles, its kinetic energy:", "o": ["doubles", "becomes 4 times as much", "stays the same", "halves"], "a": 1, "f": "", "s": ["Energy depends on the square of the speed: 2² = 4."], "c": 4}, "pr": [{"q": "A ramp halves the force needed to lift a stone. The total work (ignoring friction):", "o": ["halves", "doubles", "stays the same", "becomes a quarter"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "What is the main energy change in an electric fan?", "o": ["thermal → electrical", "electrical → kinetic", "chemical → light", "kinetic → electrical"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L3-33", "n": 33, "t": "Electricity: Ohm’s Law, Series and Parallel", "concept": "Ohm’s law, bulbs in series or in parallel, and what happens when one burns out.", "fast": ["Ohm’s law: voltage = current × resistance.", "Series: one current; if one bulb fails they all go out, and adding bulbs makes them dimmer.", "Parallel: each branch has the same voltage; one failed bulb does not affect the others."], "trap": null, "table": null, "new": false, "ex": {"q": "A conductor of 10 Ω carries a current of 2 A. What is the voltage across it?", "o": ["5 V", "12 V", "20 V", "0.2 V"], "a": 2, "f": "", "s": ["V = 2 × 10 = 20 V."], "c": 4}, "pr": [{"q": "Three bulbs are in parallel with a source and one burns out. What happens to the other two?", "o": ["They get brighter", "They get dimmer", "Their brightness stays the same", "They go out"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "Two conductors each have 20 V across them; the first carries 1 A and the second 0.5 A. What is the ratio of the first resistance to the second?", "o": ["2 : 1", "1 : 2", "1 : 1", "4 : 1"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L3-34", "n": 34, "t": "Pressure, Floating and Centre of Gravity", "concept": "Tyres on sand, ships, and objects that float or tip over.", "fast": ["Pressure = force ÷ area: a larger area → lower pressure (wide tyres, snowshoes).", "A low centre of gravity = more stability; that is why heavy loads go at the bottom.", "A floating object settles with its heavier part down, and returns to that position if turned over."], "trap": null, "table": null, "new": false, "ex": {"q": "Why are engines and heavy equipment placed at the bottom of a ship?", "o": ["To increase its speed", "To lower the centre of gravity and increase stability", "To reduce buoyancy", "To increase the surface area"], "a": 1, "f": "", "s": ["A low centre of gravity stops the ship from capsizing."], "c": 2}, "pr": [{"q": "Why are desert car tyres made wide?", "o": ["To increase pressure on the sand", "To reduce pressure on the sand", "To increase speed", "To reduce weight"], "a": 1, "f": "", "s": [], "c": 2}, {"q": "A cube, half wood and half iron, floats with the wood on top. It is turned over so the iron is on top and released. What happens?", "o": ["It stays in the new position", "It turns back to its original position", "It sinks immediately", "It splits in two"], "a": 1, "f": "", "s": [], "c": 2}]}, {"id": "L3-35", "n": 35, "t": "Light and Sound", "concept": "Types of mirrors and lenses and their uses, and how sound changes with motion.", "fast": ["Convex mirror: upright, smaller image and a wide field of view (shop corners, car side mirrors).", "Concave mirror: magnifies near objects (shaving mirror); plane mirror: makes a room look bigger in décor.", "Moving towards a sound source: frequency increases and wavelength decreases; moving away: the opposite."], "trap": null, "table": null, "new": false, "ex": {"q": "Which mirror is placed in shop corners to watch a wide area?", "o": ["plane", "concave", "convex", "convex lens"], "a": 2, "f": "", "s": ["A convex mirror gives a wide field of view with a smaller image."], "c": 4}, "pr": [{"q": "A train approaches a girl on the platform quickly, sounding a horn of constant pitch. How does she hear it?", "o": ["Lower frequency, longer wavelength", "Higher frequency, shorter wavelength", "Both unchanged", "Both increase"], "a": 1, "f": "", "s": [], "c": 2}, {"q": "An item used in décor to make a room look bigger:", "o": ["plane mirror", "concave mirror", "convex lens", "concave lens"], "a": 0, "f": "", "s": [], "c": 4}]}, {"id": "L3-36", "n": 36, "t": "Chemistry, Biology and the Scientific Method", "concept": "Direct questions on atoms, bonds, states of matter and the cell, and on variables in experiments.", "fast": ["Water H<sub>2</sub>O: two hydrogen atoms and one oxygen atom joined by polar covalent bonds.", "Sublimation: solid → gas directly. Melting absorbs heat; freezing releases it.", "Independent variable: what I change. Dependent: what I measure. Controlled: what I keep the same.", "White blood cells engulf germs (phagocytosis), just as an amoeba feeds."], "trap": null, "table": null, "new": false, "ex": {"q": "In an experiment on the effect of the amount of fertiliser on plant height, “plant height” is the:", "o": ["independent variable", "dependent variable", "controlled variable", "hypothesis"], "a": 1, "f": "", "s": ["Plant height is what we measure as the result → dependent; the amount of fertiliser is independent."], "c": 4}, "pr": [{"q": "What type of bonds join the two hydrogen atoms to the oxygen atom in a water molecule?", "o": ["ionic", "metallic", "polar covalent", "hydrogen"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "Dry ice (solid) changing directly into gas is called:", "o": ["evaporation", "condensation", "sublimation", "melting"], "a": 2, "f": "", "s": [], "c": 4}]}]}, {"key": "d", "title": "Mental Flexibility", "color": "#7c3aed", "sub": "Shape matrices & ": 3, "f": "", "s": [], "c": 4}]}, {"id": "L3-40", "n": 40, "t": "Compound Sequences (Numbers and Letters)", "concept": "Sequences where simple differences are not enough: multiply then add, changing multipliers, square differences, or letters that skip.", "fast": ["Do the numbers roughly double? Try (× 2 + 1) or (× 2 − 1).", "Is growth very fast? Try multiplying by 1, then 2, then 3…", "Are the differences themselves squares (1, 4, 9, 16) or primes?", "Letters: number them by alphabet position (A = 1, B = 2, C = 3…) and look for the pattern."], "trap": null, "table": null, "new": false, "ex": {"q": "What is the next number? <span class=\"ns\"><b>2</b><b>5</b><b>11</b><b>23</b><b>47</b><b>?</b></span>", "o": ["71", "90", "94", "95"], "a": 3, "f": "", "s": ["Each number = previous × 2 + 1 → 47 × 2 + 1 = 95."], "c": 4}, "pr": [{"q": "What is the next number? <span class=\"ns\"><b>5</b><b>5</b><b>10</b><b>30</b><b>120</b><b>?</b></span>", "o": ["240", "480", "600", "720"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "What is the next number? <span class=\"ns\"><b>1</b><b>2</b><b>6</b><b>15</b><b>31</b><b>?</b></span>", "o": ["47", "52", "56", "63"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "What is the next letter? <span class=\"ns\"><b>B</b><b>D</b><b>G</b><b>K</b><b>?</b></span>", "o": ["N", "O", "P", "Q"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L3-41", "n": 41, "t": "Complex Ordering and Comparison", "concept": "Many clues about race positions, birth months or shape weights; find the first, the last or the position of a particular person.", "fast": ["Asked for the first/oldest/heaviest (or last/youngest/lightest)? Eliminate everyone a clue says is beaten by someone else; the one left is the answer.", "Asked for the second, the third or a particular position? Draw numbered slots or arrows, place the absolute fact first (last, third), and treat paired facts (“directly before”) as one block.", "With ages: born first = oldest. With weights: turn everything into symbols (> and =)."], "trap": null, "table": null, "new": false, "ex": {"q": "Five runners: Nayef finished last, Khalid finished directly before Saeed, Majed was neither first nor second, and Faisal finished before Khalid. Who won?", "o": ["Khalid", "Faisal", "Saeed", "Majed"], "a": 1, "f": "", "s": ["We need the first → eliminate: Nayef ✗ (last), Saeed ✗ (after Khalid), Khalid ✗ (after Faisal), Majed ✗ (not first) → Faisal is left ✓.", "If asked who came third, draw the slots with arrows: Faisal → Khalid → Saeed → Majed → Nayef → third is Saeed."], "c": 4}, "pr": [{"q": "Ahmed was born in March. Khalid was born 4 months after him, Fahd 2 months before Ahmed, and Mazen a month after Khalid (all in the same year). Who is the oldest?", "o": ["Ahmed", "Khalid", "Fahd", "Mazen"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "<span class=\"sym\" style=\"color:#be123c\">●</span> is heavier than <span class=\"sym\" style=\"color:#1d4ed8\">■</span>, <span class=\"sym\" style=\"color:#0f766e\">▲</span> weighs the same as <span class=\"sym\" style=\"color:#be123c\">●</span><span class=\"sym\" style=\"color:#be123c\">●</span>, and <span class=\"sym\" style=\"color:#1d4ed8\">■</span> is heavier than <span class=\"sym\" style=\"color:#d97706\">★</span>. Which shape is the lightest?", "o": ["<span class=\"sym\" style=\"color:#be123c\">●</span>", "<span class=\"sym\" style=\"color:#1d4ed8\">■</span>", "<span class=\"sym\" style=\"color:#0f766e\">▲</span>", "<span class=\"sym\" style=\"color:#d97706\">★</span>"], "a": 3, "f": "", "s": [], "c": 4}]}, {"id": "L3-42", "n": 42, "t": "Conditions and Lock Codes", "concept": "Choosing a group under conditions (if… then…), or a lock code with correct/incorrect clues.", "fast": ["Fastest: take each option and check it against the conditions one by one; the first violation eliminates it.", "“C only plays with D” means: if C appears without D, the option is wrong.", "Lock codes: start with the clue “nothing is correct” and cross out its digits."], "trap": null, "table": null, "new": false, "ex": {"q": "A coach picks 3 players from A, B, C, D, E with these rules: if A is picked, B is not; C only plays with D; E is always picked. Which choice is valid?", "o": ["A, B, E", "C, D, E", "A, C, E", "B, C, E"], "a": 1, "f": "", "s": ["(A) is wrong: A with B. (C) and (D) are wrong: C without D. That leaves (B): C, D, E ✓."], "c": 4}, "pr": [{"q": "A 3-digit code:<ul class=\"clues\"><li><span class=\"code\"><b>4</b><b>7</b><b>9</b></span> two digits correct and in place.</li><li><span class=\"code\"><b>9</b><b>1</b><b>6</b></span> one digit correct but in the wrong place.</li><li><span class=\"code\"><b>3</b><b>5</b><b>7</b></span> one digit correct but in the wrong place.</li><li><span class=\"code\"><b>8</b><b>2</b><b>0</b></span> nothing is correct.</li></ul>What is the code?", "o": ["<span class=\"code\"><b>4</b><b>1</b><b>7</b></span>", "<span class=\"code\"><b>4</b><b>7</b><b>9</b></span>", "<span class=\"code\"><b>4</b><b>7</b><b>1</b></span>", "<span class=\"code\"><b>1</b><b>7</b><b>4</b></span>"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "Sami wears his shoes in this order every day: red, blue, green, yellow, then repeats. What colour does he wear on day 30?", "o": ["red", "blue", "green", "yellow"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L3-43", "n": 43, "t": "Organised Counting and Paths", "concept": "The number of routes on a grid, or the number of triangles in a compound figure.", "fast": ["Grid paths (only right and up): write 1 along both edges; each point = the sum of the two points before it.", "A triangle with lines from the top splitting the base into n parts: triangles per level = 1 + 2 + … + n.", "Each horizontal line across the lines adds a new level with the same number of triangles."], "trap": null, "table": null, "new": false, "ex": {"q": "In how many ways can you go from Start to End moving only right or up along the grid lines?", "o": ["4", "5", "6", "8"], "a": 2, "f": "<svg class=\"fig\" s is better than treating it later."], ["“Whoever neglects reading stays trapped in limited knowledge.” This means:", "Reading widens knowledge", "Reading traps people", "Books are expensive", "There is no need to read", "People who do not read know less."], ["“Whoever does not listen to others misses a lot of good advice.” The lesson is:", "Listening to others is important", "Talking a lot is useful", "Advice is not important", "Silence is always harmful", "Listening brings useful advice."], ["<div class=\"passage\">Noura has visited the dentist twice a week this month.</div>The most likely reason:", "She is treating tooth decay", "She is training as a doctor", "She visits a friend there", "She likes the dentist", "Frequent visits suggest ongoing treatment."], ["<div class=\"passage\">Plants use sunlight to make their food, and the green substance chlorophyll absorbs that light.</div>The job of chlorophyll is:", "Absorbing light to make food", "Only colouring the plant", "Breathing for the plant", "Absorbing water from soil", "The text says it absorbs light to make food."], ["“Whoever rushes his decisions is followed by regret.” The lesson is:", "Taking your time is safer", "Speed is always useful", "Decisions do not matter", "Regret is pleasant", "Rushing brings regret."], ["“Help the needy and the destitute.” The word “destitute” means:", "very poor", "rich", "generous", "stingy", "Destitute means having nothing."]], "riddle": [["I have a neck but no head, and I wear a cap. What am I?", "a bottle", "a shirt", "a giraffe", "a pen", "A bottle has a neck and a cap."], ["I move without legs and cry without eyes. What am I?", "a cloud", "a clock", "a river", "the wind", "A cloud moves and rains."], ["The more you take from me, the bigger I get. What am I?", "a hole", "a cake", "water", "a book", "The more you dig, the bigger the hole."], ["My name starts with the letter A and ends with the letter M. Who am I?", "Adam", "Amir", "Omar", "Sam", "Adam: starts with A, ends ents need because it helps them organise their time between study and play. Bartomy means:", "time management", "memorising lessons", "doing sport", "drawing", "The sentence after “because” explains it."], ["“The manager praised the hard work of loyal employees.” The word “praised” means:", "spoke well of", "criticised", "ignored", "was angry with", "To praise is to speak well of."], ["The “zugloff” bird cannot fly but runs very fast across the plains. So the zugloff is a bird that:", "runs but cannot fly", "lives in water", "flies long distances", "lives in trees", "The description follows “cannot fly but runs”."], ["“A person should stay humble however high their position.” This means:", "A high position does not justify arrogance", "Success comes with pride", "High positions are only an honour", "Humility is only for the weak", "It calls for humility even in a high position."], ["“Avoid the company of careless people so you don’t pick up their habits.” This means:", "Friends affect behaviour", "Carelessness brings success", "Being with everyone is important", "Habits never change", "Companions influence each other."], ["The weather was “scorching”, so people drank lots of cold water and stayed in the shade. Scorching means:", "very hot", "very cold", "rainy", "breezy", "Cold water and shade suggest heat."], ["Medicine is ...... for the sick, but too much of it ......", "useful – harms", "harmful – helps", "expensive – cheap", "bitter – sweet", "“But” shows the contrast."], ["The student learned “shanklery”, so now he can read maps and find directions. Shanklery means:", "the skill of finding directions", "colouring", "mental maths", "neat handwriting", "The result describes the skill."]], "sayings": [["“Health is a crown on the heads of the healthy that only the sick can see.” This shows:", "the value of health before it is lost", "the sick are more cheerful", "healthy people never get ill", "kings are healthier", "Only those who lose health feel its value."], [" omorrow and your friend wants to play all evening. The best action:", "Politely say no and suggest another time to play", "Play and skip revising", "Get angry with him", "End the friendship", "It balances duty and friendship."], ["You hurt a classmate’s feelings by accident. The best action:", "Apologise to him clearly", "Wait for him to forget", "Blame him", "Avoid him", "An apology fixes the mistake."], ["Your group disagrees during a project. The best action:", "Listen to every opinion and choose using evidence", "Let the strongest decide", "Everyone stops working", "Postpone the project", "Discussion and a reasoned choice."], ["Mazen’s house plant wilted even though he waters it every day. The most likely reason:", "Too little light or too much water", "Plants never like water", "Because Mazen loves it", "Because it is always winter", "Plants need the right amount of light and water."], ["The lights went out only in your house while your neighbours still have power. The most likely reason:", "A tripped switch in your house", "A power cut across the city", "The sun set", "All the bulbs burned out together", "The problem is limited to your house."], ["You want to remember your homework every day. The best way:", "Write it in a planner", "Rely on memory only", "Ask classmates every night", "Leave it to the weekend", "Writing it down prevents forgetting."]], "deduce": [["All birds have feathers, and a parrot is a bird. We conclude that:", "a parrot has feathers", "everything with feathers is a parrot", "a parrot cannot fly", "we cannot decide", "The parrot is inside the bird group."], ["Some students like drawing, and Sami is a student. We conclude that:", "we cannot decide whether Sami likes drawing", "Sami certainly likes drawing", "Sami does not like drawing", "all students like drawing", "“Some” does not tell us about Sami."], ["All the team players train daily, and Khalid trains daily. We conclude that:", "we cannot decide whether he is on the team", "Khalid is fer by 3, with the bigger digit first. What is it?", "63", "36", "54", "72", "6 + 3 = 9 and 6 − 3 = 3, bigger first."], ["Four boxes of different colours: red is before blue, green is last, yellow is first. Which box is third?", "blue", "red", "yellow", "green", "Yellow, red, blue, green."], ["Reem does one sport a day in order: swimming, running, cycling, then repeats. What does she do on day 20?", "running", "swimming", "cycling", "rest", "20 ÷ 3 leaves 2 → the second sport: running."]], "elec": [["Which material is an electrical insulator?", "rubber", "copper", "iron", "aluminium", "Rubber does not conduct electricity."], ["Why are electric wires covered in plastic?", "It insulates and protects us from shocks", "It conducts electricity faster", "Only to colour the wire", "It attracts magnets", "Plastic is an insulator."], ["A new bulb is added in series to a line of bulbs. What happens to their brightness?", "They get dimmer", "They get brighter", "No change", "They all go out", "In series the resistance increases and the current falls."], ["Which part opens and closes a circuit?", "the switch", "the battery", "the bulb", "the wire", "The switch controls the current."], ["What is the energy source in a simple circuit?", "the battery", "the bulb", "the switch", "the bell", "The battery supplies the energy."], ["Which connection is used in homes so everything does not go off when one device fails?", "parallel", "series", "no wires", "crossed", "In parallel each branch works on its own."], ["A circuit has two bulbs in parallel and a battery. One bulb is removed. The other bulb:", "stays on", "goes out", "burns", "reflects light", "Its branch is still closed."], ["Why should we not touch electrical devices with wet hands?", "Water helps carry electricity into the body", "Water is an insulator", "Only the device gets damaged", "Water switches electricity off", "Tap water conducts electricity."], ["A comb is rubbed with wool and brought near paper scraps. What happens?", "It attracts the scraps", "It repels them", "They burn", "Nothing", "Static charge attracts light objects."], ["Two like charges:", "repel", "attract", "disappear", "become a magnet", "Like charges repel."]], "magnet": [["Where is a magnet’s force strongest?", "at the poles", "in the middle", "the same everywhere", "on the bottom", "The force is strongest at the poles."], ["Two unlike poles (north and south) facing each other:", "attract", "repel", "are not affected", "spin", "Unlike poles attract."], ["Which of these is NOT attracted to a magnet?", "a copper coin", "an iron nail", "an iron paper clip", "iron filings", "Copper is not attracted."], ["How can we easily separate iron filings from sand?", "with a magnet", "with water", "by heating", "only with a sieve", "The magnet picks up only the iron."], ["Which direction does a compass needle always point?", "north", "east", "west", "towards the person", "The compass needle points north."], ["A magnet is cut into two halves. Each half:", "becomes a magnet with two poles", "loses its magnetism", "has only one pole", "turns into copper", "Each piece has a north and a south pole."], ["Which of these uses a magnet?", "keeping a fridge door closed", "a solar lamp lighting up", "ice melting", "a kite flying", "The fridge door seal contains a magnet."], ["A sheet of paper is placed between a magnet and an iron clip. What happens?", "The clip is still attracted", "It is never attracted", "The paper burns", "The clip is repelled", "Magnetic force passes through thin paper."]], "heat": [["Why are cooking pots made of metal?", "Metal carries heat quickly", "Metal insulates heat", "Only because it is light", "Fire never affects it", "Metals are good heat conductors."], ["Why are pot handles made of wood or plastic?", "They are heat insulators", "They conduct heat", "They are heavy", "Only for decoration", "Insulators protect the hand from heat."], ["A glass of hot water is left in a room. After a while:", "it cools to near om:", "water vapour condensing in cool air", "rain every night", "plants sweating", "melting ice", "Vapour cools and condenses."]], "light": [["Why do we see lightning before we hear thunder?", "Light travels faster than sound", "Sound travels faster than light", "Thunder happens much later", "Our eyes are stronger than our ears", "Light is much faster than sound."], ["Which object lets almost all light pass through?", "clear glass", "wood", "cardboard", "stone", "Clear glass is transparent."], ["A shadow forms when:", "an opaque object blocks light", "light passes through glass", "it is completely dark", "light reflects from a mirror", "An opaque object blocks the light."], ["How does your image look in a plane mirror?", "upright and the same size, with left and right swapped", "upside down", "always magnified", "always smaller", "A plane mirror swaps left and right."], ["Which mirror is used for shaving and make-up because it magnifies a near face?", "concave", "convex", "plane", "none", "A concave mirror magnifies near objects."], ["Sound bouncing off mountains makes us hear:", "an echo", "lightning", "light", "wind", "An echo is reflected sound."], ["Why is no sound heard on the Moon’s surface?", "There is no air for sound to travel through", "The Moon is cold", "Gravity is weak", "The Moon is far away", "Sound needs a medium."], ["How does light travel?", "in straight lines", "in zigzags", "in circles", "it does not move", "Light travels in straight lines."], ["Which wind-chime tube gives a lower (deeper) note?", "the longer, thicker tube", "the shorter tube", "the thinner tube", "no difference", "Longer objects vibrate at a lower frequency."], ["A train moves away from you sounding its horn. How does the note sound?", "lower", "higher", "unchanged", "it vanishes at once", "Moving away lowers the frequency."]], "moon": [["The Moon shines because it:", "reflects sunlight", "makes its own light", "is full of fire", "is near the stars", "The Moon reflects the Sun’ o light and heat."], ["What energy change happens in a solar cell?", "light → electrical", "electrical → light", "chemical → heat", "kinetic → sound", "A solar cell makes electricity from light."], ["What form of energy is stored in a battery?", "chemical", "kinetic", "sound", "light", "Batteries store chemical energy."], ["A ball at the top of a slope rolls down. Its energy changes from:", "potential → kinetic", "kinetic → potential", "electrical → kinetic", "heat → light", "Height gives potential energy that becomes motion."], ["When riding a bicycle, the first form of energy in the chain is:", "chemical (from food)", "kinetic", "electrical", "light", "The body uses energy from food."], ["If an object’s speed triples, its kinetic energy:", "becomes 9 times as much", "becomes 3 times as much", "becomes 6 times as much", "does not change", "Energy depends on speed squared: 3² = 9."]], "chem": [["The smallest unit of an element that keeps its properties:", "the atom", "the molecule", "the cell", "the electron", "The atom."], ["The chemical formula of water:", "H<sub>2</sub>O", "CO<sub>2</sub>", "O<sub>2</sub>", "NaCl", "Two hydrogen atoms and one oxygen atom."], ["Table salt is made of:", "sodium and chlorine", "carbon and oxygen", "hydrogen and oxygen", "iron and sulfur", "Sodium chloride, NaCl."], ["The gas humans need to breathe:", "oxygen", "carbon dioxide", "nitrogen", "helium", "We breathe in oxygen."], ["The gas plants absorb to make food:", "carbon dioxide", "oxygen", "helium", "only nitrogen", "Photosynthesis needs CO₂."], ["In an experiment on how light affects plant growth, the independent variable is:", "the amount of light", "the plant’s height", "the fixed soil type", "the fixed amount of water", "The independent variable is what we change."], ["The process that makes two cells with identical genetic material:", "mitosis", "translation", "respiration", "photosynthesis", "Mitosis gives two identical cells."], ["Which of these is a chemical change?", "burning paper", "dissolving sugar in water", "freezing water", "tearing paper", "Burning makes new substances."]]}};</script>
<script>/* ============ question generators (fresh questions every time) ============ */
let LANG = "ar";
const QM = () => LANG === "en" ? "?" : "؟";
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const lcm = (a, b) => a / gcd(a, b) * b;
const F = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const NS = arr => '<span class="ns">' + arr.map(x => `<b>${x}</b>`).join('') + '</span>';
const BOYS = ["أحمد", "خالد", "سعد", "فهد", "ماجد", "علي", "سالم", "ناصر", "بدر", "فيصل", "يوسف", "عمر", "زياد", "نايف", "مازن", "سامي", "هاني", "طارق"];
const GIRLS = ["سارة", "ريم", "نورة", "هند", "سلمى", "ليلى", "غادة", "أمل", "عبير", "منى"];
const DAYS = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
const SYMC = { "★": "#d97706", "●": "#be123c", "▲": "#0f766e", "■": "#1d4ed8", "♥": "#db2777", "◆": "#7c3aed" };
const SYM = s => `<span class="sym" style="color:${SYMC[s] || '#111'}">${s}</span>`;

/* numeric question: correct value + plausible wrong values */
function numQ(q, ans, wrong, sol, fig = "", unit = "") {
  const seen = new Set([String(ans)]); const w = [];
  for (const x of wrong) { const k = String(x); if (!seen.has(k) && x !== null && x !== undefined && !(typeof x === 'number' && (x < 0 || !isFinite(x)))) { seen.add(k); w.push(x); } if (w.length === 3) break; }
  let d = 1;
  while (w.length < 3) { for (const c of [ans + d, ans - d]) { if (w.length < 3 && c >= 0 && !seen.has(String(c))) { seen.add(String(c)); w.push(c); } } d++; }
  return txtQ(q, ans + unit, w.map(x => x + unit), sol, fig);
}
function txtQ(q, correct, wrong, sol, fig = "", cols) {
  const seen = new Set([String(correct)]); const w = [];
  for (const x of wrong) { if (x !== undefined && !seen.has(String(x))) { seen.add(String(x)); w.push(x); } }
  const opts = shuffle([correct, ...w.slice(0, 3)]);
  const long = opts.some(o => String(o).replace(/<[^>]+>/g, '').length > 16);
  return { q, o: opts, a: opts.indexOf(correct), f: fig, s: Array.isArray(sol) ? sol : [sol], c: cols || (long ? 2 : 4), gen: true };
}
function figQ(q, correctSvg, wrongSvgs, sol, fig = "") {
  const opts = shuffle([correctSvg, ...wrongSvgs.slice(0, 3)]);
  return { q, o: opts, a: opts.indexOf(correctSvg), f: fig, s: [sol], c: 4, gen: true };
}

/* ---------------- figures (drawn on light "paper") ---------------- */
const svg = (w, h, b, cls = "fig") => `<svg class="${cls}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
const T = (x, y, s, size = 14, fill = "#1f2937", w = 700) => `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" font-weight="${w}" text-anchor="middle" dominant-baseline="central" font-family="Cairo, sans-serif">${s}</text>`;
const pts = (n, cx, cy, r, rot = -90) => Array.from({ length: n }, (_, i) => { const a = (rot + 360 * i / n) * Math.PI / 180; return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`; }).join(" ");
const C1 = "#0f766e", C2 = "#be123c", AM = "#d97706";
function polyDots(n, k, s = 70) { const c = s / 2; let b = `<polygon points="${pts(n, c, c + (n === 3 ? 3 : 0), s * .44)}" fill="#fff" stroke="${C1}" stroke-width="2.2"/>`; const rr = s * .14; for (let i = 0; i < k; i++) { const a = (-90 + 360 * i / k) * Math.PI / 180; b += `<circle cx="${(c + rr * Math.cos(a)).toFixed(1)}" cy="${(c + 4 + rr * Math.sin(a)).toFixed(1)}" r="3.6" fill="${C2}"/>`; } return svg(s, s, b, "fig sm"); }
function polyNum(n, num, s = 72) { const c = s / 2; return svg(s, s, `<polygon points="${pts(n, c, c + (n === 3 ? 4 : 0), s * .45)}" fill="#fff" stroke="${C1}" stroke-width="2.2"/>` + T(c, c + (n === 3 ? 8 : 2), num, 15), "fig sm"); }
function arrow(angle, s = 50) { const c = s / 2; return svg(s, s, `<rect x="2" y="2" width="${s - 4}" height="${s - 4}" rx="6" fill="#fff" stroke="#cbd5e1"/><g transform="rotate(${angle} ${c} ${c})"><line x1="${c}" y1="${c + 15}" x2="${c}" y2="${c - 10}" stroke="#134e4a" stroke-width="4" stroke-linecap="round"/><polygon points="${c},${c - 18} ${c - 8},${c - 6} ${c + 8},${c - 6}" fill="#134e4a"/></g>`, "fig sm"); }
function dark2x2(pos, s = 50) { const h = (s - 4) / 2; let b = ""; for (let i = 0; i < 4; i++) { const r = Math.floor(i / 2), c = i % 2; b += `<rect x="${2 + c * h}" y="${2 + r * h}" width="${h}" height="${h}" fill="${i === pos ? '#134e4a' : '#fff'}" stroke="${C1}" stroke-width="2"/>`; } return svg(s, s, b, "fig sm"); }
const BORDER = [[0, 0], [0, 1], [0, 2], [1, 2], [2, 2], [2, 1], [2, 0], [1, 0]];
function ring3(pos, s = 54) { const h = (s - 4) / 3; let b = ""; const [dr, dc] = BORDER[pos]; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) b += `<rect x="${(2 + c * h).toFixed(1)}" y="${(2 + r * h).toFixed(1)}" width="${h.toFixed(1)}" height="${h.toFixed(1)}" fill="${r === dr && c === dc ? '#312e81' : '#fff'}" stroke="#6366f1" stroke-width="1.5"/>`; return svg(s, s, b, "fig sm"); }
const qbox = (s = 50) => svg(s, s, `<rect x="2" y="2" width="${s - 4}" height="${s - 4}" fill="#fff" stroke="${AM}" stroke-width="2" stroke-dasharray="4 3"/>` + T(s / 2, s / 2, QM(), 24, AM), "fig sm");
const seqRow = items => '<div class="seq">' + items.map(x => `<span>${x}</span>`).join('') + '</div>';
function triNum(top, l, r, c, color = C1) { return svg(120, 106, `<polygon points="60,6 6,100 114,100" fill="#fff" stroke="${color}" stroke-width="2.5"/><circle cx="60" cy="70" r="15" fill="#ccfbf1" stroke="${color}"/>` + T(60, 34, top, 15) + T(28, 88, l, 15) + T(92, 88, r, 15) + T(60, 70, c, 15, "#134e4a")); }
function circNum(top, l, r, color = C1) { return svg(100, 100, `<circle cx="50" cy="50" r="45" fill="#fff" stroke="${color}" stroke-width="2.5"/><line x1="5" y1="50" x2="95" y2="50" stroke="${color}" stroke-width="2"/><line x1="50" y1="50" x2="50" y2="95" stroke="${color}" stroke-width="2"/>` + T(50, 28, top, 16) + T(30, 70, l, 16) + T(70, 70, r, 16)); }
const figRow = arr => '<div class="figrow">' + arr.join('') + '</div>';
function gridSq(n) { const s = 34; let b = ""; for (let i = 0; i <= n; i++) { b += `<line x1="${10 + i * s}" y1="10" x2="${10 + i * s}" y2="${10 + n * s}" stroke="${C1}" stroke-width="2.5"/><line x1="10" y1="${10 + i * s}" x2="${10 + n * s}" y2="${10 + i * s}" stroke="${C1}" stroke-width="2.5"/>`; } return svg(20 + n * s, 20 + n * s, b); }
function stairs(n, cell = 22) { let b = ""; for (let col = 0; col < n; col++) for (let r = 0; r <= col; r++) b += `<rect x="${4 + col * cell}" y="${4 + (n - 1 - r) * cell}" width="${cell}" height="${cell}" fill="#fbcfe8" stroke="#831843" stroke-width="1.6"/>`; return svg(n * cell + 8, n * cell + 8, b); }
function triCev(parts, mid = false) { let b = `<polygon points="100,8 10,120 190,120" fill="#fff" stroke="${C1}" stroke-width="2.5"/>`; for (let i = 1; i < parts; i++) { const x = 10 + 180 * i / parts; b += `<line x1="100" y1="8" x2="${x.toFixed(1)}" y2="120" stroke="${C1}" stroke-width="2"/>`; } if (mid) b += `<line x1="55" y1="64" x2="145" y2="64" stroke="${C1}" stroke-width="2"/>`; return svg(200, 128, b); }
function netFig(cells, numbers = true, cell = 40) { let R0 = 0, C0 = 0; for (const k in cells) { const [r, c] = k.split(',').map(Number); R0 = Math.max(R0, r); C0 = Math.max(C0, c); } let b = ""; for (const k in cells) { const [r, c] = k.split(',').map(Number); const x = 4 + c * cell, y = 4 + r * cell; b += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" fill="#fff" stroke="${C1}" stroke-width="2"/>`; const v = cells[k]; if (v) b += numbers ? T(x + cell / 2, y + cell / 2, v, 17, "#134e4a") : T(x + cell / 2, y + cell / 2, v, 20, SYMC[v] || "#111", 400); } return svg((C0 + 1) * cell + 8, (R0 + 1) * cell + 8, b); }
function shapeIn(kind, x, y, s, fill, col = C1) { if (kind === "c") return `<circle cx="${x}" cy="${y}" r="${s}" fill="${fill}" stroke="${col}" stroke-width="2"/>`; if (kind === "s") return `<rect x="${x - s}" y="${y - s}" width="${2 * s}" height="${2 * s}" fill="${fill}" stroke="${col}" stroke-width="2"/>`; return `<polygon points="${x},${y - s - 2} ${x - s - 2},${y + s} ${x + s + 2},${y + s}" fill="${fill}" stroke="${col}" stroke-width="2"/>`; }
const KCOL = { c: "#be123c", s: "#1d4ed8", t: "#0f766e" };
function cellCount(kind, k, size = 56) { let b = `<rect x="1" y="1" width="${size - 2}" height="${size - 2}" fill="#fff" stroke="#94a3b8"/>`; if (kind === "?") return b + T(size / 2, size / 2, QM(), 26, AM); const xs = { 1: [.5], 2: [.32, .68], 3: [.22, .5, .78] }[k]; for (const fx of xs) b += shapeIn(kind, size * fx, size / 2, 7, KCOL[kind], KCOL[kind]); return b; }
function cellFill(kind, fill, size = 56) { let b = `<rect x="1" y="1" width="${size - 2}" height="${size - 2}" fill="#fff" stroke="#94a3b8"/>`; if (kind === "?") return b + T(size / 2, size / 2, QM(), 26, AM); const col = "#4338ca"; const id = "g" + Math.random().toString(36).slice(2, 8); const fv = { e: "#fff", f: col, h: `url(#${id})` }[fill]; b += `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset=".5" stop-color="${col}"/><stop offset=".5" stop-color="#fff"/></linearGradient></defs>`; return b + shapeIn(kind, size / 2, size / 2, 15, fv, col); }
const one = (inner, s = 58) => svg(s, s, inner, "fig sm");
function matrixFig(grid, drawer) { const s = 56; let b = ""; grid.forEach((row, r) => row.forEach((cl, c) => { b += `<g transform="translate(${4 + c * s},${4 + r * s})">${drawer(...cl, s)}</g>`; })); return svg(3 * s + 8, 3 * s + 8, b); }

E.percent = () => { if (R(0, 1)) { const p1 = 5 * R(2, 7), p2 = 5 * R(2, 7); if (p1 + p2 >= 90) return E.percent(); const rem = 100 - p1 - p2; const sal = 100 * R(30, 90); const remain = sal * rem / 100; return numQ(`${pick(BOYS_E)} paid ${p1}% of his salary for rent and ${p2}% for expenses, leaving ${remain} riyals. What is his salary?`, sal, [remain * 2, sal + 1000, sal - 1000], `Remaining ${rem}% = ${remain} → 1% = ${remain / rem} → salary = ${sal}.`); } const pr = 20 * R(2, 15), d = pick([10, 20, 25, 50]); return numQ(`An item costs ${pr} riyals with a ${d}% discount. What is the price after the discount?`, pr * (100 - d) / 100, [pr * d / 100, pr - d, pr * (100 - d) / 100 + 10], `Discount = ${pr * d / 100} → price = ${pr} − ${pr * d / 100} = ${pr * (100 - d) / 100}.`); };

E.growPattern = () => { const t = pick([[2, 2, "Square tables in a row: 1 table seats 4, 2 tables seat 6, 3 tables seat 8. How many people sit around", "tables"], [3, 1, "One square needs 4 matchsticks, 2 squares in a row 7, and 3 squares 10. How many matchsticks for", "squares in a row"], [2, 1, "One triangle needs 3 matchsticks, 2 triangles in a row 5, and 3 triangles 7. How many matchsticks for", "triangles"]]); const n = R(8, 25), ans = t[0] * n + t[1]; return numQ(`${t[2]} ${n} ${t[3]}?`, ans, [t[0] * n, ans + t[0], (t[0] + 1) * n], `The increase is always ${t[0]} → rule ${t[0]}n + ${t[1]} → ${t[0]} × ${n} + ${t[1]} = ${ans}.`); };

E.succPct = () => { const k = R(0, 2); if (k === 0) { let d1, d2; do { d1 = pick([10, 20, 25, 50]); d2 = pick([10, 20, 25, 50]); } while ((100 - d1) * d2 % 100); const a1 = 100 - d1, cut = a1 * d2 / 100, fin = a1 - cut, eq = 100 - fin; const q = txtQ(`A ${d1}% discount followed by an extra ${d2}% discount equals a single discount of:`, eq + "%", [(d1 + d2) + "%", (eq + 5) + "%", Math.abs(d1 - d2 + 5) + "%", (d1 + d2 + 5) + "%"].filter(x => x !== eq + "%"), ""); q.s = ["No amount is given → assume the price is 100 riyals and apply the two discounts in order:", `${d1}% off 100 → ${a1}, then ${d2}% off ${a1} (${cut}) → ${fin}.`, `The price fell from 100 to ${fin} → the total discount is ${eq}% (not ${d1 + d2}%).`]; return q; } const P = 100 * R(2, 8); if (k === 1) { let d1, d2; do { d1 = pick([10, 20, 25, 50]); d2 = pick([10, 20, 25]); } while ((P - P * d1 / 100) * d2 % 100); const c1 = P * d1 / 100, a1 = P - c1, c2 = a1 * d2 / 100, ans = a1 - c2; const q = numQ(`An item costs ${P} riyals with a ${d1}% discount and then an extra ${d2}% discount. What is the final price?`, ans, [P * (100 - d1 - d2) / 100, a1, P - c2], ""); q.s = [`First discount: ${d1}% of ${P} = ${c1} → ${P} − ${c1} = ${a1}.`, `Second discount on the new price: ${d2}% of ${a1} = ${c2} → ${a1} − ${c2} = ${ans} riyals.`]; return q; } let up, dn; do { up = pick([10, 20, 25, 50]); dn = pick([10, 20, 25]); } while ((P + P * up / 100) * dn % 100); const u = P * up / 100, a1 = P + u, c = a1 * dn / 100, ans = a1 - c; const q = numQ(`An item costs ${P} riyals. Its price rises ${up}% and then falls ${dn}%. What is the price now?`, ans, [P * (100 + up - dn) / 100, P, a1], ""); q.s = [`Increase: ${up}% of ${P} = ${u} → ${P} + ${u} = ${a1}.`, `Discount on the new price: ${dn}% of ${a1} = ${c} → ${a1} − ${c} = ${ans} riyals.`]; return q; };

E.cal3 = () => { const t = R(0, 2); if (t === 0) return E.days(3); if (t === 1) { const loss = pick([5, 10, 15, 20]), h = R(2, 6), s = R(6, 9); const shown = s * 60 + h * (60 - loss); const ans = fmtT(Math.floor(shown / 60), shown % 60); return txtQ(`A clock loses ${loss} minutes every hour. It was set to ${s}:00 a.m. What does it show after ${h} real hours?`, ans, [fmtT(s + h, 0), fmtT(Math.floor((shown - loss) / 60), (shown - loss) % 60), fmtT(Math.floor((shown + 2 * loss) / 60), (shown + 2 * loss) % 60), fmtT(Math.floor((shown + loss) / 60), (shown + loss) % 60)], `It loses ${h} × ${loss} = ${h * loss} minutes → ${ans}.`); } const d = R(1, 5), h = R(6, 12), ahead = R(0, 1); const res = ahead ? h + d : h - d; const fmt = x => fmtT(((x - 1 + 24) % 12) + 1, 0); return txtQ(`A city is ${d} hours ${ahead ? 'ahead of' : 'behind'} Makkah. If it is ${h}:00 in Makkah, what time is it in that city?`, fmt(res), [fmt(ahead ? h - d : h + d), fmt(res + 1), fmt(h), fmt(res - 1)], `${ahead ? 'Add' : 'Subtract'} ${d} hours → ${fmt(res)}.`); };

<script>/* ================== backend (Firebase Auth + Firestore, compat SDK) ================== */
const FB_CFG = {

const ADMIN_USER = "ragab";
const ADMIN_EMAIL = "ragab@admin.booktests.app";
const STU_DOMAIN = "students.booktests.app";
const CODE_RE = /^[a-z0-9_.-]{3,30}$/;
const normCode = id => String(id || "").trim().toLowerCase();
const emailFor = id => normCode(id) === ADMIN_USER ? ADMIN_EMAIL : `${normCode(id)}@${STU_DOMAIN}`;
class AppError extends Error { constructor(code, msg) { super(msg || code); this.code = code; } }

const FirebaseBackend = {
  init(onUser) {
    firebase.initializeApp(FB_CFG);
    this.auth = firebase.auth(); this.db = firebase.firestore();
    this.auth.onAuthStateChanged(u => onUser(u ? { uid: u.uid, email: u.email } : null));
  },
  sec() {
    if (!this._sec) { this._sec = firebase.initializeApp(FB_CFG, "secondary"); this._sec.auth().setPersistence(firebase.auth.Auth.Persistence.NONE); }
    return this._sec.auth();
  },
  async login(id, pw) {
    const code = normCode(id), email = emailFor(code);
    if (code !== ADMIN_USER && !CODE_RE.test(code)) throw new AppError("badcode");
    try { await this.auth.signInWithEmailAndPassword(email, pw); }
    catch (e) {
      const notFound = ["auth/user-not-found", "auth/invalid-credential", "auth/invalid-login-credentials"].includes(e.code);
      if (code === ADMIN_USER && notFound) {
        try { await this.auth.createUserWithEmailAndPassword(email, pw); return; }   // first admin login creates the admin account
        catch (e2) { if (e2.code === "auth/email-already-in-use") throw new AppError("badlogin"); throw new AppError(e2.code || "net"); }
      }
      if (notFound || e.code === "auth/wrong-password") throw new AppError("badlogin");
      if (e.code === "auth/too-many-requests") throw new AppError("toomany");
      if (e.code === "auth/operation-not-allowed") throw new AppError("setup");
      throw new AppError(e.code || "net");
    }
  },
  logout() { return this.auth.signOut(); },
  async profile(u) {
    if (u.email === ADMIN_EMAIL) return { uid: u.uid, role: "admin", code: ADMIN_USER, name: "أ. محمد رجب", levels: [1, 2, 3], active: true, progress: {} };
    const snap = await this.db.collection("users").doc(u.uid).get();
    if (!snap.exists) throw new AppError("noaccount");
    const d = snap.data(); if (d.active === false) throw new AppError("disabled");
    this.db.collection("users").doc(u.uid).update({ lastSeen: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => { });
    return Object.assign({ uid: u.uid, role: "student", progress: {} }, d);
  },

<script>/* ================== on-screen pen (scratch work during practice; nothing is saved) ================== */
const Pen = (() => {
  let on = false, cv = null, ctx = null, wrap = null, btn = null, colors = null, color = "#2563eb", drawing = false, last = null, key = null, getState = null;
  const PEN_SVG = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>`;
  const X_SVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>`;
  const words = () => document.documentElement.lang === "en" ? { pen: "Pen", off: "Cancel pen", tip: "Write on the screen" } : { pen: "القلم", off: "إلغاء القلم", tip: "اكتب على الشاشة" };
  function css() {
    const s = document.createElement("style");
    s.textContent = `
#penCanvas{position:absolute;top:0;left:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
#penCanvas.on{display:block}
#penWrap{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:16px;z-index:60;display:flex;align-items:center;gap:8px;flex-direction:row-reverse}

#penColors button[aria-pressed="true"]{box-shadow:0 0 0 2px #111827}
@media print{#penCanvas,#penWrap{display:none!important}}`;
    document.head.appendChild(s);
  }
  function mount() {
    css();
    cv = document.createElement("canvas"); cv.id = "penCanvas"; document.body.appendChild(cv); ctx = cv.getContext("2d");
    wrap = document.createElement("div"); wrap.id = "penWrap"; wrap.hidden = true;
    wrap.innerHTML = `<button type="button" id="penBtn"></button><div id="penColors">${["#2563eb", "#dc2626", "#16a34a", "#111827"].map(c => `<button type="button" data-c="${c}" style="background:${c}" aria-pressed="${c === color}" aria-label="${c}"></button>`).join("")}</div>`;
    document.body.appendChild(wrap);
    btn = wrap.querySelector("#penBtn"); colors = wrap.querySelector("#penColors");
    btn.onclick = () => on ? stop() : start();
    colors.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { color = b.dataset.c; colors.querySelectorAll("[data-c]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    const pos = e => [e.pageX, e.pageY];
    cv.addEventListener("pointerdown", e => { if (!on) return; drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); dot(last); e.preventDefault(); });
    cv.addEventListener("pointermove", e => { if (!drawing) return; const p = pos(e); line(last, p); last = p; e.preventDefault(); });
    const end = () => { drawing = false; last = null; };
    cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
    window.addEventListener("resize", () => { if (on) size(true); });
    label();
  }
  function label() { const w = words(); btn.innerHTML = on ? `${X_SVG}<span>${w.off}</span>` : `${PEN_SVG}<span>${w.pen}</span>`; btn.title = on ? w.off : w.tip; btn.setAttribute("aria-pressed", on); btn.classList.toggle("on", on); colors.classList.toggle("on", on); }
  function size(keep) {
    const d = document.documentElement, W = Math.max(d.scrollWidth, window.innerWidth), H = Math.max(d.scrollHeight, document.body.scrollHeight, window.innerHeight), r = window.devicePixelRatio || 1;
    let old = null; if (keep && cv.width) { old = document.createElement("canvas"); old.width = cv.width; old.height = cv.height; old.getContext("2d").drawImage(cv, 0, 0); }
    cv.width = W * r; cv.height = H * r; cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(r, 0, 0, r, 0, 0); ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (old) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(old, 0, 0); ctx.restore(); }
  }
  function dot(p) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(p[0], p[1], 1.6, 0, Math.PI * 2); ctx.fill(); }
  function line(a, b) { ctx.strokeStyle = color; ctx.lineWidth = 3.2; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }

  function start() { on = true; size(false); cv.classList.add("on"); label(); }

  function update() {

  }

    init(fn, target) { getState = fn; mount(); const el = target || document.body; new MutationObserver(() => update()).observe(el, { childList: true, subtree: false }); update(); },
    update, stop
  };
})();

function reportHTML(stu, prog, atts) {

  const last = atts.length ? fmtDate(Math.max(...atts.map(a => a.atMs || 0))) : t("never");
  const done = all.filter(I => prog[I.id] != null).sort((a, b) => prog[b.id] - prog[a.id]);

  <div class="kpis"><div><b>${S.done}<small>/${S.n}</small></b><span>${t("kIdeas")}</span></div><div><b>${pc(S.avg)}</b><span>${t("kAvg")}</span></div><div><b>${S.mastered}</b><span>${t("kMastered")}</span></div><div><b>${atts.length}</b><span>${t("kTests")}</span></div><div><b>${t("hrs", hh, mm)}</b><span>${t("kTime")}</span></div><div><b class="sm">${last}</b><span>${t("kLast")}</span></div></div>

  }

  $$("[data-act]").forEach(b => b.onclick = async () => { const s = ADM.students.find(x => x.uid === b.dataset.act); const v = s.active === false; try { await BE.updateStudent(s.uid, { active: v }); s.active = v; flash(t("updated")); } catch (er) { flash(errText(er), true); } });
  $$("[data-file]").forEach(b => b.onclick = () => { ADM.rep = false; ADM.file = b.dataset.file; go("admin", null, true); });
  $$("[data-pw]").forEach(b => b.onclick = () => { ADM.pwFor = b.dataset.pw; ADM.pwShow = ""; ADM.pwDraft = genPassword(); ADM.delFor = null; go("admin", null, true); });
  $$("[data-del]").forEach(b => b.onclick = () => { ADM.delFor = b.dataset.del; ADM.pwFor = null; go("admin", null, true); });
  on("cancelPw", "onclick", () => { ADM.pwFor = null; go("admin", null, true); });
  on("genPw2", "onclick", () => { $("#newPw").value = genPassword(); });
  on("showPw", "onclick", async () => { try { const s = await BE.getSecret(ADM.pwFor); ADM.pwShow = s ? s.password : "—"; ADM.pwDraft = $("#newPw").value; go("admin", null, true); } catch (er) { flash(errText(er), true); } });
  on("savePw", "onclick", async () => { const s = ADM.students.find(x => x.uid === ADM.pwFor); try { await BE.setPassword(s.uid, s.code, $("#newPw").value.trim()); ADM.pwFor = null; flash(t("pwChanged")); } catch (er) { flash(errText(er), true); } });
  on("noDel", "onclick", () => { ADM.delFor = null; go("admin", null, true); });
  on("yesDel", "onclick", async () => { const s = ADM.students.find(x => x.uid === ADM.delFor); try { await BE.deleteStudent(s.uid, s.code); ADM.delFor = null; await loadAdmin(); flash(t("deleted")); } catch (er) { flash(errText(er), true); } });
  $$("[data-stu]").forEach(b => b.onclick = () => { ADM.rep = false; ADM.file = b.dataset.stu; go("admin", null, true); });
};

/* ---------- boot ---------- */
applyLang(); renderTop(); renderFooter();
$("#app").innerHTML = `<p class="empty">${t("loading")}</p>`;
try { Pen.init(() => ({ visible: !!USER && (VIEW === "practice" || VIEW === "exam"), key: VIEW + "-" + (RUN ? RUN.i : "") }), $("#app")); } catch (e) { }
try { BE.init(onAuth); } catch (e) { $("#app").innerHTML = `<p class="empty">${esc(t("errors").net)}</p>`; }
</script>

</body>
</html>
