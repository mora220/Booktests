, "720"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "ما العدد التالي؟ <span class=\"ns\"><b>1</b><b>2</b><b>6</b><b>15</b><b>31</b><b>؟</b></span>", "o": ["47", "52", "56", "63"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "ما الحرف التالي؟ <span class=\"ns\"><b>ب</b><b>ث</b><b>ح</b><b>د</b><b>؟</b></span>", "o": ["ذ", "ر", "ز", "س"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L3-41", "n": 41, "t": "الترتيب المعقّد والمقارنات", "concept": "معطيات كثيرة عن مراكز سباق أو أعمار بالأشهر أو أوزان أشكال، والمطلوب الأول أو الأخير أو موقع شخص بعينه.", "fast": ["المطلوب الأول/الأكبر/الأثقل (أو الأخير/الأصغر/الأخف): استبعد كل من تخبرك معلومة أن غيره يسبقه أو يتفوّق عليه، والباقي هو الإجابة.", "المطلوب الثاني أو الثالث أو موقع شخص: ارسم خانات مرقّمة أو أسهماً، وضع أولاً المعلومة المطلقة (الأخير، الثالث)، والمعلومات المزدوجة («قبله مباشرة») قطعة واحدة.", "في الأعمار: المولود أولاً هو الأكبر سناً. وفي الأوزان: حوّل كل شيء إلى رموز (> و =)."], "trap": null, "table": null, "new": false, "ex": {"q": "خمسة متسابقين: نايف في المركز الأخير، وجاء خالد قبل سعيد مباشرة، وماجد ليس الأول ولا الثاني، وفيصل قبل خالد. مَن الأول؟", "o": ["خالد", "فيصل", "سعيد", "ماجد"], "a": 1, "f": "", "s": ["المطلوب الأول ← استبعاد: نايف ✗ (الأخير)، سعيد ✗ (بعد خالد)، خالد ✗ (بعد فيصل)، ماجد ✗ (ليس الأول) ← يبقى فيصل ✓.", "ولو سُئلنا عن الثالث نرسم الخانات بالأسهم: فيصل ← خالد ← سعيد ← ماجد ← نايف ← الثالث سعيد."], "c": 4}, "pr": [{"q": "وُلد أحمد في رمضان، ووُلد خالد بعده بـ 4 أشهر، ووُلد فهد قبل أحمد بشهرين، ووُلد مازن بعد خالد بشهر. مَن الأكبر سناً؟", "o": ["أحمد", "خالد", "فهد", "مازن"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "<span class=\"sym\" style=\"color:#be123c\">●</span> أثقل من <span class=\"sym\" style=\"color:#1d4ed8\">■</span> ، و <span class=\"sym\" style=\"color:#0f766e\">▲</span> يزن مثل <span class=\"sym\" style=\"color:#be123c\">●</span><span class=\"sym\" style=\"color:#be123c\">●</span> ، و <span class=\"sym\" style=\"color:#1d4ed8\">■</span> أثقل من <span class=\"sym\" style=\"color:#d97706\">★</span>. أي الأشكال أخفّ؟", "o": ["<span class=\"sym\" style=\"color:#be123c\">●</span>", "<span class=\"sym\" style=\"color:#1d4ed8\">■</span>", "<span class=\"sym\" style=\"color:#0f766e\">▲</span>", "<span class=\"sym\" style=\"color:#d97706\">★</span>"], "a": 3, "f": "", "s": [], "c": 4}]}, {"id": "L3-42", "n": 42, "t": "الشروط والرقم السري", "concept": "اختيار مجموعة وفق شروط (إذا… فإن…)، أو رقم سري بمعطيات صحيح/خطأ.", "fast": ["الأسرع: خذ كل خيار وافحصه على الشروط واحداً واحداً، وأول مخالفة تكفي لاستبعاده.", "«(ج) لا يُختار إلا مع (د)» تعني: إن ظهر ج وحده فالخيار خطأ.", "في الرقم السري: ابدأ بالمعطى «لا يوجد رقم صحيح» واشطب أرقامه."], "trap": null, "table": null, "new": false, "ex": {"q": "يختار مدرب 3 لاعبين من (أ، ب، ج، د، هـ) بالشروط: إذا اختير (أ) فلا يُختار (ب)، و(ج) لا يلعب إلا مع (د)، و(هـ) يُختار دائماً. أي اختيار صحيح؟", "o": ["أ ، ب ، هـ", "ج ، د ، هـ", "أ ، ج ، هـ", "ب ، ج ، هـ"], "a": 1, "f": "", "s": ["(أ) خطأ: أ مع ب. (ج) و(د) خطأ: ج بدون د. يبقى (ب): ج ، د ، هـ ✓."], "c": 4}, "pr": [{"q": "رقم سري من 3 أرقام:<ul class=\"clues\"><li><span class=\"code\"><b>4</b><b>7</b><b>9</b></span> رقمان صحيحان وفي مكانهما.</li><li><span class=\"code\"><b>9</b><b>1</b><b>6</b></span> رقم صحيح لكن في غير مكانه.</li><li><span class=\"code\"><b>3</b><b>5</b><b>7</b></span> رقم صحيح لكن في غير مكانه.</li><li><span class=\"code\"><b>8</b><b>2</b><b>0</b></span> لا يوجد أي رقم صحيح.</li></ul>ما الرقم السري؟", "o": ["<span class=\"code\"><b>4</b><b>1</b><b>7</b></span>", "<span class=\"code\"><b>4</b><b>7</b><b>9</b></span>", "<span class=\"code\"><b>4</b><b>7</b><b>1</b></span>", "<span class=\"code\"><b>1</b><b>7</b><b>4</b></span>"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "يلبس سامي أحذيته بالترتيب يومياً: أحمر، أزرق، أخضر، أصفر، ثم يكرر. ما لون حذائه في اليوم الثلاثين؟", "o": ["أحمر", "أزرق", "أخضر", "أصفر"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L3-43", "n": 43, "t": "العدّ المنظّم والمسارات", "concept": "عدد الطرق في شبكة، أو عدد المثلثات في شكل مركّب.", "fast": ["مسارات شبكة (يميناً وأعلى فقط): اكتب 1 على الحافتين، وكل نقطة = مجموع النقطتين قبلها.", "مثلث فيه خطوط من الرأس تقسم القاعدة إلى ن أجزاء: مثلثات المستوى الواحد = 1 + 2 + … + ن.", "كل خط أفقي يقطع الخطوط يضيف مستوى جديداً بالعدد نفسه من المثلثات."], "trap": null, "table": null, "new": false, "ex": {"q": "بكم طريقة يمكن الوصول من البداية إلى النهاية بالتحرك يميناً أو لأعلى فقط على خطوط الشبكة؟", "o": ["4", "5", "6", "8"], "a": 2, "f": "<svg class=\"fig\" viewBox=\"0 0 116 122\" width=\"116\" height=\"122\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"18\" y1=\"18\" x2=\"18\" y2=\"98\" stroke=\"#312e81\" stroke-width=\"2\"/><line x1=\"58\" y1=\"18\" x2=\"58\" y2=\"98\" stroke=\"#312e81\" stroke-width=\"2\"/><line x1=\"98\" y1=\"18\" x2=\"98\" y2=\"98\" stroke=\"#312e81\" stroke-width=\"2\"/><line x1=\"18\" y1=\"18\" x2=\"98\" y2=\"18\" stroke=\"#312e81\" stroke-width=\"2\"/><line x1=\"18\" y1=\"58\" x2=\"98\" y2=\"58\" stroke=\"#312e81\" stroke-width=\"2\"/><line x1=\"18\" y1=\"98\" x2=\"98\" y2=\"98\" stroke=\"#312e81\" stroke-width=\"2\"/><circle cx=\"18\" cy=\"98\" r=\"7\" fill=\"#16a34a\"/><text x=\"18\" y=\"111\" font-size=\"9\" fill=\"#16a34a\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Cairo, DejaVu Sans\">البداية</text><circle cx=\"98\" cy=\"18\" r=\"7\" fill=\"#be123c\"/><text x=\"98\" y=\"7\" font-size=\"9\" fill=\"#be123c\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Cairo, DejaVu Sans\">النهاية</text></svg>", "s": ["بجمع الطرق عند كل نقطة: 1، 1، 1 ثم 2، 3 ثم 3، 6 ← 6 طرق."], "c": 4}, "pr": [{"q": "في شبكة من 3 مربعات أفقياً ومربعين رأسياً، كم طريقاً من الركن السفلي الأيسر إلى العلوي الأيمن (يميناً ولأعلى فقط)؟", "o": ["6", "8", "10", "12"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "كم مثلثاً في الشكل؟", "o": ["10", "16", "20", "24"], "a": 2, "f": "<svg class=\"fig\" viewBox=\"0 0 200 128\" width=\"200\" height=\"128\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"100,8 10,120 190,120\" fill=\"#fff\" stroke=\"#4338ca\" stroke-width=\"2.5\"/><line x1=\"100\" y1=\"8\" x2=\"55\" y2=\"120\" stroke=\"#4338ca\" stroke-width=\"2\"/><line x1=\"100\" y1=\"8\" x2=\"100\" y2=\"120\" stroke=\"#4338ca\" stroke-width=\"2\"/><line x1=\"100\" y1=\"8\" x2=\"145\" y2=\"120\" stroke=\"#4338ca\" stroke-width=\"2\"/><line x1=\"55\" y1=\"64\" x2=\"145\" y2=\"64\" stroke=\"#4338ca\" stroke-width=\"2\"/></svg>", "s": [], "c": 4}]}, {"id": "L3-44", "n": 44, "t": "مبدأ العدّ والاحتمال", "concept": "كم طريقة للاختيار أو الترتيب؟ وما احتمال حدث بسيط؟", "fast": ["مبدأ الضرب: عدد الطرق = طرق الخطوة الأولى × طرق الثانية × …", "ترتيب ن أشياء مختلفة = ن × (ن − 1) × … × 1.", "الاحتمال = عدد الحالات المطلوبة ÷ عدد كل الحالات."], "trap": null, "table": null, "new": false, "ex": {"q": "كم عدداً مكوّناً من 3 أرقام مختلفة يمكن تكوينه من الأرقام 1 ، 2 ، 3 ، 4 ؟", "o": ["12", "24", "48", "64"], "a": 1, "f": "", "s": ["الآحاد 4 خيارات، العشرات 3، المئات 2 ← 4 × 3 × 2 = 24."], "c": 4}, "pr": [{"q": "لدى خالد 4 قمصان و 3 بناطيل. كم طقماً مختلفاً يمكنه تكوينه؟", "o": ["7", "12", "16", "24"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "كيس فيه 3 كرات حمراء و 5 زرقاء. ما احتمال سحب كرة حمراء؟", "o": ["<span class=\"fr\"><span>3</span><span>5</span></span>", "<span class=\"fr\"><span>3</span><span>8</span></span>", "<span class=\"fr\"><span>5</span><span>8</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>"], "a": 1, "f": "", "s": [], "c": 4}]}]}]}, "en": {"1": [{"key": "a", "title": "Verbal &amp; Linguistic Reasoning", "color": "#c2410c", "sub": "Word analogies • Boxes and chains • Anagrams • Unrealistic premises • Classification • Sentence completion • Reading • Word riddles", "ideas": [{"id": "L1-1", "n": 1, "t": "Word Analogies (Pairs)", "concept": "Two words have a relationship; find two words with the same relationship, in the same order.", "fast": ["Make a short sentence that links the two words: (A cub is a young lion).", "Put each option into the same sentence; the one that fits is the answer.", "Watch the order: (neigh : horse) is not the same as (horse : neigh)."], "trap": null, "table": [["Young animal", "foal : horse"], ["Animal sound", "roar : lion"], ["Animal home", "den : lion"], ["Female animal", "lioness : lion"], ["Tool & job", "saw : carpenter"], ["Part of whole", "tyre : car"], ["Opposites", "night : day"], ["Same meaning", "happy : glad"], ["Material & object", "wood : door"], ["Place & activity", "library : reading"], ["Body part & use", "eye : seeing"], ["Vehicle & route", "plane : sky"]], "new": false, "ex": {"q": "cub : lion", "o": ["nest : bird", "puppy : dog", "roar : lion", "forest : tiger"], "a": 1, "f": "", "s": ["Sentence: “a cub is a young lion” → “a puppy is a young dog”."], "c": 4}, "pr": [{"q": "scalpel : surgeon", "o": ["saw : carpenter", "pen : paper", "doctor : hospital", "kitchen : chef"], "a": 0, "f": "", "s": [], "c": 4}, {"q": "hot : cold", "o": ["big : huge", "sweet : sugar", "tall : short", "day : sun"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "neigh : horse", "o": ["cat : meow", "bark : dog", "nest : bird", "puppy : dog"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L1-2", "n": 2, "t": "Box Analogies", "concept": "Four boxes: two words on the left have a relationship, and the third word needs a word with the same relationship.", "fast": ["Read the first two boxes and write the relationship in a few words: (is opened by, lives in, capital of).", "Apply the same relationship to the third box.", "Eliminate options linked to the word in a different way."], "trap": null, "table": null, "new": false, "ex": {"q": "Choose the word for (?):<table class=\"abox\"><tr><td>lock</td><td>key</td><td class=\"sep\">:</td><td>question</td><td class=\"q\">?</td></tr></table>", "o": ["paper", "teacher", "answer", "test"], "a": 2, "f": "", "s": ["A lock needs a key to open it, and a question needs an answer."], "c": 4}, "pr": [{"q": "Choose the word for (?):<table class=\"abox\"><tr><td>bee</td><td>hive</td><td class=\"sep\">:</td><td>bird</td><td class=\"q\">?</td></tr></table>", "o": ["feather", "branch", "nest", "egg"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "Choose the word for (?):<table class=\"abox\"><tr><td>school</td><td>classroom</td><td class=\"sep\">:</td><td>hand</td><td class=\"q\">?</td></tr></table>", "o": ["finger", "leg", "watch", "glove"], "a": 0, "f": "", "s": [], "c": 4}, {"q": "Choose the word for (?):<table class=\"abox\"><tr><td>Saudi Arabia</td><td>Riyadh</td><td class=\"sep\">:</td><td>Egypt</td><td class=\"q\">?</td></tr></table>", "o": ["Nile", "Alexandria", "Dubai", "Cairo"], "a": 3, "f": "", "s": [], "c": 4}]}, {"id": "L1-3", "n": 3, "t": "Word Chains", "concept": "Three words linked together, then three more words with the same link and one missing.", "fast": ["Ask: how is the first word linked to the second? And the second to the third?", "Write the link: (animal – its young – its sound) or (stage – stage – stage).", "Apply the link in the same order to the second chain."], "trap": null, "table": null, "new": false, "ex": {"q": "lion – cub – roar &nbsp;, &nbsp; horse – foal – ......", "o": ["bark", "neigh", "bray", "moo"], "a": 1, "f": "", "s": ["Link: animal – its young – its sound → a horse neighs."], "c": 4}, "pr": [{"q": "egg – chick – hen &nbsp;, &nbsp; caterpillar – cocoon – ......", "o": ["bee", "butterfly", "worm", "spider"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "grasshopper – frog – snake &nbsp;, &nbsp; grass – rabbit – ......", "o": ["donkey", "fox", "giraffe", "cow"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L1-4", "n": 4, "t": "Anagrams (Rearranging Letters)", "concept": "Words made of the same letters in a different order, such as: stop – pots – tops.", "fast": ["Number the letters of the first word: 1 2 3 4.", "Write the order of the numbers in the second and third words.", "Apply the same order to the new word, or check which option uses exactly the same letters."], "trap": null, "table": null, "new": true, "ex": {"q": "stop – pots – tops &nbsp;, &nbsp; ear – are – ......", "o": ["era", "rat", "eat", "air"], "a": 0, "f": "", "s": ["Each word in the chain uses exactly the same letters.", "e, a, r rearranged → “era” (the others use different letters)."], "c": 4}, "pr": [{"q": "Which word uses exactly the same letters as “LISTEN”?", "o": ["SILENT", "LISTED", "TINSELS", "STOLEN"], "a": 0, "f": "", "s": [], "c": 4}, {"q": "Rearrange the letters of “ACT” to make an animal:", "o": ["CAT", "BAT", "RAT", "ANT"], "a": 0, "f": "", "s": [], "c": 4}]}, {"id": "L1-5", "n": 5, "t": "Unrealistic Premises", "concept": "A sentence starts with an underlined premise that is not true in real life; find the correct result inside “the world of the question”.", "fast": ["Believe the premise as if it were true, and forget real life.", "Whatever belonged to the first word now belongs to the new word.", "The option that is true in real life is usually the trap."], "trap": null, "table": null, "new": false, "ex": {"q": "If <u>a cow were a bird</u> and a cat meowed, then the cow ......", "o": ["flies with two wings", "gives milk", "eats grass", "has four legs"], "a": 0, "f": "", "s": ["In the world of the question the cow is a bird, and birds fly. The other options are real facts about cows (the trap)."], "c": 2}, "pr": [{"q": "If <u>pens were eaten</u> and we wrote with apples, then a student writes the lesson with ......", "o": ["a pen", "an eraser", "an apple", "a notebook"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "If <u>the tortoise were the fastest animal</u>, then in a race it would beat ......", "o": ["no one", "the rabbit", "the tortoise", "the water"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L1-6", "n": 6, "t": "Classification (Odd One Out and Same Group)", "concept": "Four words, three from one group and one different; or a word and you must find one like it.", "fast": ["Ask: what joins three of the words? (fruits, birds, school things…).", "The word that doesn’t fit the group is the odd one out.", "If two words seem different, look for a more precise link."], "trap": null, "table": null, "new": false, "ex": {"q": "Choose the odd word out:", "o": ["apple", "banana", "cucumber", "orange"], "a": 2, "f": "", "s": ["Apple, banana and orange are fruits; cucumber is a vegetable."], "c": 4}, "pr": [{"q": "<b>train</b> — choose the two words from the same group:", "o": ["ship – plane", "bus – car", "horse – camel", "road – bridge"], "a": 1, "f": "", "s": [], "c": 2}, {"q": "Choose the odd word out:", "o": ["cat", "dog", "hen", "cow"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L1-7", "n": 7, "t": "Sentence Completion and Word Meaning", "concept": "A sentence with a blank, or a strange word whose meaning comes from the words around it.", "fast": ["Read the whole sentence and guess the word before reading the options.", "Strange word: look at what is around it; if it is listed with fruits, it is a fruit.", "“and” means agreement, “but” means the opposite."], "trap": null, "table": null, "new": false, "ex": {"q": "Sara went to the market and bought apples, bananas, grapes and “borkels”. Borkels are a kind of ......", "o": ["animal", "vegetable", "fruit", "clothing"], "a": 2, "f": "", "s": ["“Borkels” are listed with apples, bananas and grapes, so they are a fruit."], "c": 4}, "pr": [{"q": "A library is for reading as a playground is for ......", "o": ["sleeping", "playing", "eating", "writing"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "The sun ...... in the day, and the moon appears at ......", "o": ["sets – morning", "shines – night", "sleeps – noon", "rains – afternoon"], "a": 1, "f": "", "s": [], "c": 2}]}, {"id": "L1-8", "n": 8, "t": "Reading Comprehension and Lessons", "concept": "A short text or saying, with a question about its meaning, a reason, or the lesson learned.", "fast": ["Read the question first, then look for its answer in the text.", "The answer comes from the text, not from what you already know.", "For a saying: say it in your own simple words, then match it with the options."], "trap": null, "table": null, "new": false, "ex": {"q": "“Whoever works hard will succeed, and whoever plants will harvest.” The lesson is:", "o": ["Success comes from work and effort", "Farming is more important than studying", "Harvest is in summer", "Hard work is useless"], "a": 0, "f": "", "s": ["Whoever works and tries gets the result of his work."], "c": 2}, "pr": [{"q": "<div class=\"passage\">The camel is a patient animal. It walks for many days in the desert without drinking and carries people and their luggage, so it is called “the ship of the desert”.</div>Why is the camel called the ship of the desert?", "o": ["Because it swims in the sea", "Because it carries people and crosses the desert patiently", "Because it is big", "Because it loves water"], "a": 1, "f": "", "s": [], "c": 2}, {"q": "Ahmed went out in the morning wearing a wool coat and gloves. The most likely reason:", "o": ["It is hot", "It is cold", "He has a PE lesson", "He is going to the beach"], "a": 1, "f": "", "s": [], "c": 2}]}, {"id": "L1-9", "n": 9, "t": "Word and Name Riddles", "concept": "A riddle describes a word or a name by its letters or features; you have to find it.", "fast": ["Write each condition on its own line: (starts with…, ends with…, its feature…).", "Check each option against the conditions one by one.", "The option that meets every condition is the answer."], "trap": null, "table": null, "new": true, "ex": {"q": "The father’s name is “Sam”. His son’s name starts with the letter that ends his father’s name and ends with the letter that starts it. What is the son’s name?", "o": ["Mark", "Miles", "Max", "Adam"], "a": 1, "f": "", "s": ["“Sam” ends with M and starts with S → the son starts with M and ends with S → Miles."], "c": 4}, "pr": [{"q": "I have teeth but I don’t bite, and people use me every morning. What am I?", "o": ["scissors", "a comb", "a key", "a chair"], "a": 1, "f": "", "s": [], "c": 4}]}]}, {"key": "b", "title": "Mathematical &amp; Spatial Reasoning", "color": "#0369a1", "sub": "Smart adding • Double & half • Place in a line • Days & clocks • Money • Perimeter • Counting • Dice • Balances • Patterns", "ideas": [{"id": "L1-10", "n": 10, "t": "Smart Adding and Subtracting", "concept": "A long expression of additions and subtractions; arranging the numbers cleverly makes it very easy.", "fast": ["Add numbers that make ten or a hundred together: (8 + 2), (25 + 75).", "Add all the plus numbers together and all the minus numbers together, then subtract.", "99 = 100 − 1: add 100 then take away 1."], "trap": null, "table": null, "new": false, "ex": {"q": "What is 12 + 8 − 5 + 15 − 10?", "o": ["18", "20", "25", "30"], "a": 1, "f": "", "s": ["(12 + 8) = 20, (15 − 5 − 10) = 0 → the answer is 20."], "c": 4}, "pr": [{"q": "What is 25 + 17 + 75 + 3?", "o": ["110", "115", "120", "125"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "What is 99 + 99 + 99?", "o": ["279", "297", "299", "300"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L1-11", "n": 11, "t": "Double, Half and Parts", "concept": "One person has double (or half) what another has, and we know the total.", "fast": ["Draw boxes: double = two boxes, the other = one box.", "Divide the total by the number of boxes to find one box.", "“Has 4 more”: take 4 away from the total, then divide by 2."], "trap": null, "table": null, "new": false, "ex": {"q": "Ali has twice as many balls as Fahd, and together they have 24 balls. How many balls does Fahd have?", "o": ["6", "8", "12", "16"], "a": 1, "f": "", "s": ["Ali 2 boxes + Fahd 1 box = 3 boxes → 24 ÷ 3 = 8 balls for Fahd."], "c": 4}, "pr": [{"q": "Reem has half as many pencils as Salma, and Salma has 20 pencils. How many pencils do they have together?", "o": ["10", "20", "30", "40"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "A basket has apples and oranges. There are 4 more apples than oranges, and 20 fruits in total. How many apples?", "o": ["8", "12", "10", "16"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L1-12", "n": 12, "t": "Simple Proportion", "concept": "We know the price of some things (or what is done in some time) and need it for a different number.", "fast": ["Find the value of one first: (12 ÷ 3 = 4 riyals per pen).", "Multiply by the number you need.", "Buses and boxes: if some are left over, add one whole bus."], "trap": "There is no “half a bus”; the students left over need a whole bus.", "table": null, "new": false, "ex": {"q": "3 pens cost 12 riyals. How much do 5 pens cost?", "o": ["15", "18", "20", "24"], "a": 2, "f": "", "s": ["One pen = 12 ÷ 3 = 4 riyals → 5 × 4 = 20 riyals."], "c": 4}, "pr": [{"q": "Saad reads 10 pages in 20 minutes. How many pages does he read in one hour?", "o": ["20", "30", "40", "60"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "A bus holds 20 students. How many buses are needed for 70 students?", "o": ["3", "3.5", "4", "5"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L1-13", "n": 13, "t": "Place in a Line", "concept": "A student’s place counted from the front and from the back; how many students are there altogether?", "fast": ["Number of students = place from the front + place from the back − 1.", "Why subtract 1? Because the student was counted twice.", "Draw small circles if you want to check."], "trap": null, "table": null, "new": true, "ex": {"q": "Mohammed is 4th from the front and 6th from the back of the class line. How many students are in the line?", "o": ["9", "10", "11", "8"], "a": 0, "f": "", "s": ["4 + 6 − 1 = 9 students."], "c": 4}, "pr": [{"q": "In a queue, Khalid is 5th from the front and 5th from the back. How many people are in the queue?", "o": ["8", "9", "10", "11"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "Ahmed is 3rd from the front. Saad stands directly behind him and is 10th from the back. How many students are in the line?", "o": ["13", "12", "14", "15"], "a": 0, "f": "", "s": [], "c": 4}]}, {"id": "L1-14", "n": 14, "t": "Counting Between Things", "concept": "How many houses between two houses? How many pages from one page to another? How many trees along a road?", "fast": ["“Between” two numbers = difference − 1 (don’t count the ends).", "“From… to…” = difference + 1 (count both ends).", "Trees along a road from start to end = (length ÷ gap) + 1."], "trap": null, "table": null, "new": false, "ex": {"q": "Ahmed lives in house number 2 and Khalid in house number 7. How many houses are between them?", "o": ["3", "4", "5", "6"], "a": 1, "f": "", "s": ["7 − 2 − 1 = 4 houses (3, 4, 5 and 6)."], "c": 4}, "pr": [{"q": "A road is 20 m long. A tree is planted every 5 m on one side, from the start to the end. How many trees?", "o": ["4", "5", "6", "20"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "Majed read from page 10 to page 20. How many pages did he read?", "o": ["10", "9", "11", "12"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L1-15", "n": 15, "t": "Days and the Calendar", "concept": "Yesterday, tomorrow and the day after tomorrow, or the day after a number of days.", "fast": ["Draw a line: day before yesterday ← yesterday ← today → tomorrow → day after tomorrow.", "A week is 7 days: after 7 or 14 or 21 days we are back on the same day.", "Remove whole weeks, then move forward by what is left."], "trap": null, "table": null, "new": false, "ex": {"q": "If the day before yesterday was Sunday, what day is the day after tomorrow?", "o": ["Wednesday", "Thursday", "Friday", "Tuesday"], "a": 1, "f": "", "s": ["Day before yesterday Sunday → yesterday Monday → today Tuesday → tomorrow Wednesday → day after tomorrow Thursday."], "c": 4}, "pr": [{"q": "If today is Monday, what day will it be after 15 days?", "o": ["Sunday", "Monday", "Tuesday", "Wednesday"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "A rabbit has 20 carrots and eats 2 every day. If it starts on Saturday, on which day does it eat the last carrot?", "o": ["Sunday", "Monday", "Friday", "Saturday"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L1-16", "n": 16, "t": "Clocks and Time", "concept": "When does the lesson end? How many minutes on the way? What time is it in the mirror?", "fast": ["An hour = 60 minutes; complete the whole hour first.", "Multiply the daily time by the number of days.", "Clock in a mirror: real time = 12:00 − the time shown."], "trap": null, "table": null, "new": false, "ex": {"q": "A lesson started at 8:15 and lasted 45 minutes. When did it end?", "o": ["8:45", "9:00", "9:15", "9:45"], "a": 1, "f": "", "s": ["15 + 45 = 60 minutes = one whole hour → 9:00."], "c": 4}, "pr": [{"q": "A wall clock seen in a mirror shows 3:00. What is the real time?", "o": ["3:00", "6:00", "9:00", "12:00"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "Omar walks 10 minutes to school and 10 minutes back, from Sunday to Thursday. How many minutes does he spend walking each week?", "o": ["100", "50", "70", "140"], "a": 0, "f": "", "s": [], "c": 4}]}, {"id": "L1-17", "n": 17, "t": "Money and Special Offers", "concept": "Buying with offers (buy 6 for 5), counting notes, or working out the change.", "fast": ["Offers: how many full offers can you buy with the money? Then multiply by the number of pieces.", "Change = money paid − price.", "Add the big notes first, then the small ones."], "trap": null, "table": null, "new": false, "ex": {"q": "Ice cream costs 1 riyal each, or 6 for 5 riyals. What is the most ice creams you can get with 20 riyals?", "o": ["20", "22", "24", "25"], "a": 2, "f": "", "s": ["20 ÷ 5 = 4 offers → 4 × 6 = 24 ice creams."], "c": 4}, "pr": [{"q": "Sara has one 10-riyal note, one 5-riyal note and two 1-riyal notes. How much money does she have?", "o": ["16", "17", "18", "19"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "Khalid bought 4 notebooks at 3 riyals each and paid 20 riyals. How much change did he get?", "o": ["8", "12", "17", "7"], "a": 0, "f": "", "s": [], "c": 4}]}, {"id": "L1-18", "n": 18, "t": "Ages", "concept": "Ages of brothers and sisters or of a father and son, now or after some years.", "fast": ["The difference between two ages never changes.", "After 2 years each person is 2 years older → the total of two people grows by 4.", "Write each age next to the name before adding."], "trap": null, "table": null, "new": false, "ex": {"q": "Khalid is 5 and his brother is 3 years older. What will their ages add up to in 2 years?", "o": ["13", "15", "17", "19"], "a": 2, "f": "", "s": ["Now: 5 and 8 → total 13 → in 2 years: 13 + 2 + 2 = 17."], "c": 4}, "pr": [{"q": "Reem is 9. Her sister is a year younger and her brother a year older. What do their ages add up to?", "o": ["27", "28", "30", "26"], "a": 0, "f": "", "s": [], "c": 4}, {"q": "A father is 30 and his son is 6. What will the difference between their ages be in 5 years?", "o": ["19", "24", "29", "35"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L1-19", "n": 19, "t": "Perimeter and Area", "concept": "A wire is bent into a square or rectangle, or we find the area of a shape.", "fast": ["Perimeter of a square = 4 × side → side = perimeter ÷ 4.", "Perimeter of a rectangle = 2 × (length + width).", "Area = length × width (the number of small squares inside)."], "trap": null, "table": null, "new": false, "ex": {"q": "A 20 cm wire is bent into a square. How long is each side?", "o": ["4 cm", "5 cm", "10 cm", "20 cm"], "a": 1, "f": "", "s": ["20 ÷ 4 = 5 cm."], "c": 4}, "pr": [{"q": "A 20 cm wire is bent into a rectangle 4 cm wide. How long is it?", "o": ["4 cm", "5 cm", "6 cm", "12 cm"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "A rectangle is 5 cm long and 3 cm wide. What is its area?", "o": ["8", "15", "16", "30"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L1-20", "n": 20, "t": "Counting Squares and Triangles", "concept": "How many squares or triangles are in the figure? The big ones count too!", "fast": ["Count the small ones first, then the ones made of two pieces, then the bigger ones.", "A 3 × 3 grid: (9 small + 4 medium + 1 big) = 14.", "Staircase: 1 + 2 + 3 + … for the number of columns."], "trap": null, "table": null, "new": false, "ex": {"q": "How many squares are in the figure?", "o": ["9", "14", "10", "13"], "a": 1, "f": "<svg class=\"fig\" viewBox=\"0 0 122 122\" width=\"122\" height=\"122\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"112\" stroke=\"#0f766e\" stroke-width=\"2.5\"/><line x1=\"10\" y1=\"10\" x2=\"112\" y2=\"10\" stroke=\"#0f766e\" stroke-width=\"2.5\"/><line x1=\"44\" y1=\"10\" x2=\"44\" y2=\"112\" stroke=\"#0f766e\" stroke-width=\"2.5\"/><line x1=\"10\" y1=\"44\" x2=\"112\" y2=\"44\" stroke=\"#0f766e\" stroke-width=\"2.5\"/><line x1=\"78\" y1=\"10\" x2=\"78\" y2=\"112\" stroke=\"#0f766e\" stroke-width=\"2.5\"/><line x1=\"10\" y1=\"78\" x2=\"112\" y2=\"78\" stroke=\"#0f766e\" stroke-width=\"2.5\"/><line x1=\"112\" y1=\"10\" x2=\"112\" y2=\"112\" stroke=\"#0f766e\" stroke-width=\"2.5\"/><line x1=\"10\" y1=\"112\" x2=\"112\" y2=\"112\" stroke=\"#0f766e\" stroke-width=\"2.5\"/></svg>", "s": ["9 small + 4 made of four squares + 1 big = 14."], "c": 4}, "pr": [{"q": "How many triangles are in the figure?", "o": ["4", "7", "8", "10"], "a": 3, "f": "<svg class=\"fig\" viewBox=\"0 0 200 128\" width=\"200\" height=\"128\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"100,8 10,120 190,120\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"2.5\"/><line x1=\"100\" y1=\"8\" x2=\"55\" y2=\"120\" stroke=\"#0f766e\" stroke-width=\"2\"/><line x1=\"100\" y1=\"8\" x2=\"100\" y2=\"120\" stroke=\"#0f766e\" stroke-width=\"2\"/><line x1=\"100\" y1=\"8\" x2=\"145\" y2=\"120\" stroke=\"#0f766e\" stroke-width=\"2\"/></svg>", "s": [], "c": 4}, {"q": "How many small squares are in the staircase?", "o": ["8", "9", "10", "12"], "a": 2, "f": "<svg class=\"fig\" viewBox=\"0 0 96 96\" width=\"96\" height=\"96\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"4\" y=\"70\" width=\"22\" height=\"22\" fill=\"#fbcfe8\" stroke=\"#831843\" stroke-width=\"1.6\"/><rect x=\"26\" y=\"70\" width=\"22\" height=\"22\" fill=\"#fbcfe8\" stroke=\"#831843\" stroke-width=\"1.6\"/><rect x=\"26\" y=\"48\" width=\"22\" height=\"22\" fill=\"#fbcfe8\" stroke=\"#831843\" stroke-width=\"1.6\"/><rect x=\"48\" y=\"70\" width=\"22\" height=\"22\" fill=\"#fbcfe8\" stroke=\"#831843\" stroke-width=\"1.6\"/><rect x=\"48\" y=\"48\" width=\"22\" height=\"22\" fill=\"#fbcfe8\" stroke=\"#831843\" stroke-width=\"1.6\"/><rect x=\"48\" y=\"26\" width=\"22\" height=\"22\" fill=\"#fbcfe8\" stroke=\"#831843\" stroke-width=\"1.6\"/><rect x=\"70\" y=\"70\" width=\"22\" height=\"22\" fill=\"#fbcfe8\" stroke=\"#831843\" stroke-width=\"1.6\"/><rect x=\"70\" y=\"48\" width=\"22\" height=\"22\" fill=\"#fbcfe8\" stroke=\"#831843\" stroke-width=\"1.6\"/><rect x=\"70\" y=\"26\" width=\"22\" height=\"22\" fill=\"#fbcfe8\" stroke=\"#831843\" stroke-width=\"1.6\"/><rect x=\"70\" y=\"4\" width=\"22\" height=\"22\" fill=\"#fbcfe8\" stroke=\"#831843\" stroke-width=\"1.6\"/></svg>", "s": [], "c": 4}]}, {"id": "L1-21", "n": 21, "t": "Dice and Cube Nets", "concept": "Opposite faces of a dice, or an unfolded cube where we need the opposite faces.", "fast": ["On a dice, two opposite faces always add up to 7 → (1 and 6), (2 and 5), (3 and 4).", "In a net: two faces with one square between them in a row or column are opposite.", "Opposite faces are never seen together."], "trap": null, "table": null, "new": false, "ex": {"q": "Which face is opposite 2 on a dice?", "o": ["3", "4", "5", "6"], "a": 2, "f": "", "s": ["7 − 2 = 5."], "c": 4}, "pr": [{"q": "A dice is on a table with 6 on top. Which face touches the table?", "o": ["1", "2", "3", "6"], "a": 0, "f": "", "s": [], "c": 4}, {"q": "When the net is folded into a cube, which number is opposite 3?", "o": ["5", "1", "4", "6"], "a": 0, "f": "<svg class=\"fig\" viewBox=\"0 0 168 128\" width=\"168\" height=\"128\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"44\" y=\"4\" width=\"40\" height=\"40\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"2\"/><text x=\"64.0\" y=\"24.0\" font-size=\"17\" fill=\"#134e4a\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">1</text><rect x=\"4\" y=\"44\" width=\"40\" height=\"40\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"2\"/><text x=\"24.0\" y=\"64.0\" font-size=\"17\" fill=\"#134e4a\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">2</text><rect x=\"44\" y=\"44\" width=\"40\" height=\"40\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"2\"/><text x=\"64.0\" y=\"64.0\" font-size=\"17\" fill=\"#134e4a\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">3</text><rect x=\"84\" y=\"44\" width=\"40\" height=\"40\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"2\"/><text x=\"104.0\" y=\"64.0\" font-size=\"17\" fill=\"#134e4a\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">4</text><rect x=\"124\" y=\"44\" width=\"40\" height=\"40\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"2\"/><text x=\"144.0\" y=\"64.0\" font-size=\"17\" fill=\"#134e4a\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">5</text><rect x=\"44\" y=\"84\" width=\"40\" height=\"40\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"2\"/><text x=\"64.0\" y=\"104.0\" font-size=\"17\" fill=\"#134e4a\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">6</text></svg>", "s": [], "c": 4}]}, {"id": "L1-22", "n": 22, "t": "Balances and Shape Values", "concept": "Each shape stands for a number or a weight; find the value of one shape.", "fast": ["Start with the equation that has one repeated shape: (★ + ★ = 10 → ★ = 5).", "Put its value into the next equation.", "A balanced scale: what is in one pan = what is in the other pan."], "trap": null, "table": null, "new": false, "ex": {"q": "If <span class=\"sym\" style=\"color:#d97706\">★</span> + <span class=\"sym\" style=\"color:#d97706\">★</span> = 10 and <span class=\"sym\" style=\"color:#d97706\">★</span> + <span class=\"sym\" style=\"color:#be123c\">●</span> = 8, what is <span class=\"sym\" style=\"color:#be123c\">●</span>?", "o": ["2", "3", "4", "5"], "a": 1, "f": "", "s": ["<span class=\"sym\" style=\"color:#d97706\">★</span> = 5 → <span class=\"sym\" style=\"color:#be123c\">●</span> = 8 − 5 = 3."], "c": 4}, "pr": [{"q": "If <span class=\"sym\" style=\"color:#be123c\">●</span><span class=\"sym\" style=\"color:#be123c\">●</span><span class=\"sym\" style=\"color:#be123c\">●</span> weigh the same as <span class=\"sym\" style=\"color:#0f766e\">▲</span>, and <span class=\"sym\" style=\"color:#0f766e\">▲</span> weighs the same as <span class=\"sym\" style=\"color:#1d4ed8\">■</span><span class=\"sym\" style=\"color:#1d4ed8\">■</span><span class=\"sym\" style=\"color:#1d4ed8\">■</span>, how many <span class=\"sym\" style=\"color:#be123c\">●</span> weigh the same as one <span class=\"sym\" style=\"color:#1d4ed8\">■</span>?", "o": ["1", "2", "3", "9"], "a": 0, "f": "", "s": [], "c": 4}, {"q": "A scale is balanced: one pan has a box and a 2 kg weight, the other has 7 kg. How heavy is the box?", "o": ["3", "9", "5", "7"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L1-23", "n": 23, "t": "Number Patterns", "concept": "Numbers in a row following a rule; find the next or missing number.", "fast": ["Write the difference between each pair of numbers above them.", "If the difference is the same, add it; if it grows (2, 4, 6), continue the growth.", "If the numbers grow quickly, try multiplying by 2."], "trap": null, "table": null, "new": false, "ex": {"q": "What is the next number? <span class=\"ns\"><b>2</b><b>5</b><b>8</b><b>11</b><b>?</b></span>", "o": ["13", "14", "15", "16"], "a": 1, "f": "", "s": ["The difference is always 3 → 11 + 3 = 14."], "c": 4}, "pr": [{"q": "What is the next number? <span class=\"ns\"><b>12</b><b>14</b><b>18</b><b>24</b><b>?</b></span>", "o": ["28", "30", "32", "36"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "What is the next number? <span class=\"ns\"><b>1</b><b>2</b><b>4</b><b>8</b><b>?</b></span>", "o": ["16", "10", "12", "14"], "a": 0, "f": "", "s": [], "c": 4}, {"q": "What is the next number? <span class=\"ns\"><b>20</b><b>17</b><b>14</b><b>11</b><b>?</b></span>", "o": ["7", "8", "9", "10"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L1-24", "n": 24, "t": "Sharing Equally", "concept": "Sharing things equally between boxes or children, and finding what is left over.", "fast": ["The remainder is always smaller than the number you divide by.", "Largest number of children who each get the same of every kind = the largest number that divides all the amounts.", "Test the options: divide and work out the remainder."], "trap": null, "table": null, "new": false, "ex": {"q": "29 dates are shared equally into 6 boxes and the worker keeps the rest. How many dates does the worker keep?", "o": ["3", "4", "5", "6"], "a": 2, "f": "", "s": ["6 × 4 = 24 → left over 29 − 24 = 5 dates."], "c": 4}, "pr": [{"q": "Ahmed has 12 apples and 18 oranges. He wants to share them among as many children as possible so each child gets the same number of each fruit. How many children?", "o": ["3", "6", "9", "12"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "A box has fewer than 30 fruits. Shared by 2, 3 or 4, one fruit is left over; shared by 5, nothing is left. How many fruits are in it?", "o": ["25", "13", "20", "21"], "a": 0, "f": "", "s": [], "c": 4}]}]}, {"key": "c", "title": "Scientific &amp; Mechanical Reasoning", "color": "#15803d", "sub": "Gears • Electricity • Magnets • Heat • States of matter • Light & shadow • The Moon • The human body • Living things • Motion", "ideas": [{"id": "L1-25", "n": 25, "t": "Gears and Pulleys", "concept": "Touching gears or pulleys with a belt; which way does it turn, or how many turns?", "fast": ["Two touching gears turn in opposite directions.", "In a row of gears: odd ones (1, 3, 5) turn like the first, even ones (2, 4) the other way.", "A crossed belt (×) reverses the direction; a straight belt does not.", "A small gear makes more turns than a big gear."], "trap": null, "table": null, "new": false, "ex": {"q": "If gear 1 turns clockwise, how does gear 4 turn?", "o": ["Clockwise", "Anticlockwise", "It does not turn", "Back and forth"], "a": 1, "f": "<svg class=\"fig\" viewBox=\"0 0 220 84\" width=\"352\" height=\"134\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"206.0,46.0 211.9,48.6 210.9,53.8 204.5,54.1 201.8,58.9 205.0,64.5 201.2,68.1 195.8,64.6 190.8,66.9 190.1,73.3 184.9,74.0 182.6,68.0 177.2,66.9 172.9,71.7 168.3,69.2 170.0,63.0 166.2,58.9 159.9,60.3 157.7,55.5 162.7,51.5 162.0,46.0 156.1,43.4 157.1,38.2 163.5,37.9 166.2,33.1 163.0,27.5 166.8,23.9 172.2,27.4 177.2,25.1 177.9,18.7 183.1,18.0 185.4,24.0 190.8,25.1 195.1,20.3 199.7,22.8 198.0,29.0 201.8,33.1 208.1,31.7 210.3,36.5 205.3,40.5\" fill=\"#64748b\" stroke=\"#334155\" stroke-width=\"1.2\"/><circle cx=\"184\" cy=\"46\" r=\"6.6\" fill=\"#fff\" stroke=\"#334155\"/><text x=\"184\" y=\"46\" font-size=\"11\" fill=\"#134e4a\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">1</text><polygon points=\"156.0,46.0 161.9,48.6 160.9,53.8 154.5,54.1 151.8,58.9 155.0,64.5 151.2,68.1 145.8,64.6 140.8,66.9 140.1,73.3 134.9,74.0 132.6,68.0 127.2,66.9 122.9,71.7 118.3,69.2 120.0,63.0 116.2,58.9 109.9,60.3 107.7,55.5 112.7,51.5 112.0,46.0 106.1,43.4 107.1,38.2 113.5,37.9 116.2,33.1 113.0,27.5 116.8,23.9 122.2,27.4 127.2,25.1 127.9,18.7 133.1,18.0 135.4,24.0 140.8,25.1 145.1,20.3 149.7,22.8 148.0,29.0 151.8,33.1 158.1,31.7 160.3,36.5 155.3,40.5\" fill=\"#64748b\" stroke=\"#334155\" stroke-width=\"1.2\"/><circle cx=\"134\" cy=\"46\" r=\"6.6\" fill=\"#fff\" stroke=\"#334155\"/><text x=\"134\" y=\"46\" font-size=\"11\" fill=\"#134e4a\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"c  a crossed belt as shown. If pulley 1 turns clockwise, pulley 2:", "o": ["turns clockwise", "turns anticlockwise", "does not turn", "stops pulley 1"], "a": 1, "f": "<svg class=\"fig\" viewBox=\"0 0 220 96\" width=\"220\" height=\"96\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"45\" cy=\"45\" r=\"28\" fill=\"#e2e8f0\" stroke=\"#334155\" stroke-width=\"2\"/><circle cx=\"175\" cy=\"45\" r=\"28\" fill=\"#e2e8f0\" stroke=\"#334155\" stroke-width=\"2\"/><line x1=\"45\" y1=\"17\" x2=\"175\" y2=\"73\" stroke=\"#b45309\" stroke-width=\"3\"/><line x1=\"45\" y1=\"73\" x2=\"175\" y2=\"17\" stroke=\"#b45309\" stroke-width=\"3\"/><text x=\"175\" y=\"45\" font-size=\"14\" fill=\"#1f2937\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">1</text><text x=\"45\" y=\"45\" font-size=\"14\" fill=\"#1f2937\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">2</text><text x=\"175\" y=\"88\" font-size=\"14\" fill=\"#d97706\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">↻</text></svg>", "s": [], "c": 2}]}, {"id": "L1-26", "n": 26, "t": "Electricity and Bulbs", "concept": "Simple circuits: bulbs on one line or on branches, and materials that do or do not carry electricity.", "fast": ["Series (one line): if one bulb breaks, all of them go out.", "Parallel (branches): if one bulb breaks, the others stay on.", "Conductors: iron, copper, aluminium. Insulators: plastic, wood, rubber, cotton."], "trap": null, "table": null, "new": false, "ex": {"q": "Bulbs are joined in series (on one line) and one breaks. What happens to the others?", "o": ["They get brighter", "They all go out", "They stay on", "Only one stays on"], "a": 1, "f": "", "s": ["In series there is only one path for electricity; if it is broken, everything goes out."], "c": 2}, "pr": [{"q": "Which object makes the bulb light up if it is put in the circuit?", "o": ["plastic ruler", "iron spoon", "piece of wood", "eraser"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "Bulbs are joined in parallel (branches) and one breaks. What happens to the others?", "o": ["They stay on", "They all go out", "They break", "The battery burns"], "a": 0, "f": "", "s": [], "c": 2}]}, {"id": "L1-27", "n": 27, "t": "Magnets and the Compass", "concept": "What does a magnet attract? When do two magnets pull together or push apart?", "fast": ["A magnet attracts iron (and nickel), but not aluminium, copper or plastic.", "Like poles push apart; unlike poles pull together.", "A compass needle is a small magnet; it moves if a magnet comes near."], "trap": null, "table": null, "new": false, "ex": {"q": "Which of these is attracted most easily by a magnet?", "o": ["iron filings", "a piece of aluminium", "a copper coin", "paper"], "a": 0, "f": "", "s": ["Iron is attracted by a magnet; the others are not."], "c": 4}, "pr": [{"q": "The north pole of a magnet is brought near the end of another magnet and they push apart. That end is:", "o": ["a south pole", "a north pole", "not magnetic", "the middle of the magnet"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "A man walked past a compass and its needle moved. The most likely reason is that he:", "o": ["is wearing a hat", "is walking fast", "is carrying a book", "is carrying a magnet"], "a": 3, "f": "", "s": [], "c": 2}]}, {"id": "L1-28", "n": 28, "t": "Heat and How It Moves", "concept": "Where does heat start and where does it go? Which materials carry it faster?", "fast": ["Heat moves from hot to cold, and the part nearest the flame heats first.", "Metals carry heat quickly; wood and plastic carry it slowly.", "Dark colours absorb more sunshine than light colours."], "trap": null, "table": null, "new": false, "ex": {"q": "Buttons are stuck with wax along a metal rod, and one end is heated. Which button falls first?", "o": ["The one farthest from the flame", "The one nearest the flame", "They fall together", "None falls"], "a": 1, "f": "", "s": ["Heat reaches the part nearest the flame first, so its wax melts first."], "c": 2}, "pr": [{"q": "A metal spoon, a wooden pencil and a plastic ruler are put in hot water. Which one’s top gets hot first?", "o": ["the wooden pencil", "the ruler", "the metal spoon", "all at the same time"], "a": 2, "f": "", "s": [], "c": 2}, {"q": "On a sunny day, which T-shirt makes you feel hotter?", "o": ["white", "black", "yellow", "pink"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L1-29", "n": 29, "t": "States of Matter and Changes", "concept": "Water is solid (ice), liquid and gas (steam), and changes between them by heating and cooling.", "fast": ["Melting: solid → liquid (ice melts).", "Freezing: liquid → solid. Evaporating and boiling: liquid → gas.", "Condensing: gas → liquid (drops of water on a cold glass)."], "trap": null, "table": null, "new": false, "ex": {"q": "Water was heated until it boiled, then left to cool until it became ice. What were the changes, in order?", "o": ["boiling – condensing – freezing", "freezing – boiling – condensing", "condensing – boiling – freezing", "boiling – freezing – condensing"], "a": 0, "f": "", "s": ["The water boiled into steam, the steam cooled and condensed into water, then the water cooled and froze."], "c": 2}, "pr": [{"q": "Drops of water on the outside of a cold glass of juice are caused by:", "o": ["juice leaking from the glass", "water vapour in the air condensing", "the glass melting", "the juice evaporating"], "a": 1, "f": "", "s": [], "c": 2}, {"q": "A piece of ice in the sun turns into water. This is called:", "o": ["freezing", "condensing", "melting", "boiling"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L1-30", "n": 30, "t": "Light, Shadows and Mirrors", "concept": "Where does a shadow fall? When is it short or big? What are different mirrors used for?", "fast": ["A shadow falls on the side opposite the light.", "At midday the sun is overhead → the shortest shadow.", "The closer an object is to a lamp, the bigger its shadow.", "A convex mirror gives a wider view (car park entrances)."], "trap": null, "table": null, "new": false, "ex": {"q": "When is a stick’s shadow the shortest?", "o": ["early morning", "midday", "afternoon", "just before sunset"], "a": 1, "f": "", "s": ["At midday the sun is almost above the stick, so its shadow is small."], "c": 4}, "pr": [{"q": "Why are convex mirrors fixed at car park entrances and exits?", "o": ["To make cars look bigger", "To give a wider view", "For decoration", "To reflect colours"], "a": 1, "f": "", "s": [], "c": 2}, {"q": "An elephant and a camel stand in front of a lamp, and the elephant’s shadow is smaller than the camel’s. The most likely reason:", "o": ["The elephant is smaller than the camel", "The camel is closer to the lamp", "The elephant is closer to the lamp", "Shadows never change"], "a": 1, "f": "", "s": [], "c": 2}]}, {"id": "L1-31", "n": 31, "t": "The Moon, the Sun and the Earth", "concept": "The shapes of the Moon during the month, and day and night.", "fast": ["The Moon goes around the Earth, so we see its shape change: crescent → half → gibbous → full moon.", "From crescent to full moon takes about two weeks.", "Day and night happen because the Earth spins on itself."], "trap": null, "table": null, "new": false, "ex": {"q": "Which phase of the Moon comes after these?", "o": ["<svg class=\"fig sm\" viewBox=\"0 0 52 52\" width=\"52\" height=\"52\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"1\" width=\"50\" height=\"50\" rx=\"5\" fill=\"#1e293b\"/><circle cx=\"26.0\" cy=\"26.0\" r=\"18.72\" fill=\"#1e293b\" stroke=\"#64748b\" stroke-width=\"1.5\"/></svg>", "<svg class=\"fig sm\" viewBox=\"0 0 52 52\" width=\"52\" height=\"52\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"1\" width=\"50\" height=\"50\" rx=\"5\" fill=\"#1e293b\"/><circle cx=\"26.0\" cy=\"26.0\" r=\"18.72\" fill=\"#fef9c3\"/><circle cx=\"15.704\" cy=\"26.0\" r=\"18.72\" fill=\"#1e293b\"/></svg>", "<svg class=\"fig sm\" viewBox=\"0 0 52 52\" width=\"52\" height=\"52\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"1\" width=\"50\" height=\"50\" rx=\"5\" fill=\"#1e293b\"/><circle cx=\"26.0\" cy=\"26.0\" r=\"18.72\" fill=\"#fef9c3\"/></svg>", "<svg class=\"fig sm\" viewBox=\"0 0 52 52\" width=\"52\" height=\"52\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"1\" width=\"50\" height=\"50\" rx=\"5\" fill=\"#1e293b\"/><path d=\"M26.0,7.280000000000001 A18.72,18.72 0 0 1 26.0,44.72 Z\" fill=\"#fef9c3\"/></svg>"], "a": 2, "f": "<div class=\"seq\"><span><svg class=\"fig sm\" viewBox=\"0 0 52 52\" width=\"52\" height=\"52\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"1\" width=\"50\" height=\"50\" rx=\"5\" fill=\"#1e293b\"/><circle cx=\"26.0\" cy=\"26.0\" r=\"18.72\" fill=\"#fef9c3\"/><circle cx=\"15.704\" cy=\"26.0\" r=\"18.72\" fill=\"#1e293b\"/></svg></span><span><svg class=\"fig sm\" viewBox=\"0 0 52 52\" width=\"52\" height=\"52\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"1\" width=\"50\" height=\"50\" rx=\"5\" fill=\"#1e293b\"/><path d=\"M26.0,7.280000000000001 A18.72,18.72 0 0 1 26.0,44.72 Z\" fill=\"#fef9c3\"/></svg></span><span><svg class=\"fig sm\" viewBox=\"0 0 52 52\" width=\"52\" height=\"52\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"1\" width=\"50\" height=\"50\" rx=\"5\" fill=\"#1e293b\"/><circle cx=\"26.0\" cy=\"26.0\" r=\"18.72\" fill=\"#fef9c3\"/><circle cx=\"-1.1439999999999984\" cy=\"26.0\" r=\"18.72\" fill=\"#1e293b\"/></svg></span><span><svg class=\"fig sm\" viewBox=\"0 0 52 52\" width=\"52\" height=\"52\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"2\" y=\"2\" width=\"48\" height=\"48\" fill=\"#fff\" stroke=\"#d97706\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/><text x=\"26.0\" y=\"26.0\" font-size=\"24\" fill=\"#d97706\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Poppins, DejaVu Sans\">?</text></svg></span></div>", "s": ["Crescent → half → gibbous → full moon (a whole circle)."], "c": 4}, "pr": [{"q": "A child drew the Moon as a crescent. About two weeks later it will probably be:", "o": ["a crescent", "a full moon (whole circle)", "a quarter circle", "unchanged"], "a": 1, "f": "", "s": [], "c": 2}, {"q": "Day and night happen because:", "o": ["the Earth spins on itself", "the Moon goes around the Earth", "the Sun moves away", "of the clouds"], "a": 0, "f": "", "s": [], "c": 2}]}, {"id": "L1-32", "n": 32, "t": "The Human Body and the Cell", "concept": "What body parts do, and comparing parts of a cell to things we know.", "fast": ["The heart is a pump, the lungs are for breathing, the stomach digests, bones and muscles help us move.", "The rib cage protects the heart and lungs, and the skull protects the brain.", "The nucleus is the cell’s “control centre”, and the membrane is a “gate” controlling what goes in and out.", "Order: cell → tissue → organ → system."], "trap": null, "table": null, "new": false, "ex": {"q": "Which comparison suits the job of the nucleus in a cell?", "o": ["a power station", "a control centre giving instructions", "a door for going in and out", "a water tank"], "a": 1, "f": "", "s": ["The nucleus controls all the work of the cell, like a control centre."], "c": 2}, "pr": [{"q": "Which of these protects the heart and lungs?", "o": ["the skin", "the rib cage", "the muscles", "the stomach"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "cell → tissue → organ → ......", "o": ["system", "blood", "bone", "cell"], "a": 0, "f": "", "s": [], "c": 4}]}, {"id": "L1-33", "n": 33, "t": "Living Things and Food Chains", "concept": "Who eats whom? What happens if one animal becomes fewer? How do we group animals?", "fast": ["A food chain starts with a plant, and each living thing eats the one before it.", "If an animal becomes fewer: what it ate increases, and what ate it decreases.", "Birds: feathers and lay eggs. Mammals: give birth and feed milk. Fish: live in water and breathe with gills."], "trap": null, "table": null, "new": false, "ex": {"q": "grass → grasshopper → frog → snake. If the number of frogs falls, what usually happens?", "o": ["Grasshoppers increase", "Snakes increase", "Grass increases", "Nothing happens"], "a": 0, "f": "", "s": ["Frogs eat grasshoppers, so with fewer frogs there are more grasshoppers."], "c": 2}, "pr": [{"q": "Choose the odd one out:", "o": ["hen", "pigeon", "fish", "sparrow"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "Why does the camel have long eyelashes?", "o": ["To run fast", "To protect its eyes from sand", "To see in the dark", "For decoration"], "a": 1, "f": "", "s": [], "c": 2}]}, {"id": "L1-34", "n": 34, "t": "Motion and Force", "concept": "Slopes, pushing and pulling, and speed and distance.", "fast": ["The steeper the slope, the faster things slide down.", "A smooth surface makes moving easier; a rough one slows it down.", "Pulling or pushing straight in the direction of motion needs the least effort.", "Time = distance ÷ speed."], "trap": null, "table": null, "new": false, "ex": {"q": "Mishal wants his toy car to go faster down a smooth slope. What should he do?", "o": ["Paint the slope", "Make the slope steeper", "Use bigger wheels", "Put sand on the slope"], "a": 1, "f": "", "s": ["A steeper slope makes the car go down faster."], "c": 2}, "pr": [{"q": "The easiest way to pull a box across a smooth floor is:", "o": ["pulling with a level rope", "pulling upwards", "pulling down towards the floor", "pushing from the top"], "a": 0, "f": "", "s": [], "c": 2}, {"q": "A car at 80 km/h is 400 km from a traffic light, and a bus at 60 km/h is 360 km away. Which arrives first?", "o": ["the car", "the bus", "they arrive together", "cannot tell"], "a": 0, "f": "", "s": [], "c": 2}]}]}, {"key": "d", "title": "Mental Flexibility", "color": "#7c3aed", "sub": "Odd shape out • Matrices • Shape sequences • Number figures • Shape relationships • Ordering • Folding • Number puzzles", "ideas": [{"id": "L1-35", "n": 3
