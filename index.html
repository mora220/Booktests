<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة الحل السريع</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="منصة تدريب على أفكار مقياس موهبة بالحل السريع — إعداد وتنظيم أ. محمد رجب">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: a study desk — sticky top bar, one centred working column; questions sit on a light "worksheet" sheet in both themes */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --raise:#f8f9fc; --ink:#151b2c; --muted:#5d667b; --line:#e1e5ee;
  --paper:#fffdf8; --paper-ink:#1f2937; --paper-line:#e8e2d3;
  --acc:#0f766e; --acc-ink:#ffffff; --acc-soft:#e3f4f1; --acc-deep:#134e4a;
  --hl:#f59e0b; --hl-soft:#fff4dc; --good:#15803d; --good-soft:#e7f6ec; --bad:#b91c1c; --bad-soft:#fdecec;
  --f-display:"Cairo","Tajawal",system-ui,sans-serif; --f-body:"Tajawal","Cairo",system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,27,44,.06),0 6px 20px rgba(20,27,44,.06);
}
:root[data-level="1"]{ --acc:#be185d; --acc-soft:#fcebf3; --acc-deep:#831843; }
:root[data-level="3"]{ --acc:#4338ca; --acc-soft:#ecebfd; --acc-deep:#312e81; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1220; --surface:#161b2b; --raise:#1c2234; --ink:#e9edf6; --muted:#9ba4ba; --line:#2a3147;
  --paper:#f4f1e8; --paper-ink:#1f2937; --paper-line:#ddd5c2;
  --acc:#2dd4bf; --acc-ink:#062a26; --acc-soft:#123b38; --acc-deep:#99f6e4;
  --hl:#fbbf24; --hl-soft:#3a2e12; --good:#4ade80; --good-soft:#123222; --bad:#f87171; --bad-soft:#3a1717;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark }
  :root[data-level="1"]:not([data-theme="light"]){ --acc:#f472b6; --acc-ink:#3b0a22; --acc-soft:#3d1529; --acc-deep:#fbcfe8; }
  :root[data-level="3"]:not([data-theme="light"]){ --acc:#a5b4fc; --acc-ink:#1e1b4b; --acc-soft:#25264d; --acc-deep:#e0e7ff; }
}
:root[data-theme="dark"]{
  --bg:#0e1220; --surface:#161b2b; --raise:#1c2234; --ink:#e9edf6; --muted:#9ba4ba; --line:#2a3147;
  --paper:#f4f1e8; --paper-ink:#1f2937; --paper-line:#ddd5c2;
  --acc:#2dd4bf; --acc-ink:#062a26; --acc-soft:#123b38; --acc-deep:#99f6e4;
  --hl:#fbbf24; --hl-soft:#3a2e12; --good:#4ade80; --good-soft:#123222; --bad:#f87171; --bad-soft:#3a1717;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark }
:root[data-theme="dark"][data-level="1"]{ --acc:#f472b6; --acc-ink:#3b0a22; --acc-soft:#3d1529; --acc-deep:#fbcfe8; }
:root[data-theme="dark"][data-level="3"]{ --acc:#a5b4fc; --acc-ink:#1e1b4b; --acc-soft:#25264d; --acc-deep:#e0e7ff; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.35;text-wrap:balance;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:900;font-size:19px;display:block;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.levels{display:flex;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.levels button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--muted)}
.levels button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.contact{display:flex;align-items:center;gap:6px;font-size:13.5px}
.contact a,.contact button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;text-decoration:none;color:var(--ink);font-weight:700}
.levels button{white-space:nowrap}
@media (max-width:600px){.lvw{display:none}.top .wrap{gap:8px}.brand small{display:none}.levels{order:3;width:100%;justify-content:space-between}.levels button{flex:1}}
.contact .wa{background:#16a34a;border-color:#16a34a;color:#fff}
.phone{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;letter-spacing:.5px}

/* tabs */
.tabs{display:flex;gap:6px;padding-top:18px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--muted);display:flex;align-items:center;gap:8px}
.tabs button[aria-selected="true"]{color:var(--acc-deep);border-color:var(--acc);background:var(--acc-soft)}
main{padding-block:18px 64px}

/* hero strip */
.intro{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.intro h1{font-size:clamp(22px,4vw,30px);font-weight:900}
.intro h1 em{font-style:normal;color:var(--acc)}
.intro p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.meter{display:flex;gap:14px;text-align:center}
.meter div{min-width:76px}
.meter b{display:block;font-family:var(--f-display);font-size:26px;color:var(--acc);line-height:1.1;font-variant-numeric:tabular-nums}
.meter span{font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.intro{grid-template-columns:1fr}.meter{justify-content:space-between}}

/* domain sections + idea rows */
.domain{margin-top:26px}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dhead i{width:12px;height:12px;border-radius:4px;flex:none}
.dhead h2{font-size:19px;font-weight:800}
.dhead span{color:var(--muted);font-size:13px;margin-inline-start:auto}
.ideas{display:grid;gap:8px}
.idea{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.idea .num{width:38px;height:38px;border-radius:10px;background:var(--raise);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.idea.done .num{background:var(--acc-soft);color:var(--acc-deep);border-color:transparent}
.idea .t{min-width:0}
.idea .t b{font-family:var(--f-display);font-weight:700;font-size:15.5px;display:block;line-height:1.4}
.idea .t small{color:var(--muted);font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar{height:6px;width:90px;background:var(--line);border-radius:6px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.badge{display:inline-block;background:var(--hl-soft);color:#92400e;border-radius:999px;padding:0 8px;font-size:11.5px;font-weight:800;font-family:var(--f-display)}
:root[data-theme="dark"] .badge{color:var(--hl)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge{color:var(--hl)}}
.acts{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:800;font-family:var(--f-display);font-size:14px;display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.big{padding:11px 20px;font-size:16px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
@media (max-width:560px){.idea{grid-template-columns:auto 1fr}.idea .acts{grid-column:1/-1}.idea .acts .btn{flex:1;justify-content:center}}

/* learn view */
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:12px;flex-wrap:wrap}
.crumb button{border:0;background:none;color:var(--acc-deep);font-weight:800;padding:0;font-family:var(--f-display)}
.lhead{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.lhead .num{flex:none;background:var(--acc);color:var(--acc-ink);font-family:var(--f-display);font-weight:900;border-radius:12px;padding:6px 12px;font-size:15px}
.lhead h1{font-size:clamp(22px,3.6vw,28px);font-weight:900}
.lhead p{margin:4px 0 0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.fast{background:var(--hl-soft);border-color:transparent}
.fast h3{font-size:16px;color:#b45309;display:flex;align-items:center;gap:6px;margin-bottom:6px}
:root[data-theme="dark"] .fast h3{color:var(--hl)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fast h3{color:var(--hl)}}
.fast ol{margin:0;padding-inline-start:22px;display:grid;gap:4px;list-style-type:arabic-indic}
.trap{border-inline-start:4px solid var(--bad);background:var(--bad-soft);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.trap b{color:var(--bad)}
.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:12px}
.rel div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px}
.rel b{display:block;color:var(--acc-deep);font-family:var(--f-display);font-size:13px}
.ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

/* worksheet (question card) */
.sheet{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.sheet .qmeta{display:flex;justify-content:space-between;gap:10px;color:#6b7280;font-size:13px;margin-bottom:8px;flex-wrap:wrap}
.sheet .qmeta b{color:#374151;font-family:var(--f-display)}
.qtext{font-size:17.5px;font-weight:700;line-height:1.85}
.qfig{margin:12px 0;overflow-x:auto}
.fig{display:block;margin:6px auto;max-width:100%;height:auto}
.fig.sm{display:inline-block;margin:0;vertical-align:middle}
.figrow,.seq{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;align-items:center;margin:8px 0}
.rel-sep{font-family:var(--f-display);font-size:22px;color:#831843}
.opts{display:grid;gap:10px;margin-top:14px}
.opts.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.opts.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:620px){.opts.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.opts.c2{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;text-align:start;background:#fff;border:1.5px solid #d6d9e0;border-radius:12px;padding:10px 12px;min-height:52px;color:#1f2937;font-weight:600;font-size:16px;min-width:0}
.opt:hover{border-color:var(--acc)}
.opt .bub{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #9aa1ae;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px;color:#4b5563;background:#fff}
.opt .val{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.opt.sel .bub{background:#1f2937;border-color:#1f2937;color:#fff}
.opt.ok{border-color:#16a34a;background:#ecfdf3}
.opt.ok .bub{background:#16a34a;border-color:#16a34a;color:#fff}
.opt.no{border-color:#dc2626;background:#fef2f2}
.opt.no .bub{background:#dc2626;border-color:#dc2626;color:#fff}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;border-radius:12px;padding:12px 14px;background:#f1f5f4;border:1px solid #dbe7e3;color:#1f2937}
.explain h4{font-size:15px;margin-bottom:4px}
.explain.ok h4{color:#15803d}.explain.no h4{color:#b91c1c}
.explain p{margin:2px 0}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}

/* book html helpers */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.15;margin:0 3px;font-weight:700}
.fr span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.sym{font-family:"DejaVu Sans","Segoe UI Symbol",sans-serif;font-size:1.1em}
.ns{display:inline-flex;gap:6px;vertical-align:middle;margin:0 4px;flex-wrap:wrap}
.ns b{min-width:34px;padding:0 6px;height:32px;border:1.5px solid #0f766e;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);background:#fff}
.code{display:inline-flex;direction:ltr;gap:2px;vertical-align:middle;margin:0 4px}
.code b{width:28px;height:28px;border:1.5px solid #475569;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);background:#fff}
ul.clues{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px;font-weight:500}
ul.clues li{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
table.numgrid{border-collapse:collapse;margin:8px auto;font-family:var(--f-display);font-size:17px}
table.numgrid td{border:1.5px solid #0f766e;width:48px;height:36px;text-align:center}
table.numgrid td.q{color:#d97706}
.dtable{border-collapse:collapse;margin:8px auto;font-size:15px}
.dtable th,.dtable td{border:1.3px solid #c7cbe0;padding:4px 10px;text-align:center}
.dtable th{background:#eef0fb;font-family:var(--f-display)}
.passage{background:#f6f3ea;border-inline-start:4px solid #0f766e;padding:8px 12px;border-radius:8px;font-weight:400;margin-bottom:8px;line-height:1.9}
.abox{border-collapse:separate;border-spacing:6px 0;margin:8px 0;font-family:var(--f-display);font-weight:700}
.abox td{border:1.5px solid #f0a7c9;border-radius:6px;padding:4px 14px;text-align:center;background:#fff}
.abox td.sep{border:none;background:none;padding:0}
.abox td.q{color:#d97706}

/* builder */
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:820px){.bgrid{grid-template-columns:1fr}}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pick header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pick header h3{font-size:16px;margin-inline-end:auto}
.pgroup{border-bottom:1px solid var(--line)}
.pgroup:last-child{border-bottom:0}
.pgroup .gh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--raise);font-family:var(--f-display);font-weight:800}
.pgroup .gh i{width:10px;height:10px;border-radius:3px}
.pgroup .gh label{margin-inline-start:auto;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;font-family:var(--f-body);font-weight:700}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 10px;padding:8px 14px}
.plist label{display:flex;gap:8px;align-items:flex-start;padding:5px 2px;font-size:14.5px;cursor:pointer}
.plist label small{color:var(--muted);font-variant-numeric:tabular-nums}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);flex:none;margin-top:4px}
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:grid;gap:12px}
.summary h3{font-size:17px}
.field label{display:block;font-weight:800;font-family:var(--f-display);font-size:14px;margin-bottom:4px}
.field .row{display:flex;gap:10px;align-items:center}
.field input[type=number]{width:84px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--raise);font-variant-numeric:tabular-nums;text-align:center}
.field input[type=range]{flex:1;accent-color:var(--acc)}
.field small{color:var(--muted);font-size:12.5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:var(--raise);border-radius:10px;padding:8px 10px}
.stats b{display:block;font-family:var(--f-display);font-size:22px;color:var(--acc-deep);font-variant-numeric:tabular-nums;line-height:1.2}
.stats span{font-size:12.5px;color:var(--muted)}
.dist{display:flex;flex-wrap:wrap;gap:6px;max-height:220px;overflow:auto}
.dist span{background:var(--acc-soft);color:var(--acc-deep);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700}
.dist span b{font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}

/* exam */
.ebar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:5;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
.timer{font-family:var(--f-display);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;direction:ltr;min-width:84px;text-align:center}
.timer.warn{color:var(--bad)}
.tprog{flex:1;min-width:120px;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.tprog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 12px}
.dots button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;padding:0}
.dots button.ans{background:var(--acc-soft);border-color:transparent;color:var(--acc-deep)}
.dots button.cur{outline:2px solid var(--acc);outline-offset:1px}
.dots button.flag{background:var(--hl-soft);border-color:var(--hl)}
.confirm{background:var(--hl-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}

/* results */
.score{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{width:132px;height:132px;flex:none}
.ring text{font-family:var(--f-display)}
@media (max-width:560px){.score{grid-template-columns:1fr;justify-items:center;text-align:center}}
.rtable{width:100%;border-collapse:collapse;font-size:14.5px}
.rtable th{text-align:start;color:var(--muted);font-weight:700;font-size:13px;padding:6px 8px;border-bottom:1px solid var(--line)}
.rtable td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rtable td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:800}
.pill.g{background:var(--good-soft);color:var(--good)}.pill.m{background:var(--hl-soft);color:#b45309}.pill.b{background:var(--bad-soft);color:var(--bad)}
.review{display:grid;gap:12px;margin-top:12px}
details.panel summary{cursor:pointer;font-family:var(--f-display);font-weight:800}
.scroll-x{overflow-x:auto}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
footer{color:var(--muted);font-size:13px;text-align:center;padding:24px 0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* LTR + auth + admin */
.tabs{align-items:stretch}
.tablink{display:flex;align-items:center;gap:8px;border-radius:12px;padding:10px 16px;font-family:var(--f-display);font-weight:800;font-size:15px;text-decoration:none;white-space:nowrap;flex:none;background:linear-gradient(120deg,var(--acc),color-mix(in srgb,var(--acc) 70%,var(--hl)));color:var(--acc-ink);border:1px solid transparent;margin-inline-start:auto}
.tablink:hover{filter:brightness(1.06)}
.promo{display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px 16px;border-radius:var(--r);text-decoration:none;color:var(--ink);background:var(--surface);border:1.5px dashed var(--acc)}
.promo:hover{background:var(--acc-soft)}
.promo .pico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--hl-soft);color:#b45309}
.promo b{display:block;font-family:var(--f-display);font-size:16.5px}
.promo small{display:block;color:var(--muted);font-size:13.5px}
.promo>span:nth-child(2){flex:1;min-width:0}
@media (max-width:560px){.promo{flex-wrap:wrap}.promo .btn{width:100%;justify-content:center}}
.modal{position:fixed;inset:0;z-index:40;background:rgba(8,12,24,.6);display:grid;place-items:start center;padding:24px 12px;overflow:auto}
.mbox{background:var(--bg);border-radius:var(--r);padding:16px;max-width:820px;width:100%;display:grid;gap:12px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-16px;background:var(--bg);padding-block:6px;z-index:1}
.ans-q .qfig svg{max-width:100%;height:auto}
.ans-q .val svg{height:64px;width:auto;max-width:100%}
.ans-q .passage{border-inline-start:4px solid var(--acc)}
.ans-q .emo{font-size:30px}
.ans-q .ana{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs button{flex:none;white-space:nowrap}
[dir=ltr] .fast ol{list-style-type:decimal}
[dir=ltr]{--f-display:"Cairo",system-ui,sans-serif}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.contact .btn{border-radius:999px;padding:5px 12px;font-size:13.5px}
.who{display:flex;align-items:center;gap:6px}
.who .btn{border-radius:999px;padding:5px 12px;font-size:13.5px}
.chip{background:var(--acc-soft);color:var(--acc-deep);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:700;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvone{background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:5px 14px;font-family:var(--f-display);font-weight:800;font-size:14px;white-space:nowrap}
@media (max-width:760px){.contact{display:none}.who{width:100%;justify-content:flex-end}.who .chip{margin-inline-end:auto}}
.login{max-width:420px;margin:40px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);display:grid;gap:14px}
.login h1{font-size:26px;font-weight:900}
.login p{margin:0;color:var(--muted)}
.login .note a{color:var(--acc-deep);font-weight:700}
.field input:not([type]),.field input[type=password],.filters input,.filters select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--raise);color:var(--ink)}
.field input:focus,.filters input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
.field .lbl{display:block;font-weight:800;font-family:var(--f-display);font-size:14px;margin-bottom:4px}
.row.wrap{flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center}
.err{color:var(--bad);background:var(--bad-soft);border-radius:10px;padding:8px 12px;margin:0;font-weight:700}
.okc{color:var(--good)}.errc{color:var(--bad)}
.flash{border-radius:10px;padding:8px 12px;font-weight:700;margin:0 0 12px;background:var(--surface);border:1px solid var(--line)}
.flash.okc{background:var(--good-soft);border-color:transparent}.flash.errc{background:var(--bad-soft);border-color:transparent}
.subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.subtabs button[data-atab]{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800;font-family:var(--f-display);color:var(--muted)}
.subtabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.subtabs #asStudent{margin-inline-start:auto}
.adm-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.adm-grid form{display:grid;gap:10px}
@media (max-width:760px){.adm-grid{grid-template-columns:1fr}}
.adm-grid details textarea{margin:8px 0;font-family:ui-monospace,monospace;font-size:13.5px}
.ck{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:14px;margin-inline-end:10px}
.filters{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.filters>*{flex:1;min-width:160px}
.lvtog{display:flex;gap:3px}
.tg{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:2px 9px;font-weight:800;font-size:12.5px;color:var(--muted);white-space:nowrap}
.tg.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.tg.off{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.acts-cell{white-space:nowrap}.acts-cell .btn{margin-inline-end:4px}
.code-cell{font-family:ui-monospace,monospace;direction:ltr;unicode-bidi:isolate;font-weight:700}
tr.inline td{background:var(--raise)}
tr.inline code{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-weight:800}
tr.inline input{max-width:160px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--surface)}
.link{border:0;background:none;padding:0;color:var(--acc-deep);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--muted)}
.h2{font-size:21px;font-weight:900}.h3{font-size:17px;margin-bottom:8px}.h4{font-size:15px;margin:12px 0 6px;color:var(--muted)}
.progrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.pg{display:flex;justify-content:space-between;gap:8px;border-radius:8px;padding:5px 10px;font-size:13px;border:1px solid var(--line)}
.pg span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg.g{background:var(--good-soft);border-color:transparent}.pg.m{background:var(--hl-soft);border-color:transparent}.pg.b{background:var(--bad-soft);border-color:transparent}.pg.na{color:var(--muted)}

/* ===== v3 visual refresh: level-coloured band, calmer cards, parent report ===== */
:root{--band:#115e59;--band-2:#0f766e;--ring-bg:#e6ebf2;--warn:#b45309}
:root[data-level="1"]{--band:#9d174d;--band-2:#be185d}
:root[data-level="3"]{--band:#3730a3;--band-2:#4338ca}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--band:#0f3d3a;--band-2:#115e59;--ring-bg:#2a3147;--warn:#fbbf24}
  :root[data-level="1"]:not([data-theme="light"]){--band:#4a1030;--band-2:#831843}
  :root[data-level="3"]:not([data-theme="light"]){--band:#262367;--band-2:#3730a3}}
:root[data-theme="dark"]{--band:#0f3d3a;--band-2:#115e59;--ring-bg:#2a3147;--warn:#fbbf24}
:root[data-theme="dark"][data-level="1"]{--band:#4a1030;--band-2:#831843}
:root[data-theme="dark"][data-level="3"]{--band:#262367;--band-2:#3730a3}
body::before{background:var(--band)}
.top{background:linear-gradient(100deg,var(--band),var(--band-2));color:#fff;border-bottom:0;box-shadow:0 2px 14px rgba(15,23,42,.14)}
.top .brand b{color:#fff}.top .brand small{color:rgba(255,255,255,.78)}
.top .levels{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}
.top .levels button{color:rgba(255,255,255,.86)}
.top .levels button[aria-pressed="true"]{background:#fff;color:var(--band)}
.top .btn,.top .contact .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff}
.top .btn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.5)}
.top .btn.wa{background:#16a34a;border-color:#16a34a}
.top .chip{background:rgba(255,255,255,.16);color:#fff}
.top .lvone{background:#fff;color:var(--band)}
/* tabs */
.tabs{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;margin-top:18px;gap:4px;box-shadow:var(--shadow)}
.tabs button{border:0;background:transparent;border-radius:11px;padding:9px 14px}
.tabs button:hover{background:var(--raise);color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--acc-soft);color:var(--acc-deep);border:0}
.tablink{border-radius:11px}
/* hero */
.hero2{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;padding:24px 26px;border-radius:20px;background:linear-gradient(135deg,var(--acc-soft),var(--surface) 62%);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero2::after{content:"";position:absolute;inset-inline-start:-90px;bottom:-110px;width:240px;height:240px;border-radius:50%;border:30px solid color-mix(in srgb,var(--hl) 14%,transparent);pointer-events:none;z-index:0}
.hero2>*{position:relative;z-index:1}
.tabs:empty{display:none}
@media (max-width:760px){.lside{order:2}.lside ul{gap:6px}.lside li{font-size:14.5px}}
.rtools{display:flex;justify-content:flex-end;gap:8px}
.lside>*{position:relative;z-index:1}
.rfoot{display:none}
@media print{.rfoot{display:block}}
.hero2 .kicker,.kicker{display:inline-block;font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--acc-deep);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 12px}
.hero2 h1{font-size:clamp(26px,4.4vw,36px);font-weight:900;margin-top:8px}
.hero2 p{color:var(--muted);margin:6px 0 14px;max-width:58ch}
.hero2 .ctas{margin:0}
.hstats{display:flex;align-items:center;gap:18px;position:relative;z-index:1}
.bring{position:relative;width:132px;height:132px;flex:none}
.bring svg{width:100%;height:100%}
.bring>div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.bring b{font-family:var(--f-display);font-size:28px;font-weight:900;line-height:1;color:var(--ink)}
.bring span{font-size:11.5px;color:var(--muted);max-width:86px;line-height:1.3;margin-top:4px}
.mini{display:grid;gap:8px}
.mini div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:150px}
.mini b{font-family:var(--f-display);font-size:20px;font-weight:900;color:var(--acc-deep);font-variant-numeric:tabular-nums}
.mini b small{font-size:13px;color:var(--muted);font-weight:700}
.mini span{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
@media (max-width:820px){.hero2{grid-template-columns:1fr}.hstats{justify-content:space-between}}
@media (max-width:480px){.hero2{padding:18px}.bring{width:112px;height:112px}.mini div{min-width:0}.hero2 .ctas .btn{width:100%;justify-content:center}}
/* domains overview */
.doms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:860px){.doms{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dom{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.dom::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--dc)}
.dom:hover{border-color:var(--dc)}
.dom>i{display:none}
.dom b{font-family:var(--f-display);font-size:14.5px;line-height:1.35}
.dom span{font-size:12.5px;color:var(--muted)}
.dbar{display:block;height:6px;border-radius:6px;background:var(--ring-bg);overflow:hidden;margin-top:4px}
.dbar i{display:block;height:100%;background:var(--dc);border-radius:6px}
/* idea rows */
.domain{scroll-margin-top:90px}
.dhead i{background:var(--dc)}
.idea{border-inline-start:4px solid color-mix(in srgb,var(--dc) 55%,transparent);transition:box-shadow .15s,border-color .15s}
.idea:hover{box-shadow:var(--shadow)}
.idea .num{color:var(--dc);border-color:color-mix(in srgb,var(--dc) 35%,var(--line));background:color-mix(in srgb,var(--dc) 8%,var(--surface))}
.idea.done .num{background:color-mix(in srgb,var(--dc) 16%,var(--surface));color:var(--dc)}
.idea.good .num{background:var(--good);color:#fff;border-color:transparent}
.st{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:0 9px;font-size:11.5px;font-weight:800;font-family:var(--f-display);line-height:1.8}
.st.good{background:var(--good-soft);color:var(--good)}.st.mid{background:var(--hl-soft);color:var(--warn)}.st.none{background:var(--raise);color:var(--muted);border:1px solid var(--line)}
.promo{margin-top:14px;border-style:solid;border-color:color-mix(in srgb,var(--hl) 55%,var(--line));background:linear-gradient(100deg,var(--hl-soft),var(--surface) 70%)}
/* sheets & panels */
.panel{border-radius:16px;box-shadow:var(--shadow)}
.sheet{border-radius:16px}
.opt{transition:border-color .12s,box-shadow .12s}
/* translation */
.trwrap{margin-top:12px}
.trbtn{display:inline-flex;align-items:center;gap:6px;border:1px dashed #9aa1ae;background:#fff;color:#374151;border-radius:999px;padding:4px 12px;font-family:"Cairo",system-ui,sans-serif;font-weight:800;font-size:13.5px}
.trbtn[aria-expanded="true"]{background:#fff4dc;border-color:#f59e0b;color:#92400e;border-style:solid}
.trbox{margin-top:8px;background:#f8f5ec;border:1px solid #e8e2d3;border-radius:12px;padding:10px 14px;font-family:"Tajawal","Cairo",system-ui,sans-serif;text-align:right}
.trbox .qtext{font-size:16.5px}
.tropts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:15px}
.tropts span{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:2px 10px}
.tropts span.ok{border-color:#16a34a;background:#ecfdf3}
.tropts b{font-family:"Cairo",sans-serif;color:#6b7280;margin-inline-end:4px}
.trsol{margin-top:8px;font-size:14.5px;color:#374151}.trsol p{margin:2px 0}
/* login */
.loginwrap{display:grid;grid-template-columns:1fr 1fr;max-width:860px;margin:34px auto 0;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);background:var(--surface)}
.loginwrap .login{margin:0;border:0;box-shadow:none;border-radius:0;max-width:none}
.lside{background:linear-gradient(150deg,var(--band),var(--band-2));color:#fff;padding:28px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.lside::after{content:"";position:absolute;inset-inline-start:-50px;bottom:-60px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(245,158,11,.35)}
.lside .kicker{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff;align-self:flex-start}
.lside h2{font-size:24px;font-weight:900;line-height:1.4}
.lside ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lside li{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.lside li svg{flex:none;margin-top:5px;background:var(--hl);color:#3a2400;border-radius:50%;padding:3px;width:20px;height:20px}
.lvdots{display:flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,.85);margin-top:auto;position:relative;z-index:1}
.lvdots i{width:12px;height:12px;border-radius:50%;border:2px solid #fff}
@media (max-width:760px){.loginwrap{grid-template-columns:1fr;margin-top:18px}.lside{padding:20px}.lside h2{font-size:20px}}
/* footer */
footer{padding:28px 0 12px}
.fcard{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;text-align:start;box-shadow:var(--shadow)}
.fcard>div{display:flex;align-items:center;gap:10px}
.fcard b{display:block;color:var(--ink);font-family:var(--f-display)}
.fcard small{display:block;color:var(--muted)}
.fcard .fl{gap:8px}.fcard .phone{font-weight:800;color:var(--ink)}
.fcard .btn.wa{background:#16a34a;border-color:#16a34a;color:#fff}
/* report */
.report{display:grid;gap:14px}
.rhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;background:linear-gradient(110deg,var(--band),var(--band-2));color:#fff;border-radius:18px;padding:18px 20px}
.rbrand{display:flex;align-items:center;gap:12px}
.rbrand b{display:block;font-family:var(--f-display);font-size:22px;font-weight:900}
.rbrand small{color:rgba(255,255,255,.8)}
.rhead dl{display:grid;grid-template-columns:repeat(2,auto);gap:4px 22px;margin:0}
.rhead dt{font-size:12px;color:rgba(255,255,255,.75)}
.rhead dd{margin:0;font-weight:800;font-family:var(--f-display)}
.rhead .muted{color:rgba(255,255,255,.75)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.rhead dl{grid-template-columns:1fr 1fr}}
.kpis div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.kpis b{display:block;font-family:var(--f-display);font-size:24px;font-weight:900;color:var(--acc-deep);line-height:1.2;font-variant-numeric:tabular-nums}
.kpis b.sm{font-size:15px;line-height:1.6}
.kpis b small{font-size:14px;color:var(--muted)}
.kpis span{font-size:12.5px;color:var(--muted)}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.rcard h3{font-size:17px;margin-bottom:10px}
.dgrid{display:grid;gap:10px}
.drow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:center}
.drow .dt{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.drow .dt i{width:10px;height:10px;border-radius:3px;background:var(--dc);flex:none}
.drow .dt b{font-family:var(--f-display);font-size:14.5px}
.drow .dt span{font-size:12.5px;color:var(--muted)}
.dmeter{display:flex;align-items:center;gap:10px}
.dmeter .track{flex:1;height:10px;border-radius:10px;background:var(--ring-bg);overflow:hidden}
.dmeter .track i{display:block;height:100%;background:var(--dc);border-radius:10px}
.dmeter b{min-width:44px;text-align:end;font-variant-numeric:tabular-nums;font-family:var(--f-display)}
@media (max-width:560px){.drow{grid-template-columns:1fr}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rlist li{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:6px;font-size:14.5px}
.warnc{color:var(--warn)}
.rnote{background:var(--hl-soft);border-radius:14px;padding:12px 16px;margin:0;font-weight:600}
.rfoot{color:var(--muted);font-size:13px;text-align:center}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important;color:#111}
  body::before,.top,.tabs,footer,.noprint,.subtabs,.flash{display:none!important}
  main{padding:0}
  .rcard,.kpis div{box-shadow:none;break-inside:avoid}
  .rhead,.rnote,.dmeter .track i,.drow .dt i,.pill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>


<div class="top"><div class="wrap" id="topbar"></div></div>

<div class="wrap">
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="app"></main>
  <footer id="foot"></footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

ل : حصان"], ["صغير الحيوان", "شِبل : أسد"], ["مسكن الحيوان", "عرين : أسد"], ["مادة ومصنوع", "حديد : مسمار"], ["مرحلة ومرحلة", "هلال : بدر"], ["درجة الصفة", "دافئ : حار"], ["سبب ونتيجة", "عطش : ذبول"], ["صغير وكبير", "كوخ : قصر"]], "new": false, "ex": {"q": "قلم : كاتب &nbsp;:: &nbsp; مِشرط : ......", "o": ["نجّار", "جرّاح", "خيّاط", "رسّام"], "a": 1, "f": "", "s": ["الجملة الرابطة: «القلم أداة يعمل بها الكاتب» ← «المشرط أداة يعمل بها الجرّاح»."], "c": 4}, "pr": [{"q": "كوخ : قصر &nbsp;:: &nbsp; جدول : ......", "o": ["ماء", "سمك", "نهر", "ضفة"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "العلاقة بين نعيق : غراب مثل العلاقة بين:", "o": ["قط : مواء", "زئير : أسد", "صوت : أذن", "عش : طائر"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "ماء : عطش &nbsp;:: &nbsp; طعام : ......", "o": ["شبع", "مطبخ", "جوع", "طبق"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L2-2", "n": 2, "t": "التصنيف والكلمة المختلفة", "concept": "أربع كلمات ثلاث منها يجمعها رابط واحد، والمطلوب الكلمة الشاذّة، أو كلمة من فئة كلمة السؤال.", "fast": ["ابحث عن الرابط «الأدق» لا الأعم: كلها حيوانات؟ ابحث عن فصيلة أو بيئة أو صفة.", "جرّب: المعنى (مترادفات/أضداد)، الفئة (فواكه/خضروات)، الوظيفة، المادة.", "إن ظهرت كلمتان شاذتان فرابطك ليس دقيقاً بعد."], "trap": null, "table": null, "new": false, "ex": {"q": "اختر الكلمة المختلفة:", "o": ["أسد", "نمر", "فهد", "ذئب"], "a": 3, "f": "", "s": ["الأسد والنمر والفهد من فصيلة القطط، أما الذئب فمن فصيلة الكلاب."], "c": 4}, "pr": [{"q": "اختر الكلمة المختلفة:", "o": ["إرجاء", "تأجيل", "إسراع", "تسويف"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "اختر الكلمة المختلفة:", "o": ["حديد", "نحاس", "مطاط", "ألمنيوم"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L2-3", "n": 3, "t": "إكمال الجمل", "concept": "جملة فيها فراغ أو فراغان، والمطلوب الكلمة التي تجعل المعنى سليماً ومتّسقاً.", "fast": ["اقرأ الجملة كاملة أولاً وتوقّع الكلمة قبل النظر للخيارات.", "أدوات الربط مفاتيح: «لكن، رغم» ← تضاد ، «لذلك، لأن» ← سبب ونتيجة ، «و» ← توافق.", "في الفراغين: ابدأ بالفراغ الأسهل واستبعد كل خيار لا يناسبه، ثم افحص الباقي."], "trap": null, "table": null, "new": false, "ex": {"q": "رغم صعوبة الطريق، كان المتسابق ...... في سيره حتى بلغ النهاية.", "o": ["متردداً", "متثاقلاً", "ثابتاً", "عاجزاً"], "a": 2, "f": "", "s": ["«رغم» تدل على تضاد مع «صعوبة الطريق»، و«حتى بلغ النهاية» تدل على النجاح ← ثابتاً."], "c": 4}, "pr": [{"q": "العلم ...... يضيء الطريق، والجهل ...... يُضلّ صاحبه.", "o": ["ماء – نار", "نور – ظلام", "سيف – درع", "بحر – جبل"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "يمتاز الجمل بقدرته على ...... العطش؛ لذا سُمّي ...... الصحراء.", "o": ["الشعور – ملك", "مقاومة – أسد", "تحمّل – سفينة", "إطفاء – نجم"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L2-4", "n": 4, "t": "المقدمات غير الواقعية", "concept": "عبارة تبدأ بمقدمة مخالفة للواقع (إذا كان الخبز يُكتب به…)، والمطلوب نتيجة منطقية «داخل عالم السؤال».", "fast": ["سلّم بالمقدمة كأنها حقيقة، وانسَ الواقع تماماً.", "استبدل الكلمة: كل ما كان للكلمة الأولى صار للثانية.", "الخيار «الواقعي» غالباً هو الفخ."], "trap": null, "table": null, "new": false, "ex": {"q": "إذا كان القلم يُؤكل، والتفاح يُكتب به؛ فإن الطالب يكتب درسه بـ ......", "o": ["القلم", "التفاح", "الدفتر", "الحبر"], "a": 1, "f": "", "s": ["في عالم السؤال: أداة الكتابة هي التفاح ← يكتب بالتفاح (القلم هو الفخ الواقعي)."], "c": 4}, "pr": [{"q": "إذا كانت الأسماك تطير، والطيور تسبح؛ فإن العصفور يعيش في ......", "o": ["الهواء", "العش", "الماء", "الشجرة"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "إذا كان الثلج حاراً، والنار باردة؛ فإننا نتدفّأ في الشتاء بـ ......", "o": ["النار", "الثلج", "الماء", "الرياح"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L2-5", "n": 5, "t": "فهم المقروء والاستنتاج من النص", "concept": "نص قصير تليه أسئلة: معنى كلمة، فكرة رئيسة، عنوان، استنتاج، أو مرجع ضمير.", "fast": ["اقرأ الأسئلة أولاً لتعرف ماذا تبحث عنه في النص.", "الإجابة من النص لا من معلوماتك العامة.", "احذر الخيارات المطلقة (كل، دائماً، أبداً) إذا كان النص يقول (غالباً، بعض).", "العنوان الأنسب يشمل النص كله، لا تفصيلة واحدة منه."], "trap": null, "table": null, "new": false, "ex": {"q": "<div class=\"passage\">النخلة شجرة مباركة تتحمّل الحرّ والجفاف، ويستفيد الإنسان من كل جزء فيها؛ فيأكل ثمرها، ويصنع من سعفها السلال والحُصُر، وقديماً صُنعت من جذوعها سقوف البيوت.</div>أنسب عنوان للنص:", "o": ["صناعة السلال", "النخلة شجرة العطاء", "البيوت القديمة", "الجفاف في الصحراء"], "a": 1, "f": "", "s": ["الخيارات (أ، ج) تفاصيل جزئية، و(د) ليس موضوع النص ← «النخلة شجرة العطاء» يشمل النص كله."], "c": 2}, "pr": [{"q": "<div class=\"passage\">يهاجر طائر اللقلق كل خريف من أوروبا إلى أفريقيا هرباً من البرد وبحثاً عن الغذاء، ثم يعود في الربيع ليبني عشّه في المكان نفسه غالباً.</div>سبب هجرة اللقلق كما في النص:", "o": ["حب السفر", "البرد وقلة الغذاء", "بناء العش", "حرارة الصيف"], "a": 1, "f": "", "s": [], "c": 2}, {"q": "في النص السابق، كلمة «غالباً» تعني:", "o": ["دائماً", "نادراً", "في أكثر الأحوال", "أبداً"], "a": 2, "f": "", "s": [], "c": 4}]}]}, {"key": "b", "title": "الاستدلال الرياضي والمكاني", "color": "#0f766e", "sub": "مسائل لفظية • هندسة وقياس • مفكوك المكعب • المرآة والطي", "ideas": [{"id": "L2-6", "n": 6, "t": "الكسور والجزء المتبقي", "concept": "سؤال يعطيك أجزاءً من «كلٍّ» (يوم، راتب، قصة) ويطلب المتبقي أو قيمة جزء. الفخ الشائع: كلمة «من الباقي».", "fast": ["افترض للكلّ عدداً مريحاً يقبل القسمة على كل المقامات (مثل ١٢ أو ٢٤ أو ٦٠).", "احسب كل جزء كعدد صحيح ثم اطرح، وحوّل الناتج لكسر في النهاية.", "إذا ورد «من الباقي» فاحسب الباقي أولاً ثم خذ الكسر منه."], "trap": "«ثلث الباقي» ليس «ثلث الكل».", "table": null, "new": false, "ex": {"q": "يقضي سامي <span class=\"fr\"><span>1</span><span>3</span></span> يومه في المدرسة، و<span class=\"fr\"><span>1</span><span>4</span></span> يومه في النوم، و<span class=\"fr\"><span>1</span><span>6</span></span> يومه في اللعب. ما الكسر الذي يمثّل المتبقي من يومه؟", "o": ["<span class=\"fr\"><span>1</span><span>4</span></span>", "<span class=\"fr\"><span>1</span><span>3</span></span>", "<span class=\"fr\"><span>5</span><span>12</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>" 4", "10"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L2-8", "n": 8, "t": "الرؤوس والأرجل", "concept": "نوعان مختلفان (دجاج وأرانب، دراجات ثنائية وثلاثية) نعرف عددهما الكلي ومجموع الأرجل أو العجلات.", "fast": ["افترض أن الجميع من النوع ذي الأرجل الأقل.", "الأرجل الزائدة = الأرجل الحقيقية − الأرجل المفترضة.", "عدد النوع الآخر = الزيادة ÷ الفرق بين أرجل النوعين."], "trap": null, "table": null, "new": false, "ex": {"q": "في حظيرة دجاج وأرانب، عدد الرؤوس 20 وعدد الأرجل 56. كم عدد الأرانب؟", "o": ["6", "8", "12", "14"], "a": 1, "f": "", "s": ["لو كانت كلها دجاجاً: 20 × 2 = 40 رجلاً.", "الزيادة = 56 − 40 = 16، والفرق بين النوعين = 4 − 2 = 2.", "عدد الأرانب = 16 ÷ 2 = 8 (تحقّق: 8 × 4 + 12 × 2 = 56 ✓)."], "c": 4}, "pr": [{"q": "عدّ أحمد أرجل وعيون مجموعة من الماعز فوجد المجموع 48. كم عدد الماعز؟", "o": ["6", "12", "8", "16"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "في موقف 12 دراجة بين ثنائية وثلاثية العجلات، ومجموع العجلات 29. كم دراجة ثلاثية؟", "o": ["4", "5", "7", "9"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L2-9", "n": 9, "t": "التعويض من الخيارات والحل العكسي", "concept": "عندما يكون السؤال «فكّرت في عدد…» أو معادلة يصعب تكوينها، فالإجابة موجودة بين الخيارات!", "fast": ["ابدأ بتجربة الخيار الأوسط؛ إن كان الناتج كبيراً جرّب الأصغر والعكس.", "في «فكّرت في عدد ثم …» ابدأ من النهاية واعكس العمليات: الجمع ↔ الطرح، الضرب ↔ القسمة.", "استبعد الخيارات المستحيلة أولاً (الكسور في عدد أشخاص، أو عدد أكبر من الكل)."], "trap": null, "table": null, "new": false, "ex": {"q": "عدد إذا أضفنا إليه نصفه ثم أضفنا 5 أصبح الناتج 35. ما العدد؟", "o": ["15", "20", "24", "30"], "a": 1, "f": "", "s": ["جرّب ب: 20 + 10 + 5 = 35 ✓ — انتهى السؤال في ثوانٍ.", "حل عكسي: 35 − 5 = 30، والعدد ونصفه = 30 ← العدد = 20."], "c": 4}, "pr": [{"q": "قال راعٍ: لو كان عندي مثل غنمي ونصفه، وأضفت غنمة واحدة لصار عندي 51 غنمة. كم غنمة عنده؟", "o": ["20", "25", "30", "40"], "a": 0, "f": "", "s": [], "c": 4}, {"q": "عدد من رقمين مجموع رقميه 9، وإذا عكسنا رقميه زاد العدد بمقدار 27. ما العدد؟", "o": ["45", "2 /b><b>4</b><b>2</b></span>", "<span class=\"code\"><b>4</b><b>0</b><b>2</b></span>", "<span class=\"code\"><b>0</b><b>2</b><b>4</b></span>"], "a": 1, "f": "", "s": ["طبّق الخيارات على المعطيات بدلاً من الحل الطويل:", "(240) ✗: الصفر في الخانة الأخيرة، والمعطى (780) يقول إنه في غير مكانه.", "(024) ✗: لا يبقى في (682) رقم صحيح في مكانه.", "(402) ✗: الصفر في الوسط في مكانه كما في (206)، والمعطى يقول «في غير مكانهما».", "يبقى (042) ✓ ويحقّق المعطيات الخمسة."], "c": 4}, "pr": [{"q": "رقم سري من رقمين:<ul class=\"clues\"><li><span class=\"code\"><b>5</b><b>2</b></span> رقم صحيح وفي مكانه.</li><li><span class=\"code\"><b>9</b><b>1</b></span> رقم صحيح لكن في غير مكانه.</li><li><span class=\"code\"><b>2</b><b>8</b></span> لا يوجد أي رقم صحيح.</li></ul>ما الرقم السري؟", "o": ["<span class=\"code\"><b>9</b><b>5</b></span>", "<span class=\"code\"><b>5</b><b>1</b></span>", "<span class=\"code\"><b>2</b><b>9</b></span>", "<span class=\"code\"><b>5</b><b>9</b></span>"], "a": 3, "f": "", "s": [], "c": 4}]}, {"id": "L2-34", "n": 34, "t": "الاستنتاج المنطقي (القياس و«كل/بعض»)", "concept": "مقدمتان أو موقف، والمطلوب النتيجة التي تلزم «حتماً» لا التي «قد» تكون صحيحة.", "fast": ["ارسم دوائر: «كل أ ب» ← دائرة أ داخل دائرة ب.", "«بعض» تعني تداخلاً جزئياً؛ لا تعمّمها إلى «كل».", "النتيجة الصحيحة لا تحتاج معلومة من خارج السؤال؛ إن احتجت معلومة إضافية فاختر «لا يمكن الحكم»."], "trap": "«كل المتفوقين يقرؤون» لا تعني أن «كل من يقرأ متفوق».", "table": null, "new": false, "ex": {"q": "كل الطلاب المتفوقين يقرؤون يومياً، وأحمد يقرأ يومياً. نستنتج أن:", "o": ["أحمد متفوق.", "أحمد ليس متفوقاً.", "لا يمكن الحكم بأن أحمد متفوق.", "كل من يقرأ متفوق."], "a": 2, "f": "", "s": ["دائرة «المتفوقين» داخل دائرة «من يقرأ»، وأحمد داخل الدائرة الكبيرة فقط؛ قد يكون داخل الصغيرة وقد لا يكون ← لا يمكن الحكم."], "c": 2}, "pr": [{"q": "بعض الطيور لا تطير، والنعامة طائر. نستنتج أن:", "o": ["النعامة لا تطير حتماً.", "كل الطيور تطير.", "لا يمكن الجزم من المعطيات بأن النعامة تطير.", "النعامة ليست طائراً."], "a": 2, "f": "", "s": [], "c": 2}, {"q": "أغلق الأب كل نوافذ البيت قبل السفر، وعند العودة وجد نافذة مفتوحة ولا آثار كسر. أقوى تفسير منطقي:", "o": ["النوافذ تفتح وحدها.", "نسي الأب إغلاق إحدى النوافذ.", "البيت بلا نوافذ.", "لم يسافر الأب."], "a": 1, "f": "", "s": [], "c": 2}]}]}], "3": [{"key": "a", "title": "الاستدلال اللفظي واللغوي", "color": "#be123c", "sub": "تناظر ثنائي وثلاثي • مقدمات افتراضية • تصنيف • معنى من السياق • مقولات ونصوص • مواقف حياتية", "ideas": [{"id": "L3-1", "n": 1, "t": "التناظر اللفظي (الزوجان)", "concept": "زوج كلمات بينهما علاقة، والمطلوب زوج بالعلاقة نفسها وبالترتيب نفسه. في المستوى الثالث تكثر العلاقات الدقيقة: التحوّل، الغطاء الخارجي، الفعل والعضو.", "fast": ["كوّن جملة رابطة دقيقة: (اللحاء هو الغطاء الخارجي للشجرة).", "ضع كل خيار في الجملة نفسها؛ واستبعد ما تصلح فيه الجملة بالعكس فقط.", "إن صلح خياران فزد الجملة دقة: (غطاء خارجي «طبيعي» يحمي…)."], "trap": null, "table": [["ترادف", "حسام : سيف"], ["تضاد", "تنصّل : اعترف"], ["تحوّل", "عجين : خبز"], ["غطاء خارجي", "لِحاء : شجرة"], ["أداة ومهنة", "منجل : مزارع"], ["مكان ونشاط", "نادٍ : رياضة"], ["فعل وعضو", "وَطِئ : قدم"], ["صغير وكبير", "جدول : نهر"], ["درجة الصفة", "غضب : غيظ"], ["سبب ونتيجة", "إهمال : رسوب"], ["مسكن", "عرين : أسد"], ["جزء من كل", "شُرفة : مبنى"]], "new": false, "ex": {"q": "حسام : سيف", "o": ["قلم : دفتر", "ليث : أسد", "نهر : بحر", "قمر : شمس"], "a": 1, "f": "", "s": ["العلاقة ترادف: الحسام اسم من أسماء السيف ← الليث اسم من أسماء الأسد."], "c": 4}, "pr": [{"q": "قشرة : برتقالة", "o": ["ورقة : كتاب", "عصير : ليمون", "جذر : نبات", "جلد : إنسان"], "a": 3, "f": "", "s": [], "c": 4}, {"q": "تنصّل : اعترف", "o": ["غادر : رحل", "جحد : أقرّ", "فهم : أدرك", "صمت : سكت"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "عجين : خبز", "o": ["ماء : ثلج", "خبز : فرن", "دقيق : قمح", "شجرة : ورق"], "a": 0, "f": "", "s": [], "c": 4}]}, {"id": "L3-2", "n": 2, "t": "تناظر الصناديق والسلاسل الثلاثية", "concept": "صندوقان أو سلسلتان من ثلاث كلمات، والمطلوب الكلمة الناقصة. وقد تكون العلاقة في المعنى، أو في «ترتيب الضوء"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L3-4", "n": 4, "t": "المقدمات غير الواقعية", "concept": "عبارة تبدأ بمقدمة تحتها خط مخالفة للواقع، والمطلوب نتيجة منطقية داخل عالم السؤال.", "fast": ["سلّم بالمقدمة تماماً وانسَ الواقع.", "كل ما كان للكلمة الأولى في الواقع صار للكلمة الثانية.", "الخيار «الواقعي» هو الفخ في أغلب الأسئلة."], "trap": null, "table": null, "new": false, "ex": {"q": "إذا كانت <u>السحب حجارة</u>، والجبال قطناً؛ فإن المطر يسقط من ......", "o": ["السحب", "الحجارة", "القطن", "الجبال"], "a": 1, "f": "", "s": ["في عالم السؤال: السحب اسمها «حجارة»، فالمطر يسقط من الحجارة. «السحب» هو الفخ الواقعي."], "c": 4}, "pr": [{"q": "إذا كان <u>الكتاب يُشرب</u>، والعصير يُقرأ؛ فإن المكتبة مليئة بـ ......", "o": ["الكتب", "الأكواب", "القرّاء", "العصير"], "a": 3, "f": "", "s": [], "c": 4}, {"q": "إذا كانت <u>الأسماك تعيش في الصحراء</u>، والإبل في البحر؛ فإن «سفينة الصحراء» هي ......", "o": ["الإبل", "السمك", "الرمال", "القارب"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L3-5", "n": 5, "t": "التصنيف (الكلمة المختلفة ومن نفس الفئة)", "concept": "نوعان: أربع كلمات واحدة شاذة عنها، أو كلمة في رأس السؤال والمطلوب ما ينتمي لفئتها.", "fast": ["ابحث عن الرابط الأدق لا الأعم: (أجزاء الشجرة) أدق من (أشياء طبيعية).", "جرّب: الفئة، الوظيفة، المادة، الزمن، المكان.", "إن ظهرت كلمتان شاذتان فرابطك ليس دقيقاً بعد."], "trap": null, "table": null, "new": false, "ex": {"q": "اختر الكلمة المختلفة:", "o": ["جذع", "غصن", "حقل", "ورقة"], "a": 2, "f": "", "s": ["الجذع والغصن والورقة أجزاء من الشجرة، أما الحقل فمكان."], "c": 4}, "pr": [{"q": "ياقوت — اختر ما ينتمي للفئة نفسها:", "o": ["زمرّد", "ذهب", "فضة", "نحاس"], "a": 0, "f": "", "s": [], "c": 4}, {"q": "اختر الكلمة المختلفة:", "o": ["النيل", "الفرات", "الأمازون", "الأحمر"], "a": 3, "f": "", "s": [], "c": 4}]}, {"id": "L3-6", "n": 6, "t": "إكمال الجمل ومعنى الكلمة من السياق", "concept": "جمل بفراغ أو فراغين، وفي التجميعات الحديثة: كلمة غريبة مخترعة تُفهم من سياقها (مثل «المراون» أو «الجلائيم»).", "fast": ["الكلمة الغريبة: اب  ، 3أ + 2ب = 16 ، فما قيمة أ + ب؟", "o": ["5", "6", "7", "35"], "a": 2, "f": "", "s": ["بالجمع: 5أ + 5ب = 35 ← أ + ب = 7 (دون إيجاد أ و ب)."], "c": 4}, "pr": [{"q": "إذا كان: س + ص = 5 ، ص + ع = 7 ، س + ع = 8 ، فما قيمة س + ص + ع؟", "o": ["20", "12", "10", "8"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "إذا كان: 3س + ص = 14 ، س + 3ص = 10 ، فما متوسط س و ص؟", "o": ["2", "3", "6", "12"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L3-10", "n": 10, "t": "المتتابعة الحسابية والحد النوني", "concept": "أعداد يزيد كل منها بمقدار ثابت، والمطلوب حد بعيد (الحد 99) أو عدد الحدود أو مجموعها.", "fast": ["الحد النوني = الحد الأول + (ن − 1) × الفرق.", "عدد الحدود = (الأخير − الأول) ÷ الفرق + 1.", "المجموع = عدد الحدود × (الأول + الأخير) ÷ 2."], "trap": null, "table": null, "new": false, "ex": {"q": "ما الحد المئة في المتتابعة <span class=\"ns\"><b>7</b><b>11</b><b>15</b><b>19</b><b>…</b></span> ؟", "o": ["400", "403", "407", "411"], "a": 1, "f": "", "s": ["الحد = 7 + 99 × 4 = 7 + 396 = 403."], "c": 4}, "pr": [{"q": "كم عدداً في المتتابعة <span class=\"ns\"><b>5</b><b>8</b><b>11</b><b>…</b><b>98</b></span> ؟", "o": ["33", "32", "31", "30"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "ما مجموع الأعداد من 1 إلى 50؟", "o": ["1225", "1250", "1275", "2550"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L3-11", "n": 11, "t": "النسب المئوية المتتالية", "concept": "خصم ثم خصم، أو زيادة ثم خصم. الحل: ننفّذ الخصمين بالترتيب على المبلغ، ولا نجمع النسب.", "fast": ["نفّذ الخصم الأول على السعر، ثم نفّذ الخصم الثاني على السعر الجديد (وليس على السعر الأصلي).", "إذا لم يُذكر مبلغ، افرض السعر 100 ريال وجرّب عليه: 100 ← خصم 10٪ = 90 ← خصم 20٪ من 90 (18) = 72 ← الخصم الكلي 28٪.", "الزيادة بالطريقة نفسها: 100 ← زيادة 20٪ = 120 ← خصم 20٪ من 120 (24) = 96، أي أقل من الأصل."], "trap": "لا تجمع النسب: خصم 10٪ ثم 20٪ ليس 30٪، لأن الخصم الثاني من مبلغ أصغر.", "table": null, "new": false, "ex": {"q": "سلعة سعرها 200 ريال، رُفع سعرها 25٪ ثم خُفّض 20٪. كم سعرها الآن؟", "o": ["190", "195", "200", "210"], "a": 2, "f": "", "s": ["الزيادة: 25٪ من 200 = 50 ← 200 + 50 = 250 ريال.", "الخصم من السعر الجديد: 20٪ من 250 = 50 ← 250 − 50 = 200 ريال."], "c": 4}, "pr": [{"q": "خصم 50٪ يليه خصم إضافي 20٪ يعادل خصماً واحداً قدره:", "o": ["60٪", "70٪", "65٪", "55٪"], "a": 0, "f": "", "s": [], "c": 4}, {"q": "عدد سكان قرية 5000 نسمة، ويزيد 10٪ كل سنة. كم يصبح بعد سنتين؟", "o": ["6000", "6050", "6100", "5500"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L3-12", "n": 12, "t": "التناسب المركّب (عمال × زمن × إنتاج)", "concept": "أكثر من متغيرين معاً: عمال وأيام وقطع، أو آلات وساعات وعلب.", "fast": ["أوجد إنتاج الوحدة: الإنتاج ÷ (العدد × الزمن).", "المطلوب = الإنتاج الجديد ÷ (إنتاج الوحدة × الزمن الجديد).", "تحقّق بالمنطق: زمن أقل ← عدد أكبر."], "trap": null, "table": null, "new": false, "ex": {"q": "6 آلات تنتج 180 علبة في 4 ساعات. كم آلة تلزم لإنتاج 450 علبة في 5 ساعات؟", "o": ["8", "10", "12", "15"], "a": 2, "f": "", "s": ["إنتاج الآلة في الساعة = 180 ÷ (6 × 4) = 7.5 علبة.", "العدد = 450 ÷ (7.5 × 5) = 450 ÷ 37.5 = 12 آلة."], "c": 4}, "pr": [{"q": "مطبعة تطبع 90 صفحة في 6 دقائق. كم مطبعة تلزم لطباعة 300 صفحة في 4 دقائق؟", "o": ["4", "5", "6", "8"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "5 قطط تصطاد 5 فئران في 5 دقائق. كم قطة تلزم لاصطياد 100 فأر في 100 دقيقة؟", "o": ["5", "20", "100", "25"], "a": 0, "f": "", "s": [], "c": 4}]}, {"id": "L3-13", "n": 13, "t": "الحل العكسي (من النهاية للبداية)", "concept": "سلسلة عمليات على عدد مجهول (صرف، إضافة، تسلّق) والمعطى هو الناتج الأخير.", "fast": ["ابدأ من الناتج الأخير واعكس كل عملية: نصف ← × 2 ، طرح ← جمع.", "في «أضفنا إليه نصفه وربعه»: العدد × (1 + ½ + ¼).", "في التسلّق اليومي: اليوم الأخير لا يُحسب فيه الانزلاق."], "trap": null, "table": null, "new": false, "ex": {"q": "صرف شخص نصف راتبه، ثم صرف 600 ريال، ثم نصف الباقي، فبقي معه 900 ريال. كم راتبه؟", "o": ["3600", "4200", "4800", "5400"], "a": 2, "f": "", "s": ["900 × 2 = 1800 ← + 600 = 2400 ← × 2 = 4800 ريال."], "c": 4}, "pr": [{"q": "ما العدد الذي إذا أضفنا إليه ثلثه وسدسه أصبح الناتج 900؟", "o": ["450", "540", "600", "720"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "ضفدع في بئر عمقها 20 م، يصعد 4 م نهاراً وينزلق 2 م ليلاً. في أي يوم يخرج؟", "o": ["8", "9", "10", "18"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L3-14", "n": 14, "t": "الحساب الذكي (الاختصار والتجميع)", "concept": "مقادير طويلة تبدو صعبة، لكنها تختصر بفكرة واحدة.", "fast": ["حاصل ضرب أقواس متتالية: اكتب أول قوسين وآخر قوس ولاحظ الاختصار.", "أخرج العامل المشترك: 999 × 25 + 25 = 25 × 1000.", "فرق مربعين: أ² − ب² = (أ − ب)(أ + ب)."], "trap": null, "table": null, "new": false, "ex": {"q": "ما قيمة: (1 − <span class=\"fr\"><span>1</span><span>2</span></span>) (1 − <span class=\"fr\"><span>1</span><span>3</span></span>) (1 − <span class=\"fr\"><span>1</span><span>4</span></span>) … (1 − <span class=\"fr\"><span>1</span><span>50</span></span>) ؟", "o": ["<span class=\"fr\"><span>1</span><span>49</span></span>", "<span class=\"fr\"><span>1</span><span>50</span></span>", "<span class=\"fr\"><span>49</span><span>50</span></span>", "<span class=\"fr\"><span>1</span><span>100</span></span>"], "a": 1, "f": "", "s": ["= <span class=\"fr\"><span>1</span><span>2</span></span> × <span class=\"fr\"><span>2</span><span>3</span></span> × <span class=\"fr\"><span>3</span><span>4</span></span> × … × <span class=\"fr\"><span>49</span><span>50</span></span> ← كل بسط يختصر مع المقام السابق، فيبقى <span class=\"fr\"><span>1</span><span>50</span></span>."], "c": 4}, "pr": [{"q": "ما قيمة: 999 × 25 + 25 ؟", "o": ["25025", "24975", "25000", "24999"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "ما قيمة: 50<sup>2</sup> − 49<sup>2</sup> ؟", "o": ["1", "99", "100", "2401"], "a": 1, "f": "", "s": [], "c": 4}]}, {"id": "L3-15", "n": 15, "t": "الأسس وقوانينها", "concept": "معادلات أُسّية، والمطلوب قيمة مقدار آخر وليس قيمة س.", "fast": ["أ<sup>س+ن</sup> = أ<sup>س</sup> × أ<sup>ن</sup> ، و أ<sup>س−ن</sup> = أ<sup>س</sup> ÷ أ<sup>ن</sup>.", "9<sup>س</sup> = (3²)<sup>س</sup> = (3<sup>س</sup>)<sup>2</sup> : حوّل إلى الأساس المعطى.", "لا تبحث عن س؛ عبّر عن المطلوب بدلالة أ<sup>س</sup>."], "trap": null, "table": null, "new": false, "ex": {"q": "إذا كان 2<sup>س+3</sup> = 48 ، فما قيمة 2<sup>س</sup> ؟", "o": ["3", "6", "8", "16"], "a": 1, "f": "", "s": ["2<sup>س</sup> × 8 = 48 ← 2<sup>س</sup> = 6."], "c": 4}, "pr": [{"q": "إذا كان 3<sup>س</sup> = 5 ، فما قيمة 9<sup>س</sup> ؟", "o": ["10", "15", "25", "125"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "إذا كان 5<sup>س−1</sup> = 4 ، فما قيمة 5<sup>س+1</sup> ؟", "o": ["100", "20", "40", "125"], "a": 0, "f": "", "s": [], "c": 4}]}, {"id": "L3-16", "n": 16, "t": "التقويم والساعات وفروق التوقيت", "concept": "اليوم بعد عدد كبير من الأيام، ساعة تتأخر، أو فرق توقيت بين مدينتين.", "fast": ["أيام الأسبوع: اقسم على 7 وخذ الباقي فقط.", "الساعة المتأخرة: التأخير الكلي = التأخير في الساعة × عدد الساعات.", "المدينة التي «تسبق» = نضيف الفرق، والتي «تتأخر» = نطرحه."], "trap": null, "table": null, "new": false, "ex": {"q": "إذا كان اليوم الخميس، فما اليوم بعد 500 يوم؟", "o": ["السبت", "الأحد", "الإثنين", "الأربعاء"], "a": 1, "f": "", "s": ["500 = 7 × 71 + 3 ← نتقدم 3 أيام من الخميس ← الأحد."], "c": 4}, "pr": [{"q": "ساعة تتأخر 15 دقيقة كل ساعة، ضُبطت على 8:00 صباحاً. ماذا تشير بعد 4 ساعات حقيقية؟", "o": ["11:00", "11:15", "12:00", "11:45"], "a": 0, "f": "", "s": [], "c": 4}, {"q": "مدينة تسبق مكة بـ 3 ساعات. إذا كانت الساعة في مكة 10:00 صباحاً، فالساعة في تلك المدينة:", "o": ["7:00 صباحاً", "1:00 ظهراً", "12:00 ظهراً", "3:00 عصراً"], "a": 1, "f": "", "s": [], "c": 2}]}, {"id": "L3-17", "n": 17, "t": "السرعة النسبية والقطارات", "concept": "قطار يعبر جسراً أو يمر أمام شخص، أو جسمان يقتربان. أصعب أفكار السرعة في المستوى الثالث.", "fast": ["عبور جسر أو نفق: المسافة = طول القطار + طول الجسر.", "المرور أمام شخص أو عمود: المسافة = طول القطار فقط.", "متعاكسان: نجمع السرعتين، ونفس الاتجاه: نطرحهما. وحّد الوحدات أولاً."], "trap": null, "table": null, "new": false, "ex": {"q": "قطار طوله 200 م يسير بسرعة 20 م/ث. كم ثانية يستغرق لعبور جسر طوله 300 م؟", "o": ["10", "15", "25", "30"], "a": 2, "f": "", "s": ["المسافة = 200 + 300 = 500 م ← الزمن = 500 ÷ 20 = 25 ثانية."], "c": 4}, "pr": [{"q": "يجلس رجل في قطار سرعته 15 م/ث، ومرّ أمامه قطار بضائع في الاتجاه المعاكس بسرعة 25 م/ث خلال 6 ثوانٍ. ما طول قطار البضائع؟", "o": ["60 م", "150 م", "240 م", "400 م"], "a": 2, "f": "", "s": [], "c": 4}, {"q": "سيارتان في الاتجاه نفسه بسرعتي 90 و 60 كم/س، والمسافة بينهما 15 كم. بعد كم دقيقة تلحق السريعة بالبطيئة؟", "o": ["30", "15", "10", "60"], "a": 0, "f": "", "s": [], "c": 4}]}, {"id": "L3-18", "n": 18, "t": "الدائرة والمساحات المظللة", "concept": "أجزاء مظللة بين دوائر ومربعات ومثلثات، والإجابة غالباً بدلالة «ط».", "fast": ["مساحة الدائرة = ط نق² ، ومحيطها = 2 ط نق.", "المظلّل = الشكل الكبير − الشكل الأبيض (لا تحسب المظلل مباشرة).", "ربع دائرة − مثلث قائم = القطعة بين القوس والوتر."], "trap": null, "table": null, "new": false, "ex": {"q": "مربع طول ضلعه 8 سم، بداخله 4 دوائر متطابقة متماسة كما في الشكل. ما مساحة الجزء المظلّل؟", "o": ["64 − 16ط", "64 − 4ط", "16ط", "64 − 8ط"], "a": 0, "f": "<svg class=\"fig\" viewBox=\"0 0 136 150\" width=\"136\" height=\"150\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"8\" y=\"8\" width=\"120\" height=\"120\" fill=\"#a5b4fc\" stroke=\"#312e81\" stroke-width=\"2\"/><circle cx=\"38.0\" cy=\"38.0\" r=\"30.0\" fill=\"#fff\" stroke=\"#312e81\" stroke-width=\"1.6\"/><circle cx=\"38.0\" cy=\"38.0\" r=\"1.8\" fill=\"#312e81\"/><circle cx=\"38.0\" cy=\"98.0\" r=\"30.0\" fill=\"#fff\" stroke=\"#312e81\" stroke-width=\"1.6\"/><circle cx=\"38.0\" cy=\"98.0\" r=\"1.8\" fill=\"#312e81\"/><circle cx=\"98.0\" cy=\"38.0\" r=\"30.0\" fill=\"#fff\" stroke=\"#312e81\" stroke-width=\"1.6\"/><circle cx=\"98.0\" cy=\"38.0\" r=\"1.8\" fill=\"#312e81\"/><circle cx=\"98.0\" cy=\"98.0\" r=\"30.0\" fill=\"#fff\" stroke=\"#312e81\" stroke-width=\"1.6\"/><circle cx=\"98.0\" cy=\"98.0\" r=\"1.8\" fill=\"#312e81\"/><text x=\"68.0\" y=\"140\" font-size=\"11\" fill=\"#312e81\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Cairo, DejaVu Sans\">8 سم</text></svg>", "s": ["نصف قطر الدائرة = 2 سم ← مساحة الدوائر الأربع = 4 × ط × 4 = 16ط.", "المظلل = 64 − 16ط سم²."], "c": 4}, "pr": [{"q": "في الشكل ربع دائرة نصف قطرها 6 سم. ما مساحة الجزء المظلّل بين القوس والوتر؟", "o": ["36ط − 18", "9ط − 18", "9ط", "18 − 9ط"], "a": 1, "f": "<svg class=\"fig\" viewBox=\"0 0 130 144\" width=\"130\" height=\"144\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M10,10 A110,110 0 0 1 120,120 Z\" fill=\"#a5b4fc\"/><path d=\"M10,10 L10,120 L120,120\" fill=\"none\" stroke=\"#312e81\" stroke-width=\"2\"/><path d=\"M10,10 A110,110 0 0 1 120,120\" fill=\"none\" stroke=\"#312e81\" stroke-width=\"2\"/><line x1=\"10\" y1=\"10\" x2=\"120\" y2=\"120\" stroke=\"#312e81\" stroke-width=\"2\"/><rect x=\"10\" y=\"110\" width=\"10\" height=\"10\" fill=\"none\" stroke=\"#312e81\"/><text x=\"65.0\" y=\"132\" font-size=\"11\" fill=\"#312e81\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Cairo, DejaVu Sans\">6 سم</text></svg>", "s": [], "c": 4}, {"q": "دائرتان لهما المركز نفسه، نصفا قطريهما 5 سم و 3 سم. ما مساحة الحلقة بينهما؟", "o": ["4ط", "8ط", "16ط", "34ط"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L3-19", "n": 19, "t": "الزوايا والمضلعات", "concept": "زوايا المثلث، الزاوية الخارجية، المتوازيان والقاطع، وزوايا المضلعات.", "fast": ["مجموع زوايا المثلث 180°، والزاوية الخارجية = مجموع الداخليتين البعيدتين.", "مجموع زوايا المضلع الداخلية = (ن − 2) × 180°.", "مع متوازيين: الزوايا المتبادلة متساوية، والمتحالفة مجموعها 180°."], "trap": null, "table": null, "new": false, "ex": {"q": "مثلث قياس زاويتين فيه 50° و 70°. ما قياس الزاوية الخارجية عند الرأس الثالث؟", "o": ["60°", "110°", "120°", "130°"], "a": 2, "f": "", "s": ["الخارجية = 50 + 70 = 120° مباشرة (دون حساب الزاوية الثالثة)."], "c": 4}, "pr": [{"q": "ما مجموع قياسات الزوايا الداخلية للشكل السداسي؟", "o": ["540°", "720°", "900°", "1080°"], "a": 1, "f": "", "s": [], "c": 4}, {"q": "ما قياس الزاوية الداخلية الواحدة في المضلع الثماني المنتظم؟", "o": ["150°", "140°", "135°", "120°"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L3-20", "n": 20, "t": "نظرية فيثاغورس والمسافات", "concept": "أقصر مسافة، أو ضلع ناقص في مثلث قائم، أو محيط حديقة على شكل مثلث قائم.", "fast": ["الوتر² = الضلع الأول² + الضلع الثاني².", "احفظ الثلاثيات: (3، 4، 5) ومضاعفاتها (6، 8، 10) و(9، 12، 15)، و(5، 12، 13).", "الحركة شرقاً ثم شمالاً = ضلعا قائمة، وأقصر طريق للعودة هو الوتر."], "trap": null, "table": null, "new": false, "ex": {"q": "سار سالم 6 م شرقاً ثم 8 م شمالاً. ما أقصر مسافة ليعود إلى نقطة البداية؟", "o": ["10 م", "12 م", "14 م", "7 م"], "a": 0, "f": "", "s": ["الثلاثية (6، 8، 10) ← 10 م مباشرة."], "c": 4}, "pr": [{"q": "حديقة على شكل مثلث قائم، ضلعا القائمة 9 م و 12 م. جرى أحمد حولها مرتين. كم متراً قطع؟", "o": ["42", "54", "84", "72"], "a": 3, "f": "", "s": [], "c": 4}, {"q": "سلم طوله 13 م يستند إلى حائط، وقاعدته تبعد 5 م عن الحائط. ما ارتفاع النقطة التي يصل إليها؟", "o": ["8 م", "10 م", "12 م", "18 م"], "a": 2, "f": "", "s": [], "c": 4}]}, {"id": "L3-21", "n": 21, "t": "المكعبات المدهونة والمجسمات", "concept": "مكعب مدهون من الخارج يُقسّم إلى مكعبات صغيرة، أو عدد المكعبات التي يتسع لها صندوق.", "fast": ["مكعب مقسّم ن × ن × ن: ثلاثة أوجه = 8 (الأركان دائماً).", "وجهان = 12 × (ن − 2) ، وجه واحد = 6 × (ن − 2)² ، بلا دهان = (ن − 2)³.", "عدد المكعبات في صندوق = (الطول ÷ الحرف) × (العرض ÷ الحرف) × (الارتفاع ÷ الحرف)."], "trap": null, "table": null, "new": false, "ex": {"q": "مكعب مدهون من جميع أوجهه قُسّم إلى 64 مكعباً صغيراً متساوياً كما في الشكل. كم مكعباً دُهن على وجهين فقط؟", "o": ["8", "16", "24", "32"], "a": 2, "f": "<svg class=\"fig\" viewBox=\"0 0 162 186\" width=\"162\" height=\"186\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"81.2,5.0 157.4,49.0 81.2,93.0 5.0,49.0\" fill=\"#c7d2fe\" stroke=\"#1e1b4b\" stroke-width=\"1.6\"/><polygon points=\"157.4,49.0 81.2,93.0 81.2,181.0 157.4,137.0\" fill=\"#818cf8\" stroke=\"#1e1b4b\" stroke-width=\"1.6\"/><polygon points=\"5.0,49.0 81.2,93.0 81.2
