<style>
:root{--bg:#f3f5f9;--surface:#fff;--ink:#151b2c;--muted:#5d667b;--line:#e1e5ee;--acc:#0f766e;--acc2:#0e7a86;--band:#115e59;--or:#f97316;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.7 "Tajawal",system-ui,sans-serif}
h1,h2,h3,b,.btn{font-family:"Cairo","Tajawal",system-ui,sans-serif}
.top{background:linear-gradient(120deg,var(--band),var(--acc));color:#fff}
.top .in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.top img{width:40px;height:40px;border-radius:10px;background:#fff}
.top b{display:block;font-size:19px;line-height:1.2}.top small{opacity:.85;font-size:12.5px}
.top a.back{margin-inline-start:auto;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px}
main{max-width:760px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 1px 2px rgba(20,27,44,.06),0 8px 24px rgba(20,27,44,.08);overflow:hidden}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:18px 20px;background:linear-gradient(120deg,#0b5d68,#0e7a86);color:#fff}
.hero h1{margin:0;font-size:clamp(20px,4vw,26px);font-weight:900}
.hero p{margin:4px 0 0;opacity:.92}
.price{background:#fff;color:#0b5d68;border-radius:16px;padding:8px 16px;text-align:center}
.price b{display:block;font-size:32px;line-height:1.1;color:var(--or);font-weight:900}
.price span{font-weight:800;font-size:13px}.price small{display:block;font-size:11.5px;color:var(--muted)}
.body{padding:18px 20px;display:grid;gap:14px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.steps li{flex:1 1 0;min-width:120px;display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);font-size:14px}
.steps li i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e6ebf2;color:var(--muted);font-weight:900;flex:none}
.steps li.on{color:var(--ink)}.steps li.on i{background:var(--or);color:#fff}.steps li.ok i{background:var(--ok);color:#fff}
label.f{display:grid;gap:6px;font-weight:700}
label.f small{color:var(--muted);font-weight:500}
input[type=text],input[type=tel]{font:inherit;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;width:100%}
input:focus{outline:3px solid color-mix(in srgb,var(--acc) 30%,transparent);border-color:var(--acc)}
.lvs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lvs label{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;display:grid;gap:2px}
.lvs input{position:absolute;opacity:0;pointer-events:none}
.lvs b{font-size:15px}.lvs small{color:var(--muted);font-size:12.5px}
.lvs label:has(input:checked){border-color:var(--acc);background:#e3f4f1;box-shadow:0 0 0 2px var(--acc) inset}
.lvs label:has(input:focus-visible){outline:3px solid #f59e0b}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;color:#fff;background:var(--acc)}
.btn.or{background:var(--or)}.btn.ghost{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--bad);font-weight:700;margin:0}
.note{color:var(--muted);font-size:14px;margin:0}
.sum{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#f8f9fc;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.sum span{color:var(--muted)}.sum b{font-size:15px}
.mysr-form{margin:0 auto;width:100%}
.testbadge{display:inline-block;background:#fef3c7;color:#92400e;border-radius:999px;padding:0 10px;font-weight:800;font-size:12.5px}
.creds{border:2px dashed var(--ok);border-radius:16px;padding:14px 16px;background:#f0fdf4;display:grid;gap:8px}
.creds div{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.creds dt{color:var(--muted);margin:0}.creds dd{margin:0;font-weight:900;font-family:"Cairo",sans-serif;font-size:20px}
.creds dd.v{direction:ltr;unicode-bidi:isolate;letter-spacing:1px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:2px 12px;user-select:all}
.big{font-size:44px;text-align:center;line-height:1}
.center{text-align:center}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid #e6ebf2;border-top-color:var(--acc);animation:sp 1s linear infinite;margin:6px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.pmethods{display:flex;gap:6px;flex-wrap:wrap}.pmethods span{border:1px solid var(--line);border-radius:8px;padding:0 8px;font-weight:800;font-size:13px;background:#fff}
@media (max-width:560px){.hero{grid-template-columns:1fr}.price{justify-self:start}.lvs{grid-template-columns:1fr}.body,.hero{padding:16px}}
</style>
</head>

<main id="app"><div class="card"><div class="body center"><div class="spin"></div></div></div></main>
<script>
const API = "https://api.mawhibax.com";
const FB_CFG = { apiKey: "AIzaSyCb037r9uPbfjxtT2Jsoi0ynFpyToMwNvI", authDomain: "booktests-c98a1.firebaseapp.com", projectId: "booktests-c98a1", storageBucket: "booktests-c98a1.firebasestorage.app", messagingSenderId: "1037704933101", appId: "1:1037704933101:web:04fa0cec222e945ed666e4" };
const STU_DOMAIN = "students.booktests.app";
const LV = { 1: ["المستوى الأول", "الصفان الثالث والرابع الابتدائي"], 2: ["المستوى الثاني", "الصف السادس الابتدائي"], 3: ["المستوى الثالث", "الصف الثالث المتوسط"] };
const SALES = "0597705599", SALES_WA = "966597705599";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
let CFG = null;

function shell(step, inner, sub) {
  const st = ["بيانات الطالب", "الدفع", "الحساب جاهز"].map((x, i) => `<li class="${i + 1 < step ? "ok" : i + 1 === step ? "on" : ""}"><i>${i + 1 < step ? "✓" : i + 1}</i>${x}</li>`).join("");
  $("#app").innerHTML = `<section class="card"><div class="hero"><div><h1>اشترك في موهبة إكسبريس</h1><p>${sub || "ادفع بـ Apple Pay أو مدى أو البطاقة، واحصل على حسابك فورًا."}</p></div>
  <div class="price"><b>150</b><span>ريال</span><small>شامل الضريبة</small></div></div>
  <div class="body"><ol class="steps">${st}</ol>${inner}</div></section>
  <p class="note center">للاستفسار: شركة بوت للتسويق <a href="https://wa.me/${SALES_WA}" target="_blank" rel="noopener" dir="ltr">${SALES}</a></p>`;
}
function unavailable(msg) {
  shell(1, `<p class="err">${msg || "الدفع الإلكتروني غير متاح الآن."}</p><p class="note">تقدر تشترك بالتحويل البنكي من صفحة المنصة، أو تواصل معنا على واتساب.</p>
  <div class="row"><a class="btn" href="./">الرجوع للمنصة</a><a class="btn ghost" href="https://wa.me/${SALES_WA}" target="_blank" rel="noopener">واتساب ${SALES}</a></div>`);
}

/* ---------- step 1: student details ---------- */
function viewForm(err) {
  const d = store.get("mx-pay-form") || {};
  const pre = new URLSearchParams(location.search).get("level");
  const lv = String(d.level || pre || "");
  shell(1, `<form id="f" class="body" style="padding:0" novalidate>
   <label class="f">اسم الطالب<small>كما تحب أن يظهر في المنصة والتقارير</small><input type="text" id="nm" maxlength="60" autocomplete="name" required value="${esc(d.name || "")}"></label>
   <div class="f" role="radiogroup" aria-label="المستوى"><b>المستوى</b><div class="lvs">${[1, 2, 3].map(l => `<label><input type="radio" name="lv" value="${l}" ${lv === String(l) ? "checked" : ""}><b>${LV[l][0]}</b><small>${LV[l][1]}</small></label>`).join("")}</div></div>
   <label class="f">جوال ولي الأمر<small>للتواصل وإرسال التقارير</small><input type="tel" id="ph" inputmode="tel" dir="ltr" placeholder="05xxxxxxxx" maxlength="15" value="${esc(d.phone || "")}"></label>
   ${err ? `<p class="err" role="alert">${err}</p>` : ""}
   <div class="row"><button class="btn or" type="submit">متابعة إلى الدفع</button><span class="pmethods" aria-label="طرق الدفع"><span>Apple Pay</span><span>مدى</span><span>VISA</span><span>Mastercard</span></span></div>
   ${CFG && CFG.test ? `<p class="note"><span class="testbadge">وضع التجربة</span> لا يتم سحب أي مبلغ حقيقي.</p>` : ""}
  </form>`);
  $("#f").onsubmit = e => {
    e.preventDefault();
    const name = $("#nm").value.trim().replace(/\s+/g, " "), level = Number((document.querySelector("input[name=lv]:checked") || {}).value || 0);
    let phone = $("#ph").value.replace(/[^\d]/g, "");
    if (name.length < 3) return viewForm("اكتب اسم الطالب (٣ أحرف على الأقل).");
    if (!level) return viewForm("اختر مستوى الطالب.");
    if (!/^(05\d{8}|5\d{8}|9665\d{8})$/.test(phone)) { store.set("mx-pay-form", { name, level, phone: $("#ph").value }); return viewForm("اكتب رقم جوال سعودي صحيح يبدأ بـ 05."); }
    store.set("mx-pay-form", { name, level, phone });
    viewPay({ name, level, phone });
  };
}

/* ---------- step 2: Moyasar form (Apple Pay + mada / cards) ---------- */
function viewPay(d) {
  shell(2, `<div class="sum"><span>الطالب</span><b>${esc(d.name)}</b><span>المستوى</span><b>${LV[d.level][0]}</b><span>المبلغ</span><b>150 ريال</b></div>
   <div class="mysr-form"></div>
   <div class="row"><button class="btn ghost" type="button" id="bk">تعديل البيانات</button></div>
   ${CFG.test ? `<p class="note"><span class="testbadge">وضع التجربة</span> استخدم بطاقة تجريبية من ميسّر.</p>` : ""}`,
   "Apple Pay يظهر تلقائيًا على أجهزة آبل (Safari). ويمكنك الدفع بمدى أو البطاقة من أي جهاز.");
  $("#bk").onclick = () => viewForm();
  Moyasar.init({
    element: ".mysr-form",
    amount: CFG.amount, currency: CFG.currency,
    description: `اشتراك موهبة إكسبريس - ${LV[d.level][0]} - ${d.name}`,
    publishable_api_key: CFG.pk,
    callback_url: location.origin + location.pathname,
    methods: ["applepay", "creditcard"],
    supported_networks: ["mada", "visa", "mastercard"],
    language: "ar",
    metadata: { student_name: d.name, level: String(d.level), parent_phone: d.phone },
    apple_pay: { country: "SA", label: "موهبة إكسبريس", validate_merchant_url: "https://api.moyasar.com/v1/applepay/initiate" },
    on_completed: async payment => { store.set("mx-pay-id", payment.id); }
  });
}

/* ---------- step 3: after payment — activate and show the account ---------- */
async function viewActivate(id, attempt = 0) {
  shell(3, `<div class="center"><div class="spin"></div><p><b>جاري تفعيل حسابك…</b></p><p class="note">لا تغلق الصفحة، يستغرق ثوانٍ.</p></div>`);
  let r;
  try { r = await (await fetch(API + "/activate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) })).json(); }
  catch (e) { r = { ok: false, error: "net" }; }
  if (r.ok) { store.set("mx-pay-acc", Object.assign({ id }, r)); try { localStorage.removeItem("mx-pay-id"); localStorage.removeItem("mx-pay-form"); } catch (e) { } return viewDone(r); }
  if ((r.error === "busy" || r.error === "net" || r.error === "server") && attempt < 3) { await new Promise(s => setTimeout(s, 2500)); return viewActivate(id, attempt + 1); }
  if (r.error === "not_paid") {
    try { localStorage.removeItem("mx-pay-id"); } catch (e) { }
    shell(2, `<p class="err" role="alert">لم تكتمل عملية الدفع، ولم يُخصم أي مبلغ.</p><div class="row"><button class="btn or" id="again">حاول مرة أخرى</button></div>`);
    $("#again").onclick = () => { history.replaceState(null, "", location.pathname); viewForm(); };
    return;
  }
  shell(3, `<p class="err" role="alert">تم استلام الدفع، لكن تعذّر تفعيل الحساب تلقائيًا الآن.</p>
   <p>لا تقلق، اشتراكك محفوظ. أرسل رقم العملية لنا على واتساب ونفعّل حسابك فورًا:</p>
   <div class="sum"><span>رقم العملية</span><b dir="ltr" style="user-select:all">${esc(id)}</b></div>
   <div class="row"><button class="btn" id="retry">إعادة المحاولة</button><a class="btn ghost" href="https://wa.me/${SALES_WA}?text=${encodeURIComponent("السلام عليكم، دفعت اشتراك موهبة إكسبريس ولم يتفعل الحساب. رقم العملية: " + id)}" target="_blank" rel="noopener">واتساب ${SALES}</a></div>`);
  $("#retry").onclick = () => viewActivate(id);
}
function credText(a) {
  return `بيانات الدخول لمنصة موهبة إكسبريس
الطالب: ${a.name}
المستوى: ${(a.levels || []).map(l => LV[l] ? LV[l][0] : l).join(" و")}
كود الطالب: ${a.code}
كلمة المرور: ${a.password}
رابط المنصة: https://mawhibax.com`;
}
function viewDone(a) {
  shell(4, `<div class="center"><div class="big">🎉</div><h2 style="margin:6px 0 0">تم الاشتراك وتفعيل الحساب</h2><p class="note">احفظ بيانات الدخول، ستحتاجها للدخول من أي جهاز.</p></div>
   <dl class="creds"><div><dt>الطالب</dt><dd>${esc(a.name)}</dd></div><div><dt>المستوى</dt><dd>${(a.levels || []).map(l => LV[l] ? LV[l][0] : l).join(" و")}</dd></div>
   <div><dt>كود الطالب</dt><dd class="v">${esc(a.code)}</dd></div><div><dt>كلمة المرور</dt><dd class="v">${esc(a.password)}</dd></div></dl>
   <div class="row"><button class="btn or" id="go">ادخل المنصة الآن</button><button class="btn ghost" id="cp">نسخ البيانات</button><a class="btn ghost" id="wa" target="_blank" rel="noopener">إرسال لنفسي على واتساب</a></div>
   <p class="err" id="gerr" role="alert" hidden></p>
   <p class="note">الحساب يعمل على جهاز واحد في نفس الوقت. للدعم: واتساب <span dir="ltr">${SALES}</span></p>`);
  const txt = credText(a);
  $("#wa").href = "https://wa.me/?text=" + encodeURIComponent(txt);
  $("#cp").onclick = () => { const b = $("#cp"); const ok = () => { b.textContent = "تم النسخ ✓"; setTimeout(() => b.textContent = "نسخ البيانات", 1800); };
    try { navigator.clipboard.writeText(txt).then(ok, () => { fallbackCopy(txt); ok(); }); } catch (e) { fallbackCopy(txt); ok(); } };
  $("#go").onclick = async () => {
    const b = $("#go"); b.disabled = true; b.textContent = "جاري الدخول…";
    try {
      if (!firebase.apps.length) firebase.initializeApp(FB_CFG);
      await firebase.auth().signInWithEmailAndPassword(`${a.code}@${STU_DOMAIN}`, a.password);
      try { localStorage.setItem("qs-level", JSON.stringify(Number((a.levels || [1])[0]))); } catch (e) { }
      location.href = "./";
    } catch (e) { b.disabled = false; b.textContent = "ادخل المنصة الآن"; const g = $("#gerr"); g.hidden = false; g.textContent = "تعذّر الدخول تلقائيًا. افتح المنصة واضغط «دخول المشتركين» واكتب الكود وكلمة المرور."; }
  };
}
function fallbackCopy(t) { const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) { } ta.remove(); }

/* ---------- start ---------- */
(async function start() {
  const q = new URLSearchParams(location.search);
  const id = q.get("id"), status = q.get("status");
  const acc = store.get("mx-pay-acc");
  if (id && acc && acc.id === id) return viewDone(acc);
  if (id) return viewActivate(id);
  const pending = store.get("mx-pay-id");          // paid but the redirect never came back
  if (pending) return viewActivate(pending);
  if (acc && q.get("show") === "1") return viewDone(acc);
  try { const r = await fetch(API + "/config", { cache: "no-store" }); CFG = await r.json(); } catch (e) { CFG = null; }
  if (!CFG || !CFG.ok || typeof Moyasar === "undefined") return unavailable();
  viewForm();
})();
</script>
